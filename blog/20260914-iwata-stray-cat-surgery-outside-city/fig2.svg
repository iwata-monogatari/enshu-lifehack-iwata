<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial"><rect width="960" height="560" rx="24" fill="#f0f7fa"/><g font-family="Meiryo, sans-serif" fill="#173c52"><text x="45" y="57" font-size="29" font-weight="bold">市外の病院でも、手術の前に申請</text><text x="45" y="93" font-size="20">今日の一歩は、環境課への対象確認</text><rect x="45" y="125" width="260" height="143" rx="16" fill="white"/><circle cx="77" cy="157" r="20" fill="#0074ae"/><text x="70" y="165" font-size="22" fill="white">1</text><text x="62" y="206" font-size="24" font-weight="bold">対象・費用を確認</text><text x="62" y="238" font-size="15">市へ対象、病院へ費用を聞く</text><rect x="350" y="125" width="260" height="143" rx="16" fill="white"/><circle cx="382" cy="157" r="20" fill="#0074ae"/><text x="375" y="165" font-size="22" fill="white">2</text><text x="367" y="206" font-size="24" font-weight="bold">事前に申請</text><text x="367" y="238" font-size="15">申請書・調査票・猫の写真</text><rect x="655" y="125" width="260" height="143" rx="16" fill="white"/><circle cx="687" cy="157" r="20" fill="#0074ae"/><text x="680" y="165" font-size="22" fill="white">3</text><text x="672" y="206" font-size="24" font-weight="bold">交付決定</text><text x="672" y="238" font-size="15">通知書を受け取る</text><rect x="45" y="295" width="260" height="143" rx="16" fill="white"/><circle cx="77" cy="327" r="20" fill="#0074ae"/><text x="70" y="335" font-size="22" fill="white">4</text><text x="62" y="376" font-size="24" font-weight="bold">病院で手術</text><text x="62" y="408" font-size="15">通知書を提示・耳V字カット</text><rect x="350" y="295" width="260" height="143" rx="16" fill="white"/><circle cx="382" cy="327" r="20" fill="#0074ae"/><text x="375" y="335" font-size="22" fill="white">5</text><text x="367" y="376" font-size="24" font-weight="bold">完了報告</text><text x="367" y="408" font-size="15">手術日から起算して8日以内</text><rect x="655" y="295" width="260" height="143" rx="16" fill="white"/><circle cx="687" cy="327" r="20" fill="#0074ae"/><text x="680" y="335" font-size="22" fill="white">6</text><text x="672" y="376" font-size="24" font-weight="bold">審査・振り込み</text><text x="672" y="408" font-size="15">指定口座へ補助金を交付</text><path d="M314 195h25 M619 195h25 M314 365h25 M619 365h25" stroke="#0074ae" stroke-width="4"/><text x="45" y="484" font-size="19">手術期限：交付決定通知書の翌日の日付から起算して61日以内</text><text x="45" y="519" font-size="18">通知書の日付が3月中なら3月末日まで。市公式PDF／2026年9月14日確認</text></g></svg>