<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" data-illustration="iwata-editorial"><rect width="960" height="620" rx="24" fill="#f5f6ee"/><g font-family="Meiryo, sans-serif" fill="#173b43"><text x="48" y="66" font-size="31" font-weight="bold">買い物と体験を、無理なく組み合わせる</text><text x="48" y="107" font-size="23">大石の提案 ／ 公式の館内順路ではありません</text>
<rect x="48" y="150" width="550" height="104" rx="16" fill="#d9eee7"/><text x="76" y="190" font-size="26" font-weight="bold">1　寄りたい一つを決める</text><text x="76" y="228" font-size="23">ブース名 ＋ 階 ＋ 時間</text><path d="M320 262v28m-10-10 10 10 10-10" fill="none" stroke="#246374" stroke-width="5"/>
<rect x="48" y="302" width="550" height="104" rx="16" fill="#dcebf6"/><text x="76" y="342" font-size="26" font-weight="bold">2　買い物・食事と順番を考える</text><text x="76" y="380" font-size="23">荷物、空腹、階の行き来を見直す</text><path d="M320 414v28m-10-10 10 10 10-10" fill="none" stroke="#246374" stroke-width="5"/>
<rect x="48" y="454" width="550" height="104" rx="16" fill="#fff0cf"/><text x="76" y="494" font-size="26" font-weight="bold">3　帰る時刻で切り上げる</text><text x="76" y="532" font-size="23">一つ楽しんだら、それで十分</text>
<path d="M606 354h38m-10-10 10 10-10 10" fill="none" stroke="#246374" stroke-width="5"/><rect x="664" y="262" width="248" height="188" rx="18" fill="white" stroke="#94b4b6" stroke-width="2"/><text x="687" y="310" font-size="25" font-weight="bold">待つのが難しい</text><text x="687" y="354" font-size="23">休憩する</text><text x="687" y="394" font-size="23">今日は見送る</text><text x="48" y="598" font-size="18">家庭ごとの計画用の図です。体験時間や待ち時間を保証するものではありません。</text></g></svg>