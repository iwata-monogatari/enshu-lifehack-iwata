<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" data-illustration="iwata-editorial"><rect width="960" height="660" rx="24" fill="#f0f6f5"/><g font-family="Meiryo, sans-serif" fill="#173b43"><text x="48" y="68" font-size="32" font-weight="bold">エコフェスいわた2026</text><text x="48" y="110" font-size="24">今日は、どれを一つ選ぶ？</text><rect x="42" y="148" width="876" height="132" rx="18" fill="#d9eee7"/><circle cx="92" cy="199" r="28" fill="#246374"/><text x="82" y="209" fill="white" font-size="28">1</text><text x="144" y="186" font-size="26" font-weight="bold">動かしたい → 手回し発電</text><text x="144" y="224" font-size="23">2階・珈琲館前</text><text x="144" y="258" font-size="21">回す力で、ぬいぐるみが走る体験</text><rect x="42" y="296" width="876" height="132" rx="18" fill="#fff0cf"/><circle cx="92" cy="347" r="28" fill="#246374"/><text x="82" y="357" fill="white" font-size="28">2</text><text x="144" y="334" font-size="26" font-weight="bold">作りたい → 廃材アート</text><text x="144" y="372" font-size="23">1階・西広場</text><text x="144" y="406" font-size="21">みんなでアートの完成に協力</text><rect x="42" y="444" width="876" height="132" rx="18" fill="#dcebf6"/><circle cx="92" cy="495" r="28" fill="#246374"/><text x="82" y="505" fill="white" font-size="28">3</text><text x="144" y="482" font-size="26" font-weight="bold">聞きたい → 読み聞かせ</text><text x="144" y="520" font-size="23">1階・タタミラウンジ</text><text x="144" y="554" font-size="21">13:30〜14:00 ／ 14:30〜15:00</text><text x="48" y="618" font-size="18">市公式資料を基に作成（2026年9月26日確認）／館内地図ではありません</text></g></svg>