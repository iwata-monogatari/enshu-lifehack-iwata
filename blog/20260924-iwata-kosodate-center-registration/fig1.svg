<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><style>text{font-family:Meiryo,sans-serif;fill:#173c50}.heading{font-size:32px;font-weight:bold}.label{font-size:25px;font-weight:bold}.small{font-size:21px}.line{fill:none;stroke:#0074ae;stroke-width:5}</style><rect width="960" height="560" rx="24" fill="#f1f7fa"/><title id="title">利用登録の統一と施設ごとの確認</title><desc id="desc">年度に1度の共通登録から複数の施設へ。開館日と催しの予約は別に確認します。</desc><text x="48" y="61" class="heading">2026年度から、利用登録は共通に</text><rect x="55" y="130" width="300" height="235" rx="20" fill="white" stroke="#0074ae" stroke-width="3"/><rect x="82" y="163" width="50" height="85" rx="8" fill="#d7edf7" stroke="#0074ae" stroke-width="3"/><path d="M95 205l10 10 19-27" class="line"/><text x="151" y="188" class="label">利用者情報</text><text x="151" y="225" class="label">を登録</text><text x="87" y="303" class="label">年度に1度</text><path d="M355 249H432M432 165V348M432 165H506M432 256H506M432 348H506" class="line"/><g fill="white" stroke="#80b9ce" stroke-width="2"><rect x="508" y="121" width="395" height="76" rx="12"/><rect x="508" y="218" width="395" height="76" rx="12"/><rect x="508" y="315" width="395" height="76" rx="12"/></g><text x="550" y="169" class="label">いつものセンター</text><text x="550" y="266" class="label">別のセンター</text><text x="550" y="363" class="label">初めて行くセンター</text><rect x="55" y="425" width="848" height="85" rx="14" fill="#e3eee5"/><text x="83" y="462" class="label">開館日・時間と、催しの予約は別に確認</text><text x="83" y="494" class="small">市公式の利用登録案内をもとに作成した概念図</text></svg>