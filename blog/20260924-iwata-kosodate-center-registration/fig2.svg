<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><style>text{font-family:Meiryo,sans-serif;fill:#173c50}.heading{font-size:32px;font-weight:bold}.label{font-size:25px;font-weight:bold}.small{font-size:21px}.line{fill:none;stroke:#0074ae;stroke-width:5}</style><rect width="960" height="560" rx="24" fill="#f1f7fa"/><title id="title">今日確かめるのは今年度の登録状況</title><desc id="desc">2026年度の登録を確認。確認できたら次の外出準備へ。不明なら再送信の前に利用先へ相談します。</desc><text x="48" y="61" class="heading">今日は「今年度の登録」を一つ確認</text><rect x="220" y="100" width="520" height="96" rx="18" fill="white" stroke="#0074ae" stroke-width="3"/><text x="271" y="140" class="label">2026年度、登録を済ませた？</text><text x="288" y="174" class="small">入力した家族や手元の記録で確認</text><path d="M480 197V230H253V265M480 230H707V265" class="line"/><rect x="53" y="269" width="400" height="149" rx="16" fill="#e1efe4"/><rect x="507" y="269" width="400" height="149" rx="16" fill="#fff0da"/><text x="93" y="311" class="label">済んだと確認できた</text><text x="93" y="355" class="small">今日の確認はここで一区切り</text><text x="93" y="389" class="small">出かける日に開館日・予約を確認</text><text x="548" y="311" class="label">済んだか分からない</text><text x="548" y="355" class="small">再送信を決める前に</text><text x="548" y="389" class="small">利用先へ確認方法を相談する</text><text x="70" y="475" class="label">登録の確認と、外出の準備は分けてよい。</text><text x="70" y="516" class="small">家庭での整理の提案です。市の申請画面・指定手順ではありません。</text></svg>