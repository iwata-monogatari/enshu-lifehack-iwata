<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">高齢者インフルエンザ予防接種の対象と自己負担</title><rect width="440" height="600" fill="#eef7f3"/><g font-family="Meiryo,sans-serif" fill="#0a4636"><text x="24" y="58" font-size="27" font-weight="bold">対象と自己負担（令和8年度）</text><rect x="20" y="86" width="400" height="118" rx="16" fill="white" stroke="#0d7a5f"/><text x="36" y="124" font-size="25" font-weight="bold">対象（1）65歳以上の方</text><text x="36" y="168" font-size="23">接種日に磐田市に住民登録があること</text><rect x="20" y="224" width="400" height="118" rx="16" fill="white" stroke="#0d7a5f"/><text x="36" y="262" font-size="25" font-weight="bold">対象（2）60〜64歳で重い障害</text><text x="36" y="306" font-size="23">心臓・腎臓・呼吸器等（1級相当）</text><rect x="20" y="362" width="400" height="100" rx="16" fill="white" stroke="#0d7a5f"/><text x="36" y="400" font-size="25" font-weight="bold">自己負担 1,600円（1回）</text><text x="36" y="440" font-size="23">生活保護世帯は無料券で無料</text><rect x="20" y="482" width="400" height="88" rx="16" fill="#fdf0e7" stroke="#c2501e"/><text x="36" y="520" font-size="23" font-weight="bold" fill="#8a3a14">期間 2026年10月1日〜2027年3月31日</text><text x="36" y="552" font-size="21" fill="#8a3a14">予診票は協力医療機関で配布</text></g></svg>
