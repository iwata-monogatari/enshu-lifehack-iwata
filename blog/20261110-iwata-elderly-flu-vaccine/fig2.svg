<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">接種の前に確かめる3点</title><rect width="440" height="560" fill="#eef7f3"/><g font-family="Meiryo,sans-serif" fill="#0a4636"><text x="24" y="58" font-size="27" font-weight="bold">受ける前に確かめる3点</text><rect x="20" y="86" width="400" height="118" rx="16" fill="white" stroke="#0d7a5f"/><text x="36" y="124" font-size="25" font-weight="bold">1. かかりつけは協力医療機関か</text><text x="36" y="168" font-size="23">協力医療機関なら事前申請は不要</text><rect x="20" y="224" width="400" height="118" rx="16" fill="white" stroke="#0d7a5f"/><text x="36" y="262" font-size="25" font-weight="bold">2. 予約が要るかどうか</text><text x="36" y="306" font-size="23">医療機関ごとに違うので先に電話で</text><rect x="20" y="362" width="400" height="118" rx="16" fill="white" stroke="#0d7a5f"/><text x="36" y="400" font-size="25" font-weight="bold">3. 持ち物はそろっているか</text><text x="36" y="444" font-size="23">マイナ保険証など・1,600円・無料券</text><rect x="20" y="500" width="400" height="40" rx="12" fill="#e2f2ec"/><text x="220" y="528" font-size="20" text-anchor="middle">対象（2）の方は身体障害者手帳も</text></g></svg>
