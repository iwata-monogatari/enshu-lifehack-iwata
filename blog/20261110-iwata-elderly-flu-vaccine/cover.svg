<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title"><title id="title">磐田市の高齢者インフルエンザ予防接種｜自己負担1,600円と対象の確認の記事表紙</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d7a5f"/><stop offset="1" stop-color="#06473a"/></linearGradient></defs><rect width="760" height="760" fill="url(#bg)"/><g fill="none" stroke="#8fd0bd" stroke-width="3" opacity="0.5"><path d="M0 622 Q 120 600 260 620 T 520 618 T 760 614"/><path d="M0 668 Q 140 646 300 666 T 600 664 T 760 660"/><path d="M0 712 Q 120 692 280 710 T 560 708 T 760 704"/></g><rect x="96" y="96" width="568" height="470" rx="26" fill="#ffffff"/><g font-family="Meiryo,sans-serif"><rect x="128" y="128" width="176" height="48" rx="24" fill="#e2f2ec"/><text x="216" y="161" font-size="25" font-weight="bold" fill="#0a4636" text-anchor="middle">手続き・制度</text><text x="128" y="240" font-size="41" font-weight="bold" fill="#0a4636">高齢者の</text><text x="128" y="298" font-size="41" font-weight="bold" fill="#0a4636">インフルエンザ</text><text x="128" y="356" font-size="41" font-weight="bold" fill="#0a4636">予防接種</text><text x="128" y="416" font-size="30" fill="#0a4636">自己負担 <tspan font-weight="bold" fill="#c2501e">1,600円</tspan></text><text x="128" y="462" font-size="24" fill="#46685e">期間は2027年3月31日まで</text><text x="128" y="520" font-size="24" fill="#46685e">対象・持ち物・予診票の確認</text></g><g transform="translate(560,392)"><circle cx="0" cy="0" r="52" fill="#e2f2ec"/><path d="M-18 -6 q18 -26 36 0 q-6 20 -18 20 q-12 0 -18 -20" fill="#0d7a5f"/><rect x="-4" y="14" width="8" height="26" rx="4" fill="#0d7a5f"/></g></svg>
