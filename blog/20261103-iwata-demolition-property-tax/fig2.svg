<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">家族で作る四つの確認欄</title><desc id="desc">解体工事費は見積書、当年度の納付は通知書、翌年度の見通しは市への確認、解体後の管理は家族の予定から整理する。未確認の額はゼロとしない。</desc><rect width="760" height="560" rx="24" fill="#eef6fa"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="36" y="57" font-size="28" font-weight="bold">金額の出どころを分ける家族メモ</text><g fill="white"><rect x="36" y="88" width="330" height="166" rx="14"/><rect x="394" y="88" width="330" height="166" rx="14"/><rect x="36" y="278" width="330" height="166" rx="14"/><rect x="394" y="278" width="330" height="166" rx="14"/></g><g font-size="24" font-weight="bold"><text x="58" y="133">1　解体工事費</text><text x="416" y="133">2　当年度の納付</text><text x="58" y="323">3　翌年度の見通し</text><text x="416" y="323">4　解体後の管理</text></g><g font-size="21"><text x="58" y="183">見積書で確認</text><text x="58" y="221">補助の確定とは別</text><text x="416" y="183">通知書・明細書</text><text x="416" y="221">工事代と別に予定</text><text x="58" y="373">土地・家屋を分ける</text><text x="58" y="411">個別の扱いは市へ</text><text x="416" y="373">土地を持つ間の手間</text><text x="416" y="411">家族の予定を確認</text></g><text x="36" y="493" font-size="24" font-weight="bold">分からない金額は「0円」ではなく「未確認」</text><text x="36" y="532" font-size="17">大石浩之の提案：税額や解体時期を一律に決める表ではありません。</text></g></svg>
