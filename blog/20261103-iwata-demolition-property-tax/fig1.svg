<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">解体する年と翌年度を分けて考える</title><desc id="desc">年途中の解体でも当年度の家屋の税は月割りにならない。2027年1月1日の現況を確認し、翌年度の家屋と土地を分けて市に確認する。</desc><rect width="760" height="500" rx="24" fill="#eef6fa"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="40" y="60" font-size="28" font-weight="bold">解体の年と、次の基準日を分ける</text><rect x="40" y="92" width="680" height="128" rx="16" fill="white"/><text x="66" y="132" font-size="24" font-weight="bold">2026年中に家屋を取り壊す場合</text><text x="66" y="171" font-size="22">当年度の家屋の税は1年分</text><text x="66" y="204" font-size="20">取り壊した月から月割りにはならない</text><path d="M380 230v44m-12-12 12 12 12-12" fill="none" stroke="#0074ae" stroke-width="5"/><rect x="40" y="286" width="680" height="142" rx="16" fill="#123a52"/><g fill="white"><text x="66" y="329" font-size="26" font-weight="bold">2027年1月1日の現況を確認</text><text x="66" y="369" font-size="22">翌年度の家屋と土地は別々に確認</text><text x="66" y="403" font-size="20">土地の税が高くなる場合がある</text></g><text x="40" y="467" font-size="17">出典：磐田市「固定資産税に関する届出」／2026年11月確認</text></g></svg>
