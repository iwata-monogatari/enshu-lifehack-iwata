<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
  <title id="title">五つの種目の対象と参加料</title><desc id="desc">ハーフ、5キロ、小学生3キロ、3キロファミリー、3キロファンランの対象年齢と参加料を比較した表</desc><rect width="760" height="500" rx="28" fill="#f4f8fa"/><text x="380" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123a52">初参加は「対象」と「時間」で選ぶ</text>
  <g font-family="sans-serif" font-size="18" fill="#173f56"><rect x="42" y="82" width="676" height="62" rx="12" fill="#dceef6"/><text x="66" y="120" font-weight="700">ハーフ</text><text x="250" y="120">高校生以上</text><text x="465" y="120">6,000円</text><text x="610" y="120">3時間</text><rect x="42" y="154" width="676" height="62" rx="12" fill="#fff"/><text x="66" y="192" font-weight="700">5km</text><text x="250" y="192">中学生以上</text><text x="435" y="180">中学生 2,500円</text><text x="435" y="202">高校生以上 4,500円</text><text x="610" y="192">40分</text><rect x="42" y="226" width="676" height="62" rx="12" fill="#dceef6"/><text x="66" y="264" font-weight="700">3km小学生</text><text x="250" y="264">小学1～6年</text><text x="465" y="264">2,000円</text><text x="610" y="264">30分</text><rect x="42" y="298" width="676" height="62" rx="12" fill="#fff"/><text x="66" y="336" font-weight="700">3km親子</text><text x="224" y="325">小学生1人＋</text><text x="224" y="347">保護者1人</text><text x="465" y="336">1組6,000円</text><text x="610" y="336">30分</text><rect x="42" y="370" width="676" height="62" rx="12" fill="#dceef6"/><text x="66" y="408" font-weight="700">3kmファン</text><text x="250" y="408">小学生以上</text><text x="465" y="408">3,500円</text><text x="610" y="408">30分</text><text x="380" y="468" text-anchor="middle" font-size="17" fill="#526f80">ファンランは非計測。対象年齢は大会当日の満年齢で確認</text></g>
</svg>
