<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
  <title id="title">申込から大会までの流れ</title><desc id="desc">9月14日23時59分までに種目選択、RUNNET入力、参加料決済を終え、11月22日の大会へ進む流れ</desc>
  <rect width="760" height="420" rx="28" fill="#eef7fb"/><text x="380" y="54" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#123a52">申込は「入力」で終わりではない</text><path d="M120 205H640" stroke="#6aa9c7" stroke-width="8" stroke-linecap="round"/>
  <g font-family="sans-serif" text-anchor="middle"><circle cx="120" cy="205" r="46" fill="#0074ae"/><text x="120" y="198" font-size="20" font-weight="700" fill="#fff">種目</text><text x="120" y="224" font-size="20" font-weight="700" fill="#fff">決定</text><circle cx="293" cy="205" r="46" fill="#0074ae"/><text x="293" y="198" font-size="20" font-weight="700" fill="#fff">RUNNET</text><text x="293" y="224" font-size="18" fill="#fff">入力</text><circle cx="466" cy="205" r="54" fill="#e06b2d"/><text x="466" y="198" font-size="20" font-weight="700" fill="#fff">参加料</text><text x="466" y="224" font-size="20" font-weight="700" fill="#fff">決済完了</text><circle cx="640" cy="205" r="46" fill="#156b45"/><text x="640" y="198" font-size="20" font-weight="700" fill="#fff">出走権</text><text x="640" y="224" font-size="18" fill="#fff">確定</text><text x="380" y="320" font-size="26" font-weight="700" fill="#b34f21">通常申込 2026年9月14日 23:59まで</text><text x="380" y="360" font-size="20" fill="#365d73">定員到達なら期限前に締切 ／ 大会は11月22日</text></g>
</svg>
