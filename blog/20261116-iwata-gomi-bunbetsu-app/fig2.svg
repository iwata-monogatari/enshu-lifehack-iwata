<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">磐田市の収集日の確認方法</title><rect width="440" height="600" fill="#edf7f1"/><g font-family="Meiryo,sans-serif" fill="#0e3d27"><text x="24" y="56" font-size="25" font-weight="bold">収集日の確認方法（磐田市）</text><rect x="20" y="82" width="400" height="104" rx="16" fill="white" stroke="#1f7a4d"/><text x="36" y="120" font-size="22" font-weight="bold">1 地区別カレンダーPDF</text><text x="36" y="156" font-size="20">全25地区・令和8年度版</text><rect x="20" y="206" width="400" height="104" rx="16" fill="white" stroke="#1f7a4d"/><text x="36" y="244" font-size="22" font-weight="bold">2 ゴミチェッカー</text><text x="36" y="280" font-size="20">分別検索とあわせて確認</text><rect x="20" y="330" width="400" height="104" rx="16" fill="white" stroke="#1f7a4d"/><text x="36" y="368" font-size="22" font-weight="bold">3 公式LINEの通知</text><text x="36" y="404" font-size="20">前日19時・当日7時など設定可</text><rect x="20" y="454" width="400" height="104" rx="16" fill="white" stroke="#1f7a4d"/><text x="36" y="492" font-size="22" font-weight="bold">4 出すときの基本</text><text x="36" y="528" font-size="20">収集日の午前8時までに集積所へ</text><text x="24" y="588" font-size="14" fill="#3d6b52">出典：磐田市公式ページ（2026年11月16日確認）</text></g></svg>
