<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">しっぺいのゴミチェッカーの主な機能</title><rect width="440" height="600" fill="#edf7f1"/><g font-family="Meiryo,sans-serif" fill="#0e3d27"><text x="24" y="56" font-size="25" font-weight="bold">ゴミチェッカーの機能（磐田市）</text><rect x="20" y="82" width="400" height="104" rx="16" fill="white" stroke="#1f7a4d"/><text x="36" y="120" font-size="22" font-weight="bold">1 分別検索</text><text x="36" y="156" font-size="20">品名から区分を確認・3言語対応</text><rect x="20" y="206" width="400" height="104" rx="16" fill="white" stroke="#1f7a4d"/><text x="36" y="244" font-size="22" font-weight="bold">2 収集日確認</text><text x="36" y="280" font-size="20">お住まいの地区の収集日を表示</text><rect x="20" y="330" width="400" height="104" rx="16" fill="white" stroke="#1f7a4d"/><text x="36" y="368" font-size="22" font-weight="bold">3 市からの情報</text><text x="36" y="404" font-size="20">減量・リサイクル啓発やQ&amp;A</text><rect x="20" y="454" width="400" height="104" rx="16" fill="white" stroke="#1f7a4d"/><text x="36" y="492" font-size="22" font-weight="bold">4 使い始め方</text><text x="36" y="528" font-size="20">市公式ページから・DL不要</text><text x="24" y="588" font-size="14" fill="#3d6b52">出典：磐田市公式ページ（2026年11月16日確認）</text></g></svg>
