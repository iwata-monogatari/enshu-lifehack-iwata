<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">研修8日間の予定</title><desc id="desc">4課程と2026年の開催日程。原則全8回参加。</desc><rect width="960" height="600" rx="24" fill="#f2f6ef"/><g font-family="Meiryo,sans-serif" fill="#193e39"><text x="48" y="66" font-size="30" font-weight="bold">研修の8日間を、予定表に置く</text><text x="48" y="105" font-size="20">2026年 ／ 原則全8回参加 ／ 各回9:00〜17:00頃</text><rect x="48" y="137" width="864" height="78" rx="12" fill="#ffffff"/><text x="68" y="169" font-size="20" fill="#60745d">01</text><text x="180" y="168" font-size="25" font-weight="bold">10/31（土）</text><text x="180" y="197" font-size="21">自伐型林業概論</text><rect x="48" y="228" width="864" height="78" rx="12" fill="#dcebd4"/><text x="68" y="260" font-size="20" fill="#60745d">02–04</text><text x="180" y="259" font-size="25" font-weight="bold">11/1（日）・7（土）・8（日）</text><text x="180" y="288" font-size="21">チェーンソー伐木教育</text><rect x="48" y="319" width="864" height="78" rx="12" fill="#ffffff"/><text x="68" y="351" font-size="20" fill="#60745d">05–06</text><text x="180" y="350" font-size="25" font-weight="bold">11/28（土）・29（日）</text><text x="180" y="379" font-size="21">伐倒造材研修</text><rect x="48" y="410" width="864" height="78" rx="12" fill="#ffffff"/><text x="68" y="442" font-size="20" fill="#60745d">07–08</text><text x="180" y="441" font-size="25" font-weight="bold">12/19（土）・20（日）</text><text x="180" y="470" font-size="21">作業道開設研修</text><text x="48" y="535" font-size="21">申込締切：2026年10月14日（水）</text><text x="48" y="572" font-size="17">出典：磐田市公式チラシ（10月10日確認）／ 最新の日程は市公式で確認</text></g></svg>