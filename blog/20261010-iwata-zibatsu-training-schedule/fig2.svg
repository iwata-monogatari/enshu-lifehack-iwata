<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">予定の照合メモ</title><desc id="desc">公式日程と勤務・家族の予定を並べて、出席可、調整中、難しい日に分ける。</desc><rect width="960" height="560" rx="24" fill="#edf4f8"/><g font-family="Meiryo,sans-serif" fill="#173c53"><text x="48" y="65" font-size="30" font-weight="bold">今日の一歩は「予定の照合」</text><text x="48" y="105" font-size="20">学びたい気持ちと、実際に通える日を分けて考える</text><rect x="48" y="140" width="409" height="110" rx="14" fill="white"/><text x="72" y="182" font-size="24" font-weight="bold">公式チラシ</text><text x="72" y="222" font-size="20">8日間の日付・時間・課程</text><rect x="503" y="140" width="409" height="110" rx="14" fill="white"/><text x="527" y="182" font-size="24" font-weight="bold">勤務・家族の予定</text><text x="527" y="222" font-size="20">仕事・送迎・介護・移動</text><path d="M480 268v28m-10-10 10 10 10-10" stroke="#173c53" stroke-width="4" fill="none"/><rect x="48" y="316" width="268" height="71" rx="12" fill="#d7e9d7"/><text x="91" y="361" font-size="26">出席できる</text><rect x="346" y="316" width="268" height="71" rx="12" fill="#f6eac4"/><text x="438" y="361" font-size="26">調整中</text><rect x="644" y="316" width="268" height="71" rx="12" fill="#e6e3ed"/><text x="739" y="361" font-size="26">難しい</text><text x="48" y="439" font-size="23" font-weight="bold">欠席の可能性は、日付を添えて市へ確認</text><text x="48" y="478" font-size="20">11月1日・7日・8日の伐木教育は、3日間をひとまとまりに。</text><text x="48" y="529" font-size="17">この記事で提案する整理方法です。市の申込様式ではありません。</text></g></svg>