<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" data-illustration="iwata-editorial">
<rect width="760" height="560" fill="#fdf6ec"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">教育訓練給付金の支給額（磐田市）</text>
<rect x="40" y="84" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="122" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">一般・特定一般の指定講座</text><text x="696" y="122" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">受講料の60％・上限20万円</text><text x="64" y="152" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">雇用保険の教育訓練給付指定講座が対象（1人1講座のみ）</text>
<rect x="40" y="192" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="230" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">専門実践教育訓練の指定講座</text><text x="696" y="230" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">60％・最大160万円</text><text x="64" y="260" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">上限は40万円×修学年数（上限4年）</text>
<rect x="40" y="300" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="338" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">修了後に資格取得＋就職等した場合</text><text x="696" y="338" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">85％相当・最大240万円</text><text x="64" y="368" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">修了日の翌日から1年以内が条件。既支給分は差し引いて支給</text>
<rect x="40" y="408" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="446" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">支給できない場合</text><text x="696" y="446" text-anchor="end" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#c0392b">支給額が1万2千円以下のとき</text><text x="64" y="476" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">雇用保険の給付を受けられる方は、その額を差し引いた額が支給額</text>
<text x="40" y="536" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：磐田市「ひとり親家庭自立支援給付金」（ページ番号1001773）</text>
</svg>
