<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" data-illustration="iwata-editorial">
<rect width="760" height="560" fill="#fdf6ec"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">高等職業訓練促進給付金（磐田市）</text>
<rect x="40" y="84" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="122" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">市民税非課税世帯</text><text x="696" y="122" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">月額10万円</text><text x="64" y="152" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">修学期間の最後の1年間は4万円増額され月額14万円</text>
<rect x="40" y="192" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="230" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">市民税課税世帯</text><text x="696" y="230" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">月額7万500円</text><text x="64" y="260" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">修学期間の最後の1年間は4万円増額され月額11万500円</text>
<rect x="40" y="300" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="338" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">支給期間</text><text x="696" y="338" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">修業期間の全期間・上限4年</text><text x="64" y="368" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">養成機関で6か月以上のカリキュラムを修業する方が対象</text>
<rect x="40" y="408" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="446" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">修了支援給付金</text><text x="696" y="446" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">非課税5万円・課税2万5千円</text><text x="64" y="476" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">対象資格は看護師・保育士・介護福祉士など13種類（1人1資格のみ）</text>
<text x="40" y="536" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：磐田市「ひとり親家庭自立支援給付金」（ページ番号1001773）</text>
</svg>
