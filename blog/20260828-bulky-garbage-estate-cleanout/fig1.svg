<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="磐田市の粗大ごみの三つのルートを横並びで比較した図。市の戸別収集は基本料金1,040円に1個210円が加算され原則1世帯月1回・希望日の2週間前までの申込、自己搬入は磐田市クリーンセンターが10キロあたり157円で中遠広域粗大ごみ処理施設が車両1台520円から2,090円、民間許可業者による有料戸別収集は令和5年4月1日開始で引越しや遺品整理の多量向け・料金は業者ごとであることを示している" data-illustration="iwata-editorial" data-variant="1">
<defs>
<linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5f9"/><stop offset="1" stop-color="#f7f6ee"/></linearGradient>
<filter id="cardA"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#123a52" flood-opacity=".16"/></filter>
<style>.tA{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;font-weight:700;fill:#123a52}.cA{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;fill:#3c5b6d}.wA{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;font-weight:700;fill:#fff}.nA{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;fill:#5c7688}</style>
</defs>
<rect width="1000" height="560" rx="22" fill="url(#bgA)"/>
<g filter="url(#cardA)"><rect x="40" y="30" width="920" height="104" rx="18" fill="#ffffff" opacity=".96"/></g>
<text x="70" y="68" class="cA" font-size="18">空き家・実家・相続 ── 磐田市の粗大ごみ（2026年8月28日確認）</text>
<text x="68" y="110" class="tA" font-size="27">量と期限で、通る窓口が変わる</text>

<g filter="url(#cardA)"><rect x="40" y="164" width="288" height="300" rx="16" fill="#ffffff"/></g>
<rect x="40" y="164" width="288" height="52" rx="16" fill="#0074AE"/>
<rect x="40" y="200" width="288" height="16" fill="#0074AE"/>
<text x="64" y="198" class="wA" font-size="20">① 市の戸別収集</text>
<text x="64" y="256" class="tA" font-size="24">1,040円＋210円／個</text>
<text x="64" y="288" class="cA" font-size="16">基本料金＋収集物1個ごと</text>
<line x1="64" y1="308" x2="304" y2="308" stroke="#cfdde6" stroke-width="2"/>
<text x="64" y="340" class="cA" font-size="17">原則 1世帯 月1回</text>
<text x="64" y="370" class="cA" font-size="17">希望日の2週間前までに申込</text>
<text x="64" y="400" class="cA" font-size="17">3週間〜1か月先になることも</text>
<text x="64" y="436" class="nA" font-size="15">長さ2m以内・重さ80kg以下</text>

<g filter="url(#cardA)"><rect x="356" y="164" width="288" height="300" rx="16" fill="#ffffff"/></g>
<rect x="356" y="164" width="288" height="52" rx="16" fill="#005986"/>
<rect x="356" y="200" width="288" height="16" fill="#005986"/>
<text x="380" y="198" class="wA" font-size="20">② 自分で運び込む</text>
<text x="380" y="252" class="tA" font-size="19">クリーンセンター</text>
<text x="380" y="284" class="tA" font-size="24">10kg あたり157円</text>
<text x="380" y="310" class="cA" font-size="15">布団・木製家具・畳・草木枝／現金のみ</text>
<line x1="380" y1="330" x2="620" y2="330" stroke="#cfdde6" stroke-width="2"/>
<text x="380" y="362" class="tA" font-size="19">中遠広域粗大ごみ処理施設</text>
<text x="380" y="394" class="tA" font-size="24">車両1台 520〜2,090円</text>
<text x="380" y="420" class="cA" font-size="15">金属・小型電化製品・ガラス・陶器</text>
<text x="380" y="444" class="nA" font-size="15">積載重量で決まる／2t車以下</text>

<g filter="url(#cardA)"><rect x="672" y="164" width="288" height="300" rx="16" fill="#ffffff"/></g>
<rect x="672" y="164" width="288" height="52" rx="16" fill="#c9522f"/>
<rect x="672" y="200" width="288" height="16" fill="#c9522f"/>
<text x="696" y="198" class="wA" font-size="20">③ 民間許可業者</text>
<text x="696" y="256" class="tA" font-size="24">令和5年4月1日 開始</text>
<text x="696" y="288" class="cA" font-size="16">有料粗大ごみ戸別収集</text>
<line x1="696" y1="308" x2="936" y2="308" stroke="#cfdde6" stroke-width="2"/>
<text x="696" y="340" class="cA" font-size="17">引越し・遺品整理の多量向け</text>
<text x="696" y="370" class="cA" font-size="17">自己搬入できない方が対象</text>
<text x="696" y="400" class="cA" font-size="17">料金は業者ごと（目安なし）</text>
<text x="696" y="436" class="nA" font-size="15">市の許可業者一覧から直接依頼</text>

<text x="60" y="504" class="nA" font-size="16">出典：磐田市「粗大ごみの戸別収集」「民間許可業者による有料粗大ごみ戸別収集」「可燃ごみの持ち込み」「金物・小型電化製品、有害ごみ、埋立ごみの持ち込み」</text>
<text x="60" y="532" class="nA" font-size="16">市の戸別収集は「引っ越しや解体などによる大量のごみは収集できません」と明記。実家じまいの分は③が別枠になります。</text>
</svg>
