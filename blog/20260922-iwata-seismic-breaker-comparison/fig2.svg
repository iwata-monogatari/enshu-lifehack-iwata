<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><style>text{font-family:Meiryo,sans-serif;fill:#173d54}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:20px}.price{font-size:32px;font-weight:700;fill:#0074ae}</style><rect width="960" height="560" rx="24" fill="#f1f6fa"/><title id="title">型番から始める感震ブレーカーの比較</title><desc id="desc">今日行うのは型番確認一つ。次に工事店が設置可否を確認し、最後に追加作業まで含む総額を比べる。2026年度の補助受付は終了している。</desc><text x="40" y="54" class="title">今日は「型番」を確認するだけでよい</text><rect x="35" y="89" width="890" height="115" rx="16" fill="#0074ae"/><circle cx="87" cy="144" r="28" fill="white"/><text x="87" y="153" text-anchor="middle" class="label">1</text><text x="138" y="134" style="font-size:27px;font-weight:700;fill:white">分電盤のメーカー・型番を確認</text><text x="138" y="174" style="font-size:21px;fill:white">安全に見える表示だけ。分解・配線作業はしない。</text><path d="M87 206v29m-9-10 9 10 9-10" stroke="#607e91" stroke-width="4" fill="none"/><rect x="35" y="240" width="890" height="100" rx="16" fill="white"/><text x="72" y="297" class="label">2</text><text x="138" y="281" class="label">電気工事店が設置可否を確認</text><text x="138" y="316" class="small">内蔵型の適合は？　増設型の取付場所は？</text><path d="M87 342v28m-9-10 9 10 9-10" stroke="#607e91" stroke-width="4" fill="none"/><rect x="35" y="374" width="890" height="100" rx="16" fill="white"/><text x="72" y="431" class="label">3</text><text x="138" y="415" class="label">追加作業まで含めた総額で比較</text><text x="138" y="450" class="small">機器代＋取付工事＋追加作業。税込額も確認。</text><text x="40" y="521" class="small">2026年度の補助受付は終了。補助を差し引かず予算を考える。</text></svg>