<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><style>text{font-family:Meiryo,sans-serif;fill:#173d54}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:20px}.price{font-size:32px;font-weight:700;fill:#0074ae}</style><rect width="960" height="560" rx="24" fill="#f1f6fa"/><title id="title">増設型と内蔵型の設置位置・費用比較</title><desc id="desc">既存分電盤にリレーを追加する増設型と、内部の空きスペースに設置する内蔵型の模式図。実際の設置可否は電気工事店に確認する。</desc><text x="40" y="54" class="title">どこに付ける？　実家の分電盤で比較</text><rect x="30" y="82" width="440" height="365" rx="18" fill="white"/><rect x="490" y="82" width="440" height="365" rx="18" fill="white"/><text x="58" y="124" class="label">増設型</text><text x="520" y="124" class="label">内蔵型</text><rect x="60" y="155" width="245" height="150" rx="12" fill="#e4edf2" stroke="#607e91" stroke-width="3"/><rect x="83" y="186" width="42" height="78" rx="5" fill="#607e91"/><path d="M145 185h130v80H145z" fill="white" stroke="#607e91" stroke-width="2"/><path d="M168 185v80m25-80v80m26-80v80m28-80v80" stroke="#607e91" stroke-width="2"/><path d="M305 230h28" stroke="#0074ae" stroke-width="6"/><rect x="335" y="172" width="100" height="116" rx="10" fill="#0074ae"/><text x="385" y="218" text-anchor="middle" style="fill:white;font-size:19px">感震</text><text x="385" y="248" text-anchor="middle" style="fill:white;font-size:19px">リレー</text><text x="60" y="341" class="small">既存分電盤にリレーを追加</text><text x="60" y="399" class="price">4～7万円</text><rect x="525" y="155" width="375" height="150" rx="12" fill="#e4edf2" stroke="#607e91" stroke-width="3"/><rect x="548" y="186" width="42" height="78" rx="5" fill="#607e91"/><path d="M610 185h145v80H610z" fill="white" stroke="#607e91" stroke-width="2"/><path d="M635 185v80m25-80v80m26-80v80m28-80v80" stroke="#607e91" stroke-width="2"/><rect x="781" y="172" width="97" height="116" rx="10" fill="#0074ae"/><text x="829" y="218" text-anchor="middle" style="fill:white;font-size:19px">感震</text><text x="829" y="248" text-anchor="middle" style="fill:white;font-size:19px">リレー</text><text x="520" y="341" class="small">分電盤内の空きスペースへ</text><text x="520" y="399" class="price">2～4万円</text><text x="40" y="483" class="small">金額は機器＋取付工事の目安。設置可否は電気工事店へ。</text><text x="40" y="521" style="font-size:17px">出典：磐田市Q＆A 2～3ページ／2026年9月22日確認　※配線図ではありません</text></svg>