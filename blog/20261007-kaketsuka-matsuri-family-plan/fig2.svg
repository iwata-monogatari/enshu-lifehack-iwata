<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">親子で屋台囃子を聴く判断</title><desc id="desc">子どもの反応を見て、楽しむ、休む、帰るを選ぶ図。</desc><rect width="960" height="640" rx="24" fill="#f5f0e7"/><g font-family="Meiryo, sans-serif" fill="#173e4b"><text x="55" y="63" font-size="31" font-weight="bold">屋台囃子を聴く｜親子の選び直し</text><text x="55" y="103" font-size="21">実際の屋台や会場配置を再現した図ではありません</text>
<circle cx="105" cy="195" r="36" fill="#bd7b45"/><circle cx="105" cy="195" r="27" fill="#f4ddaf"/><path d="M158 166 Q190 195 158 224 M181 153 Q228 195 181 237" stroke="#176d92" stroke-width="5" fill="none"/>
<rect x="265" y="135" width="640" height="118" rx="18" fill="#fff"/><text x="298" y="181" font-size="27" font-weight="bold">案内に沿った観覧場所で聴く</text><text x="298" y="222" font-size="22">前へ進むことだけを目標にしない</text>
<path d="M585 262 L585 290" stroke="#56766e" stroke-width="4"/>
<rect x="265" y="300" width="640" height="90" rx="18" fill="#dcebe3"/><text x="585" y="354" text-anchor="middle" font-size="28" font-weight="bold">子どもの反応と疲れを見る</text>
<path d="M585 395 L585 420 L270 420 L270 445 M585 420 L715 420 L715 445" fill="none" stroke="#56766e" stroke-width="4"/>
<rect x="55" y="450" width="410" height="108" rx="18" fill="#fff"/><rect x="495" y="450" width="410" height="108" rx="18" fill="#fff"/>
<text x="260" y="490" text-anchor="middle" font-size="23">余裕があれば</text><text x="260" y="529" text-anchor="middle" font-size="29" font-weight="bold">その場で楽しむ</text><text x="700" y="490" text-anchor="middle" font-size="23">疲れた・音がつらいなら</text><text x="700" y="529" text-anchor="middle" font-size="29" font-weight="bold">休憩、または帰宅</text>
<text x="55" y="608" font-size="21">大石の提案：撮影や見物のために、運行を止める前提を置かない。</text></g></svg>