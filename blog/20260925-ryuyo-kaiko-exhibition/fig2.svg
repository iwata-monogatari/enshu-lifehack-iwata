<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc">
<title id="title">親子外出の120分の仮予定</title><desc id="desc">片道30分と仮定。行き30分、滞在60分、帰り30分。公式の見学所要時間ではない。</desc>
<rect width="960" height="520" rx="24" fill="#f0f5fa"/><g font-family="Meiryo,sans-serif" fill="#153d56"><text x="48" y="62" font-size="32" font-weight="bold">展示の時間に、往復も足す</text><text x="48" y="102" font-size="21">片道30分と仮定した、合計120分の予定例</text>
<rect x="48" y="154" width="216" height="116" rx="12" fill="#d0e2f0"/><rect x="274" y="154" width="412" height="116" rx="12" fill="#147487"/><rect x="696" y="154" width="216" height="116" rx="12" fill="#d0e2f0"/>
<text x="156" y="200" text-anchor="middle" font-size="24">行き</text><text x="156" y="242" text-anchor="middle" font-size="32" font-weight="bold">30分</text><text x="480" y="200" text-anchor="middle" font-size="24" fill="white">公園で過ごす</text><text x="480" y="242" text-anchor="middle" font-size="32" fill="white" font-weight="bold">60分</text><text x="804" y="200" text-anchor="middle" font-size="24">帰り</text><text x="804" y="242" text-anchor="middle" font-size="32" font-weight="bold">30分</text>
<text x="48" y="316" font-size="23" font-weight="bold">滞在60分の内訳も、あくまで仮の案</text><rect x="48" y="339" width="864" height="83" rx="12" fill="white"/><text x="75" y="390" font-size="23">受付など10分 ＋ 展示30分 ＋ 休憩・帰る準備20分</text><text x="48" y="460" font-size="20">公式の見学所要時間ではありません。移動時間は出発地で変わります。</text><text x="48" y="493" font-size="20">道路状況と子どもの様子に合わせ、余裕を持たせてください。</text></g></svg>
