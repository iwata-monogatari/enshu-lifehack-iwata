<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" data-illustration="iwata-editorial"><title id="t">獅子ヶ鼻公園 紅葉の季節を読む</title><desc id="d">10月23日の確認日と、11月下旬から12月上旬の季節の目安を分ける図。色づきの速報ではありません。</desc><rect width="1000" height="560" rx="24" fill="#faf6eb"/><g font-family="Meiryo, sans-serif" fill="#263c37"><text x="60" y="76" font-size="36" font-weight="bold">獅子ヶ鼻公園｜紅葉の季節を読む</text><text x="60" y="123" font-size="23">磐田市「花ごよみ」の案内から</text><path d="M100 280H900" stroke="#c8bda4" stroke-width="10"/><circle cx="180" cy="280" r="17" fill="#267b79"/><text x="90" y="218" font-size="29" font-weight="bold">10月23日</text><text x="100" y="340" font-size="25">情報を確認</text><rect x="410" y="245" width="470" height="70" rx="35" fill="#a3472b"/><text x="440" y="290" font-size="28" fill="#ffffff" font-weight="bold">11月下旬 ～ 12月上旬</text><text x="485" y="365" font-size="26">市が示す季節の目安</text><rect x="60" y="410" width="880" height="98" rx="16" fill="#ffffff"/><text x="85" y="452" font-size="25" font-weight="bold">現在の色づき速報ではありません</text><text x="85" y="487" font-size="22">訪れる日の見頃を保証するものではありません。</text></g></svg>