<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d" data-illustration="iwata-editorial"><title id="t">獅子ヶ鼻公園への移動の目安</title><desc id="d">新磐田スマートICから車で約10分、磐田ICから車で約25分、敷地駅から徒歩50分。園内の散策時間は別です。地図ではありません。</desc><rect width="1000" height="620" rx="24" fill="#faf6eb"/><g font-family="Meiryo, sans-serif" fill="#263c37"><text x="55" y="70" font-size="35" font-weight="bold">豊岡・獅子ヶ鼻公園へのアクセス</text><text x="55" y="111" font-size="22">市の施設ガイドにある出発点と所要時間</text><rect x="55" y="160" width="475" height="80" rx="12" fill="#ffffff"/><text x="78" y="194" font-size="25" font-weight="bold">新磐田スマートI.C.</text><text x="78" y="225" font-size="23">車で約10分</text><path d="M550 200H625" stroke="#a3472b" stroke-width="5"/><path d="M611 188l16 12-16 12" fill="none" stroke="#a3472b" stroke-width="5"/><rect x="55" y="270" width="475" height="80" rx="12" fill="#ffffff"/><text x="78" y="304" font-size="25" font-weight="bold">磐田I.C.</text><text x="78" y="335" font-size="23">車で約25分</text><path d="M550 310H625" stroke="#a3472b" stroke-width="5"/><path d="M611 298l16 12-16 12" fill="none" stroke="#a3472b" stroke-width="5"/><rect x="55" y="380" width="475" height="80" rx="12" fill="#ffffff"/><text x="78" y="414" font-size="25" font-weight="bold">敷地駅</text><text x="78" y="445" font-size="23">徒歩50分</text><path d="M550 420H625" stroke="#a3472b" stroke-width="5"/><path d="M611 408l16 12-16 12" fill="none" stroke="#a3472b" stroke-width="5"/><rect x="645" y="160" width="300" height="300" rx="20" fill="#235d50"/><text x="680" y="245" font-size="31" fill="white" font-weight="bold">獅子ヶ鼻公園</text><text x="678" y="305" font-size="23" fill="white">公園駐車場の住所</text><text x="678" y="345" font-size="23" fill="white">磐田市岩室199-1</text><text x="55" y="520" font-size="25" font-weight="bold">園内で過ごす時間や、帰路は別に考える</text><text x="55" y="562" font-size="22">この図はアクセスの説明図です。道路・散策路の地図ではありません。</text></g></svg>