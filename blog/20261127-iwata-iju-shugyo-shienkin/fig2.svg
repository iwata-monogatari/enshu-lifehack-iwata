<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" data-illustration="iwata-editorial">
<rect width="760" height="560" fill="#edf7f0"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">申請までの流れと返還の条件（磐田市）</text>
<rect x="40" y="84" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="122" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">流れ</text><text x="696" y="122" text-anchor="end" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#2e7d4f">移住→就業等→申請→交付</text><text x="64" y="152" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">申請は移住後1年以内。提出は持参か郵送のみ（FAX・メール不可）</text>
<rect x="40" y="192" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="230" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">申請期限</text><text x="696" y="230" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">2027年1月15日まで</text><text x="64" y="260" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">1月16日〜3月31日は受付不可の期間あり。予算で変更の可能性も</text>
<rect x="40" y="300" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="338" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">全額の返還</text><text x="696" y="338" text-anchor="end" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#c0392b">3年未満の転出・1年以内の離職など</text><text x="64" y="368" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">虚偽申請、起業支援金の交付決定取消しも全額返還</text>
<rect x="40" y="408" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="446" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">半額の返還</text><text x="696" y="446" text-anchor="end" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#c0392b">3年以上5年以内の転出</text><text x="64" y="476" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">倒産・災害・病気などやむを得ない事情は対象外になる場合あり</text>
<text x="40" y="536" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：磐田市「移住・就業支援金の御案内（2026年度版）」</text>
</svg>
