<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" data-illustration="iwata-editorial">
<rect width="760" height="560" fill="#edf7f0"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">支援金の額（磐田市・2026年度版）</text>
<rect x="40" y="84" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="122" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">単身での移住</text><text x="696" y="122" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">60万円</text><text x="64" y="152" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">移住元・移住先の両要件を満たす方が対象</text>
<rect x="40" y="192" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="230" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">2人以上の世帯での移住</text><text x="696" y="230" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">100万円</text><text x="64" y="260" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">移住前・移住後とも同一世帯であることが条件</text>
<rect x="40" y="300" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="338" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">18歳未満の世帯員を帯同</text><text x="696" y="338" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">1人につき100万円加算</text><text x="64" y="368" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">年齢は申請年度の4月1日時点で判定</text>
<rect x="40" y="408" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="446" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">1世帯当たりの上限</text><text x="696" y="446" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">400万円</text><text x="64" y="476" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">申請は同一世帯で1回限り</text>
<text x="40" y="536" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：磐田市「移住・就業支援金の御案内（2026年度版）」</text>
</svg>
