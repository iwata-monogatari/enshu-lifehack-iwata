<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">進学費用を二つの場面に分ける</title><desc id="desc">入学時の就学支度資金と在学中の修学資金について、費用と貸付方法を比較。個別の入金日は市に確認。</desc><rect width="960" height="600" rx="24" fill="#f0f6f8"/><g font-family="Meiryo, sans-serif" fill="#173d52"><text x="48" y="66" font-size="32" font-weight="bold">進学費用は「始める時」と「通う間」</text><text x="48" y="108" font-size="21">費用の役割と、お金が入る時期を分けて見る</text><rect x="44" y="145" width="416" height="328" rx="20" fill="#fff"/><rect x="500" y="145" width="416" height="328" rx="20" fill="#fff"/><rect x="70" y="173" width="104" height="36" rx="18" fill="#e3f2ed"/><text x="92" y="199" font-size="22">入学時</text><rect x="526" y="173" width="104" height="36" rx="18" fill="#e4edf9"/><text x="548" y="199" font-size="22">在学中</text><text x="70" y="256" font-size="34" font-weight="bold">就学支度資金</text><text x="526" y="256" font-size="34" font-weight="bold">修学資金</text><path d="M80 292h57v63H80z M89 305h38 M89 317h38 M89 329h25" fill="none" stroke="#28765e" stroke-width="4"/><text x="155" y="311" font-size="24">入学金</text><text x="155" y="348" font-size="24">物品購入など</text><path d="M536 295q22-10 44 0v56q-22-10-44 0z M580 295q22-10 44 0v56q-22-10-44 0z" fill="none" stroke="#306897" stroke-width="4"/><text x="645" y="311" font-size="24">授業料・教材費</text><text x="645" y="348" font-size="24">交通費など</text><text x="70" y="405" font-size="24" font-weight="bold">貸付：入学時に1回</text><text x="526" y="405" font-size="24" font-weight="bold">貸付：年4回</text><text x="526" y="440" font-size="20">4・7・10・1月の末日</text><text x="48" y="521" font-size="24" font-weight="bold">学校の納付日までに受け取れるかは、個別に確認</text><text x="48" y="562" font-size="18">出典：磐田市「貸し付けの申請について」／2026年10月1日確認</text></g></svg>