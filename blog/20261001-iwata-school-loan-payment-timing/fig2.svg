<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">混ぜない三つの日付</title><desc id="desc">学校への納付期限、県への書類提出期限、貸付金の入金予定を別々に記録。今日確認するのは学校の納付期限一つ。</desc><rect width="960" height="640" rx="24" fill="#f0f6f8"/><g font-family="Meiryo, sans-serif" fill="#173d52"><text x="48" y="66" font-size="32" font-weight="bold">カレンダーに書く日付は、別々に</text><text x="48" y="108" font-size="21">一つの期限を守れば、全部が済むわけではない</text><rect x="44" y="145" width="872" height="110" rx="18" fill="#fff"/><circle cx="93" cy="199" r="25" fill="#28765e"/><text x="85" y="208" font-size="26" fill="#fff">1</text><text x="139" y="186" font-size="23" font-weight="bold">学校への納付期限</text><text x="139" y="225" font-size="21">募集要項・入学手続きの案内から、実際の日付を一つ確認</text><rect x="44" y="273" width="872" height="110" rx="18" fill="#fff"/><circle cx="93" cy="327" r="25" fill="#306897"/><text x="85" y="336" font-size="26" fill="#fff">2</text><text x="139" y="314" font-size="23" font-weight="bold">県への書類提出期限：2026年11月20日（金）</text><text x="139" y="353" font-size="21">市への相談は、この期限より前に進める</text><rect x="44" y="401" width="872" height="110" rx="18" fill="#fff"/><circle cx="93" cy="455" r="25" fill="#8c6628"/><text x="85" y="464" font-size="26" fill="#fff">3</text><text x="139" y="442" font-size="23" font-weight="bold">貸付金の入金予定</text><text x="139" y="481" font-size="21">個別に確認。未確定なら「未確認」として残す</text><text x="48" y="559" font-size="24" font-weight="bold">今日の一歩：学校の納付期限を一つ確かめる</text><text x="48" y="603" font-size="18">磐田市の資金案内をもとに作成した相談用の整理図／2026年10月1日</text></g></svg>