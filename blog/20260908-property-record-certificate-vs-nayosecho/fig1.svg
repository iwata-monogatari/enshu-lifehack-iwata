<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
<title id="title">所有不動産記録証明書と磐田市の名寄帳の比較</title><desc id="desc">全国の所有権登記を探す法務局の証明書と、磐田市内の固定資産税を年度別に見る名寄帳を重ねる図</desc>
<rect width="1200" height="675" rx="32" fill="#f2f8fb"/><text x="600" y="70" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="700" fill="#123a52">同じ「一覧」でも、見ている台帳が違う</text>
<rect x="55" y="125" width="520" height="390" rx="28" fill="#fff" stroke="#0074ae" stroke-width="5"/><circle cx="145" cy="210" r="48" fill="#0074ae"/><path d="M118 210h54M145 183v54" stroke="#fff" stroke-width="9" stroke-linecap="round"/><text x="315" y="194" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#00679b">所有不動産記録証明書</text><text x="315" y="244" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263f4e">法務局 ／ 全国</text><text x="315" y="308" text-anchor="middle" font-family="sans-serif" font-size="29" fill="#123a52">氏名・住所を検索条件に</text><text x="315" y="354" text-anchor="middle" font-family="sans-serif" font-size="29" fill="#123a52">所有権の登記を探す</text><rect x="115" y="404" width="400" height="70" rx="18" fill="#e6f3f9"/><text x="315" y="448" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#00679b">書面：条件1件・1通 1,600円</text>
<rect x="625" y="125" width="520" height="390" rx="28" fill="#fff" stroke="#dd7a00" stroke-width="5"/><circle cx="715" cy="210" r="48" fill="#dd7a00"/><path d="M688 191h54v42h-54zM700 178h30" stroke="#fff" stroke-width="7" fill="none" stroke-linejoin="round"/><text x="885" y="194" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#9b5800">名寄帳兼課税台帳</text><text x="885" y="244" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263f4e">磐田市 ／ 市内</text><text x="885" y="308" text-anchor="middle" font-family="sans-serif" font-size="29" fill="#123a52">納税義務者と年度ごとに</text><text x="885" y="354" text-anchor="middle" font-family="sans-serif" font-size="29" fill="#123a52">土地・家屋を確認</text><rect x="685" y="404" width="400" height="70" rx="18" fill="#fff1dd"/><text x="885" y="448" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#8c4a00">納税義務者・年度別 300円</text>
<path d="M355 565h490" stroke="#6f8d9e" stroke-width="10" stroke-linecap="round"/><circle cx="600" cy="565" r="35" fill="#123a52"/><path d="M585 565l11 12 22-27" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="635" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#123a52">二択にせず、二つを重ねて候補を作る</text>
</svg>
