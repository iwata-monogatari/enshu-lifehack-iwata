<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
<title id="title">相続不動産を確認する五段階</title><desc id="desc">氏名住所の整理、全国の登記検索、磐田市の名寄帳、個別の登記と現地の照合、管理と相続登記の五段階</desc>
<rect width="1200" height="675" rx="32" fill="#f2f8fb"/><text x="600" y="75" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="700" fill="#123a52">証明書より先に、検索条件をそろえる</text>
<g font-family="sans-serif"><rect x="40" y="145" width="208" height="340" rx="24" fill="#fff" stroke="#0074ae" stroke-width="4"/><circle cx="144" cy="210" r="38" fill="#0074ae"/><text x="144" y="223" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">1</text><text x="144" y="290" text-anchor="middle" font-size="29" font-weight="700" fill="#123a52">氏名・住所</text><text x="144" y="337" text-anchor="middle" font-size="23" fill="#3f5968">現在と過去</text><text x="144" y="376" text-anchor="middle" font-size="23" fill="#3f5968">戸籍の附票</text>
<rect x="268" y="145" width="208" height="340" rx="24" fill="#fff" stroke="#0074ae" stroke-width="4"/><circle cx="372" cy="210" r="38" fill="#0074ae"/><text x="372" y="223" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">2</text><text x="372" y="290" text-anchor="middle" font-size="29" font-weight="700" fill="#123a52">全国検索</text><text x="372" y="337" text-anchor="middle" font-size="23" fill="#3f5968">所有権登記</text><text x="372" y="376" text-anchor="middle" font-size="23" fill="#3f5968">法務局</text>
<rect x="496" y="145" width="208" height="340" rx="24" fill="#fff" stroke="#dd7a00" stroke-width="5"/><circle cx="600" cy="210" r="38" fill="#dd7a00"/><text x="600" y="223" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">3</text><text x="600" y="290" text-anchor="middle" font-size="29" font-weight="700" fill="#123a52">磐田市</text><text x="600" y="337" text-anchor="middle" font-size="23" fill="#3f5968">名寄帳</text><text x="600" y="376" text-anchor="middle" font-size="23" fill="#3f5968">年度を指定</text>
<rect x="724" y="145" width="208" height="340" rx="24" fill="#fff" stroke="#0074ae" stroke-width="4"/><circle cx="828" cy="210" r="38" fill="#0074ae"/><text x="828" y="223" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">4</text><text x="828" y="290" text-anchor="middle" font-size="29" font-weight="700" fill="#123a52">個別照合</text><text x="828" y="337" text-anchor="middle" font-size="23" fill="#3f5968">登記事項</text><text x="828" y="376" text-anchor="middle" font-size="23" fill="#3f5968">現地・持分</text>
<rect x="952" y="145" width="208" height="340" rx="24" fill="#fff" stroke="#0074ae" stroke-width="4"/><circle cx="1056" cy="210" r="38" fill="#0074ae"/><text x="1056" y="223" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">5</text><text x="1056" y="290" text-anchor="middle" font-size="29" font-weight="700" fill="#123a52">次の段取り</text><text x="1056" y="337" text-anchor="middle" font-size="23" fill="#3f5968">管理・登記</text><text x="1056" y="376" text-anchor="middle" font-size="23" fill="#3f5968">判断は後で</text></g>
<path d="M135 545h930" stroke="#8da9b8" stroke-width="9" stroke-linecap="round"/><path d="M1065 545l-32-21v42z" fill="#8da9b8"/><text x="600" y="620" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#123a52">一覧は完成品ではない。照合して初めて使える</text>
</svg>
