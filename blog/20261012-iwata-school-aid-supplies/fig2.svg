<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">購入予定と支給時期を別の欄で考える</title><desc id="desc">購入は家庭の予定。新入学費の支給時期は前年度1月・3月又は8月。学期分は8月・1月・3月。今日の一歩は購入予定品を一つメモすること。</desc><style>text{font-family:Meiryo,sans-serif;fill:#163e51}.title{font-size:32px;font-weight:bold}.head{font-size:26px;font-weight:bold}.body{font-size:23px}.small{font-size:20px}.white{fill:white}</style><rect width="960" height="620" rx="24" fill="#f1f6f8"/><text x="42" y="59" class="title">買う日と、受け取る月を分ける</text><rect x="40" y="89" width="880" height="120" rx="18" fill="#fff0d8"/><path d="M72 125h55v58H72zM84 115v20M115 115v20M72 142h55" stroke="#996b28" fill="none" stroke-width="5"/><text x="155" y="133" class="head">購入予定：家庭・学校の案内で決まる</text><text x="155" y="178" class="body">品物を一つ書く → 購入月は未定でもよい</text><rect x="40" y="239" width="880" height="123" rx="18" fill="#e0edf7"/><text x="65" y="280" class="head">新入学児童生徒学用品費</text><text x="65" y="328" class="body">前年度1月・3月 又は 8月</text><text x="570" y="328" class="small">※各家庭の支給は要確認</text><rect x="40" y="382" width="880" height="116" rx="18" fill="#e5f2e8"/><text x="65" y="424" class="head">学期分の支給</text><text x="65" y="472" class="body">1学期分：8月　／　2学期分：1月　／　3学期分：3月</text><text x="42" y="548" class="body">申請期限と振込日は別。入金前の支払いを見落とさない。</text><text x="42" y="591" class="small">磐田市「就学援助制度」をもとに作成／2026年10月12日確認</text></svg>