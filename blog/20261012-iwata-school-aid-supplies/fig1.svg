<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">入学時の用品と授業の学用品</title><desc id="desc">ランドセルと通学用服は新入学児童生徒学用品費、ノートと筆記用具は学用品費。購入月だけで分類しない。</desc><style>text{font-family:Meiryo,sans-serif;fill:#163e51}.title{font-size:32px;font-weight:bold}.head{font-size:26px;font-weight:bold}.body{font-size:23px}.small{font-size:20px}.white{fill:white}</style><rect width="960" height="600" rx="24" fill="#f1f6f8"/><text x="48" y="60" class="title">何をそろえる費用？</text><rect x="40" y="90" width="430" height="400" rx="20" fill="#e0edf7"/><rect x="490" y="90" width="430" height="400" rx="20" fill="#e5f2e8"/><text x="68" y="137" class="head">入学時にそろえる物</text><text x="520" y="137" class="head">授業で使う物</text><g stroke="#165778" stroke-width="7" fill="none"><path d="M135 220v-23q0-29 35-29t35 29v23"/><rect x="111" y="208" width="119" height="144" rx="22" fill="#4e8eaa"/><path d="M119 236h103v55H119z" fill="#8cbbce"/><path d="M166 285v24"/><path d="M289 201l30-16 29 16 29-16 29 34-30 27-13-12v115h-86V234l-14 12-27-27 30-34z" fill="#fff"/></g><g stroke="#487d5b" stroke-width="6"><rect x="550" y="198" width="135" height="155" rx="7" fill="#fff"/><path d="M576 199v151M592 239h71M592 267h71M592 295h55" fill="none"/><path d="M755 331l38-131 23 7-38 131-21 19z" fill="#eac873"/><path d="M757 357l-2-26 23 7z" fill="#fff"/></g><text x="70" y="394" class="body">ランドセル・通学用服など</text><text x="520" y="394" class="body">ノート・筆記用具など</text><text x="70" y="449" class="small">新入学児童生徒学用品費</text><text x="520" y="449" class="small">学用品費</text><text x="48" y="540" class="body">買った月だけで決めず、費目の対象範囲で確認。</text><text x="48" y="577" class="small">磐田市「就学援助制度」をもとに作成／2026年10月12日確認</text></svg>