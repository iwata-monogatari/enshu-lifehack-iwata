<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial"><rect width="960" height="540" rx="24" fill="#f2f7fa"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="48" y="68" font-size="32" font-weight="bold">休む時間は「面談＋往復」で考える</text><text x="48" y="108" font-size="20">磐田市の目安と、自分で足す時間を分ける</text>
<rect x="48" y="160" width="166" height="156" rx="16" fill="#d9e8ef"/><text x="82" y="207" font-size="25">往路</text><text x="76" y="252" font-size="23">自分の時間</text>
<rect x="230" y="160" width="322" height="156" rx="16" fill="#0074ae"/><g fill="white"><text x="256" y="205" font-size="23">面談・給付手続き</text><text x="277" y="258" font-size="36" font-weight="bold">30～60分</text><text x="272" y="293" font-size="18">市が示す所要時間</text></g>
<rect x="568" y="160" width="166" height="156" rx="16" fill="#d9e8ef"/><text x="607" y="207" font-size="25">復路</text><text x="593" y="252" font-size="23">自分の時間</text>
<rect x="750" y="160" width="162" height="156" rx="16" fill="#fae7c5"/><text x="782" y="207" font-size="25">余裕</text><text x="774" y="252" font-size="21">前後に確保</text>
<path d="M62 347H898" stroke="#65869b" stroke-width="3"/><text x="48" y="395" font-size="25" font-weight="bold">計算例：20＋60＋20＋20＝120分</text><text x="48" y="438" font-size="21">片道20分・面談60分・余裕合計20分と仮定した例です。</text><text x="48" y="480" font-size="19">往復・余裕は市の標準値ではありません。出発地に合わせて計算。</text></g></svg>