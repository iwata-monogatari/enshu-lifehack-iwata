<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title"><title id="title">磐田市のこども医療費助成｜高校生年代まで通院・入院が無料、受給者証と払い戻しの手続きの記事表紙</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0074ae"/><stop offset="1" stop-color="#003e64"/></linearGradient></defs><rect width="760" height="760" fill="url(#bg)"/><g fill="none" stroke="#9fd3ee" stroke-width="3" opacity="0.5"><path d="M0 622 Q 120 600 260 620 T 520 618 T 760 614"/><path d="M0 668 Q 140 646 300 666 T 600 664 T 760 660"/><path d="M0 712 Q 120 692 280 710 T 560 708 T 760 704"/></g><rect x="96" y="100" width="568" height="452" rx="26" fill="#ffffff"/><g font-family="Meiryo,sans-serif"><rect x="128" y="132" width="176" height="48" rx="24" fill="#e9f3f9"/><text x="216" y="165" font-size="25" font-weight="bold" fill="#123a52" text-anchor="middle">子育て・学び</text><text x="128" y="240" font-size="43" font-weight="bold" fill="#123a52">磐田市のこども</text><text x="128" y="298" font-size="43" font-weight="bold" fill="#123a52">医療費助成の</text><text x="128" y="356" font-size="43" font-weight="bold" fill="#123a52">受け方</text><text x="128" y="424" font-size="30" fill="#123a52">通院・入院とも自己負担 <tspan font-weight="bold" fill="#c2501e">無料</tspan></text><text x="128" y="470" font-size="24" fill="#4a6a7d">対象は高校生年代まで（18歳年度末）</text><text x="128" y="518" font-size="21" fill="#7d97a8">磐田ライフハック iwata.enshu-lifehack.com</text></g></svg>
