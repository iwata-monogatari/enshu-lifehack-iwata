<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">こども医療費の払い戻しが必要な場面</title><rect width="440" height="600" fill="#eef6fb"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="24" y="56" font-size="25" font-weight="bold">払い戻しが必要な場面（磐田市）</text><rect x="20" y="82" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="120" font-size="22" font-weight="bold">県外で受診した</text><text x="36" y="156" font-size="20">領収書（レシート不可）を保管</text><rect x="20" y="206" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="244" font-size="22" font-weight="bold">受給者証を使わなかった</text><text x="36" y="280" font-size="20">高額療養費を使う場合も含む</text><rect x="20" y="330" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="368" font-size="22" font-weight="bold">補装具・公費負担医療</text><text x="36" y="404" font-size="20">指示書のコピーや証する書類を追加</text><rect x="20" y="454" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="492" font-size="22" font-weight="bold">期限は受診日から1年以内</text><text x="36" y="528" font-size="20">通帳と受給者証を持って窓口へ</text></g></svg>
