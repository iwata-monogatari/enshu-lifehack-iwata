<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">こども医療費受給者証をもらう手順</title><rect width="440" height="600" fill="#eef6fb"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="24" y="56" font-size="25" font-weight="bold">受給者証をもらう手順（磐田市）</text><rect x="20" y="82" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="120" font-size="22" font-weight="bold">1 対象を確認する</text><text x="36" y="156" font-size="20">高校生年代まで・健康保険に加入</text><rect x="20" y="206" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="244" font-size="22" font-weight="bold">2 持ち物を用意する</text><text x="36" y="280" font-size="20">資格情報画面か資格確認書＋本人確認</text><rect x="20" y="330" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="368" font-size="22" font-weight="bold">3 窓口で申請する</text><text x="36" y="404" font-size="20">iプラザ3階こども未来課・各支所</text><rect x="20" y="454" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="492" font-size="22" font-weight="bold">4 提示して受診する</text><text x="36" y="528" font-size="20">通院・入院とも自己負担は無料</text></g></svg>
