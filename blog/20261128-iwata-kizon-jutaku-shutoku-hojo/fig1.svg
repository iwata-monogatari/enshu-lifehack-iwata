<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" data-illustration="iwata-editorial">
<rect width="760" height="560" fill="#eef4fa"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">補助金の額（磐田市・令和8年度）</text>
<rect x="40" y="84" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="122" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">若者・子育て世帯「取得」</text><text x="696" y="122" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">上限150万円（市外）</text><text x="64" y="152" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">建物購入費の1/10＋リフォーム工事費の1/2。市内は上限100万円</text>
<rect x="40" y="192" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="230" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">若者・子育て世帯「建替え」</text><text x="696" y="230" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">除却費の1/2</text><text x="64" y="260" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">古い家を解体して建て替える場合の解体費用が対象</text>
<rect x="40" y="300" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="338" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">若者・子育て世帯「リフォーム」</text><text x="696" y="338" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">工事費の1/2</text><text x="64" y="368" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">取得と合わせず、リフォームだけでも使える形</text>
<rect x="40" y="408" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="446" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">若者・子育て世帯以外</text><text x="696" y="446" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">リフォーム上限50万円</text><text x="64" y="476" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">対象はリフォーム工事費の1/2のみ</text>
<text x="40" y="536" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：静岡県「住まいづくり支援ガイド（令和8年度版）」磐田市の制度</text>
</svg>
