<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" data-illustration="iwata-editorial">
<rect width="760" height="560" fill="#eef4fa"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">対象の条件と進め方（磐田市）</text>
<rect x="40" y="84" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="122" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">居住の条件</text><text x="696" y="122" text-anchor="end" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#2f6db3">完了日から10年住む見込み</text><text x="64" y="152" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">入居者全員の市税完納と、自治会への加入も条件</text>
<rect x="40" y="192" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="230" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">報告の期限</text><text x="696" y="230" text-anchor="end" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#e8873a">交付決定の年度末までに完了報告</text><text x="64" y="260" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">原則として3月31日までに完了報告書を提出できること</text>
<rect x="40" y="300" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="338" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">古い家の耐震</text><text x="696" y="338" text-anchor="end" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#c0392b">評点1.0以上／Is値0.6以上</text><text x="64" y="368" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">昭和56年5月31日以前の基準で建てられた住宅が対象の条件</text>
<rect x="40" y="408" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="446" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">相談窓口</text><text x="696" y="446" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#2f6db3">建築住宅課 0538-37-4851</text><text x="64" y="476" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">売買契約・工事契約の前に、世帯区分と工程を確認</text>
<text x="40" y="536" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：静岡県「住まいづくり支援ガイド（令和8年度版）」磐田市の制度</text>
</svg>
