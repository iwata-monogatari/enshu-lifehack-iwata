<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img"><title>書類は「次に動く人」で分ける</title><rect width="960" height="560" rx="24" fill="#f0f7fb"/><g font-family="Meiryo, sans-serif"><text x="44" y="60" font-size="32" fill="#173b50" font-weight="bold">書類は「次に動く人」で分ける</text><text x="44" y="102" font-size="21" fill="#173b50" font-weight="normal">書類名の横に、担当と確認日を一つずつ書く</text><rect x="44" y="145" width="260" height="240" rx="18" fill="#dbeaf6"/><circle cx="84" cy="188" r="23" fill="#20617e"/><text x="76" y="197" font-size="26" fill="white" font-weight="bold">1</text><text x="64" y="250" font-size="28" fill="#173b50" font-weight="bold">保護者が書く</text><text x="64" y="299" font-size="24" fill="#173b50" font-weight="normal">記入する日</text><text x="64" y="342" font-size="24" fill="#173b50" font-weight="normal">家族で照合</text><path d="M174 396 v26" stroke="#286584" stroke-width="4"/><rect x="350" y="145" width="260" height="240" rx="18" fill="#d9f0e9"/><circle cx="390" cy="188" r="23" fill="#20617e"/><text x="382" y="197" font-size="26" fill="white" font-weight="bold">2</text><text x="370" y="250" font-size="28" fill="#173b50" font-weight="bold">勤務先に頼む</text><text x="370" y="299" font-size="24" fill="#173b50" font-weight="normal">依頼した日</text><text x="370" y="342" font-size="24" fill="#173b50" font-weight="normal">受領予定日</text><path d="M480 396 v26" stroke="#286584" stroke-width="4"/><rect x="656" y="145" width="260" height="240" rx="18" fill="#fff0cd"/><circle cx="696" cy="188" r="23" fill="#20617e"/><text x="688" y="197" font-size="26" fill="white" font-weight="bold">3</text><text x="676" y="250" font-size="28" fill="#173b50" font-weight="bold">市に確認する</text><text x="676" y="299" font-size="24" fill="#173b50" font-weight="normal">質問を一行</text><text x="676" y="342" font-size="24" fill="#173b50" font-weight="normal">回答を記録</text><path d="M786 396 v26" stroke="#286584" stroke-width="4"/><rect x="44" y="429" width="872" height="60" rx="14" fill="#20617e"/><text x="177" y="469" font-size="27" fill="white" font-weight="bold">家庭で照合して、一次募集の期限内に提出</text><text x="44" y="528" font-size="21" fill="#173b50" font-weight="normal">家庭内の整理の提案です。必要書類は市の入園案内で個別に確認。</text></g></svg>