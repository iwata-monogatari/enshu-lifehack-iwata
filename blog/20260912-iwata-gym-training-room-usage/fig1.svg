<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" data-illustration="iwata-editorial"><title>初めての利用は講習から</title><rect width="760" height="450" rx="20" fill="#edf5f1"/><g font-family="sans-serif" fill="#193f35"><text x="42" y="72" font-size="30" font-weight="700">初めての利用は講習から</text><rect x="34" y="110" width="692" height="68" rx="12" fill="white"/><text x="53" y="153" font-size="23">利用対象は高校生以上</text><rect x="34" y="196" width="692" height="68" rx="12" fill="white"/><text x="53" y="239" font-size="23">初回利用前に講習会へ参加</text><rect x="34" y="282" width="692" height="68" rx="12" fill="white"/><text x="53" y="325" font-size="23">日時・申込方法は体育館へ確認</text></g><text x="42" y="414" font-family="sans-serif" font-size="17" fill="#50685f">磐田ライフハック ／ 市公式情報を2026年10月12日確認</text></svg>