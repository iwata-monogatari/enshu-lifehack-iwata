<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" data-illustration="iwata-editorial">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="60" y="50" width="1080" height="80" rx="12" fill="#0369a1"/>
  <text x="600" y="102" fill="#ffffff" font-size="32" font-weight="bold" text-anchor="middle" font-family="sans-serif">磐田市温水プール利用の4段階ステップ（到着から退館まで）</text>
  
  <rect x="80" y="190" width="230" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="195" cy="250" r="32" fill="#0284c7"/>
  <text x="195" y="260" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="195" y="320" fill="#0f172a" font-size="22" font-weight="bold" text-anchor="middle" font-family="sans-serif">チケット購入</text>
  <text x="195" y="370" fill="#475569" font-size="16" text-anchor="middle" font-family="sans-serif">入口の自動券売機で</text>
  <text x="195" y="400" fill="#475569" font-size="16" text-anchor="middle" font-family="sans-serif">入場券を購入</text>
  
  <rect x="350" y="190" width="230" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="465" cy="250" r="32" fill="#0284c7"/>
  <text x="465" y="260" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="465" y="320" fill="#0f172a" font-size="22" font-weight="bold" text-anchor="middle" font-family="sans-serif">更衣室で着替え</text>
  <text x="465" y="370" fill="#475569" font-size="16" text-anchor="middle" font-family="sans-serif">水着・キャップに着替え</text>
  <text x="465" y="400" fill="#475569" font-size="16" text-anchor="middle" font-family="sans-serif">100円返却式ロッカー</text>
  
  <rect x="620" y="190" width="230" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="735" cy="250" r="32" fill="#0284c7"/>
  <text x="735" y="260" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="735" y="320" fill="#0f172a" font-size="22" font-weight="bold" text-anchor="middle" font-family="sans-serif">遊泳・水中歩行</text>
  <text x="735" y="370" fill="#475569" font-size="16" text-anchor="middle" font-family="sans-serif">コース区分に従い利用</text>
  <text x="735" y="400" fill="#475569" font-size="16" text-anchor="middle" font-family="sans-serif">歩行・完泳コース厳守</text>
  
  <rect x="890" y="190" width="230" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="1005" cy="250" r="32" fill="#0284c7"/>
  <text x="1005" y="260" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="1005" y="320" fill="#0f172a" font-size="22" font-weight="bold" text-anchor="middle" font-family="sans-serif">採暖室と退館</text>
  <text x="1005" y="370" fill="#475569" font-size="16" text-anchor="middle" font-family="sans-serif">採暖室で体を温め</text>
  <text x="1005" y="400" fill="#475569" font-size="16" text-anchor="middle" font-family="sans-serif">シャワーを浴びて退館</text>
  
  <text x="600" y="590" fill="#64748b" font-size="18" text-anchor="middle" font-family="sans-serif">※月曜休館。オムツの取れていない乳幼児は入場できません。コース内での立ち止まりは避けましょう。</text>
</svg>