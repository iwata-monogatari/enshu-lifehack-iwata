<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" data-illustration="iwata-editorial"><title>子どもと行く前の確認</title><rect width="760" height="450" rx="20" fill="#edf5f1"/><g font-family="sans-serif" fill="#193f35"><text x="42" y="72" font-size="30" font-weight="700">子どもと行く前の確認</text><rect x="34" y="110" width="692" height="68" rx="12" fill="white"/><text x="53" y="153" font-size="23">小学2年生以下2人につき大人1人</text><rect x="34" y="196" width="692" height="68" rx="12" fill="white"/><text x="53" y="239" font-size="23">水泳帽が必要／浮輪は原則使用不可</text><rect x="34" y="282" width="692" height="68" rx="12" fill="white"/><text x="53" y="325" font-size="23">月曜・年末年始・保守日を確認</text></g><text x="42" y="414" font-family="sans-serif" font-size="17" fill="#50685f">磐田ライフハック ／ 市公式情報を2026年10月12日確認</text></svg>