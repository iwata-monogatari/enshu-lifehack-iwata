<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" data-illustration="iwata-editorial">
<rect width="760" height="560" fill="#edf5fa"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">浄化槽設置補助金の補助限度額（磐田市・令和8年度）</text>
<rect x="40" y="84" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="122" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">設置費（合併処理浄化槽の新設・設置替え）</text><text x="696" y="122" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">人槽ごとに上限</text><text x="64" y="152" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">5人槽 332,000円／7人槽 414,000円／10人槽 548,000円</text>
<rect x="40" y="192" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="230" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">宅内配管工事費</text><text x="696" y="230" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">上限33万円</text><text x="64" y="260" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">宅内の配管をつなぎ替える工事の費用が対象</text>
<rect x="40" y="300" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="338" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">撤去費（単独処理浄化槽からの転換）</text><text x="696" y="338" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">上限15万円</text><text x="64" y="368" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">雨水貯留槽等へ再利用する場合は上限12万円</text>
<rect x="40" y="408" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="446" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">撤去費（くみ取り便槽からの転換）</text><text x="696" y="446" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">上限12万円</text><text x="64" y="476" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">対象は下水道の認可区域外・農業集落排水の実施区域以外の区域</text>
<text x="40" y="536" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：磐田市「浄化槽設置整備事業 補助金交付申請の手引き」（令和8年度）</text>
</svg>
