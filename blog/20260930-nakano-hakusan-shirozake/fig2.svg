<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc">
<title id="title">親子で白酒の記録映像を開く</title><desc id="desc">市の無形民俗文化財ページから白酒の4分41秒の記録映像へ進む。米、準備する人、供える願いのどれかに目を向ける。例年の習俗と当年の開催条件を分ける。</desc>
<rect width="960" height="620" rx="24" fill="#edf4f5"/>
<g font-family="Meiryo, sans-serif" fill="#193e50">
<text x="48" y="65" font-size="18" fill="#477782">家庭でできる、今日の一歩</text>
<text x="48" y="111" font-size="34" font-weight="bold">白酒の記録映像を、一つ開く</text>
<rect x="48" y="149" width="864" height="109" rx="16" fill="#193e50"/>
<rect x="75" y="170" width="100" height="66" rx="6" fill="#fff"/><path d="m113 184 27 19-27 19z" fill="#bc9137"/>
<g fill="#fff"><text x="201" y="194" font-size="24">市「無形民俗文化財」→「白酒」の節</text><text x="201" y="231" font-size="21">記録映像：4分41秒 ／「お箱」と名前を見分ける</text></g>
<g fill="#fff"><rect x="48" y="283" width="272" height="160" rx="16"/><rect x="344" y="283" width="272" height="160" rx="16"/><rect x="640" y="283" width="272" height="160" rx="16"/></g>
<g text-anchor="middle"><g font-size="28" font-weight="bold"><text x="184" y="332">米</text><text x="480" y="332">人</text><text x="776" y="332">願い</text></g><g font-size="20"><text x="184" y="379">身近な米から</text><text x="184" y="411">祭りを考える</text><text x="480" y="379">準備する人の</text><text x="480" y="411">動きに目を向ける</text><text x="776" y="379">何を願って</text><text x="776" y="411">供えるのだろう</text></g></g>
<path d="M48 477h864" stroke="#96acb3" stroke-width="2"/>
<text x="48" y="519" font-size="23" font-weight="bold">記録で知る習俗 ≠ 2026年の開催案内</text>
<text x="48" y="557" font-size="19">開催日時・見学範囲・提供条件は、当年の案内で別に確認します。</text>
<text x="48" y="592" font-size="16">着眼点は筆者の提案です。市の映像案内を2026年9月30日に確認。</text>
</g></svg>
