<title id="title">新米から神前へ、白酒を支える準備</title><desc id="desc">その年の新米を使い、地区から選ばれた3人の杜氏が例祭の約1か月前から仕込む。例年10月第1日曜の神前への奉納につながる。道具と人物は概念図。</desc>
