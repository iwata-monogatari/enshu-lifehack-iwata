<g font-size="25" font-weight="bold" text-anchor="middle"><text x="157" y="384">その年の新米</text><text x="481" y="384">3人の杜氏</text><text x="805" y="384">神前へ供える</text></g>
<g font-size="18" text-anchor="middle"><text x="157" y="420">米と祭礼のつながり</text><text x="481" y="420">約1か月前から仕込み</text><text x="805" y="420">例年10月第1日曜</text></g>
<text x="48" y="513" font-size="22" font-weight="bold">例祭当日の前にも、人が動く時間がある。</text>
<text x="48" y="550" font-size="17">磐田市「無形民俗文化財」を基に作図。製法や実際の道具の再現ではありません。</text>
<text x="48" y="582" font-size="17">2026年の開催告知ではありません。確認日：2026年9月30日</text>
