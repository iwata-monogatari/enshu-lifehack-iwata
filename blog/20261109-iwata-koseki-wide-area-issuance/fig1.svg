<svg xmlns="http://www.w3.org/2000/svg" width="440" height="640" viewBox="0 0 440 640" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">広域交付の対象・対象外</title><rect width="440" height="640" fill="#eff7fa"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="24" y="60" font-size="28" font-weight="bold">広域交付の対象・対象外</text><rect x="20" y="90" width="400" height="128" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="130" font-size="26" font-weight="bold">戸籍謄本・除籍謄本</text><text x="36" y="178" font-size="26">謄本のみ・450円／750円</text><rect x="20" y="250" width="400" height="128" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="290" font-size="26" font-weight="bold">戸籍抄本・戸籍の附票</text><text x="36" y="338" font-size="26">対象外（本籍地へ請求）</text><text x="24" y="490" font-size="24">請求は本人のみ・代理不可</text><text x="24" y="526" font-size="24">写真付き本人確認が必要です</text><text x="24" y="590" font-size="24">出典：磐田市 1013202</text><text x="24" y="622" font-size="24">2026年11月9日確認</text></g></svg>
