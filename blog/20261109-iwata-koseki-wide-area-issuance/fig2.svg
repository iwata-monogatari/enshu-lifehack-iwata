<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">磐田で使うときの確認</title><rect width="440" height="720" fill="#eff7fa"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="24" y="60" font-size="28" font-weight="bold">磐田で使うときの確認</text><rect x="20" y="85" width="400" height="128" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="125" font-size="26" font-weight="bold">1 窓口は本庁市民課だけ</text><text x="36" y="173" font-size="26">支所では請求できません</text><rect x="20" y="245" width="400" height="128" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="285" font-size="26" font-weight="bold">2 本人確認は写真付き</text><text x="36" y="333" font-size="26">運転免許証・マイナンバー</text><rect x="20" y="405" width="400" height="128" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="445" font-size="26" font-weight="bold">3 本籍地と筆頭者を事前に</text><text x="36" y="493" font-size="26">番地まで確かめてから行く</text><text x="24" y="590" font-size="24">受付は窓口時間内のみ</text><text x="24" y="638" font-size="24">出典：磐田市</text><text x="24" y="672" font-size="24">1013202・1001302</text><text x="24" y="704" font-size="24">2026年11月9日確認</text></g></svg>
