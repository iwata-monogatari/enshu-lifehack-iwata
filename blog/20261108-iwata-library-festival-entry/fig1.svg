<svg xmlns="http://www.w3.org/2000/svg" width="240" height="590" viewBox="0 0 240 590" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">申込前の３確認</title><rect width="240" height="590" rx="14" fill="#edf6fa"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="16" y="36" font-size="18" font-weight="bold">申込前の３確認</text><rect x="12" y="66" width="216" height="126" rx="12" fill="white" stroke="#0074ae"/><text x="24" y="98" font-size="17" font-weight="bold">１ 企画名</text><text x="24" y="132" font-size="14">市公式の対象欄へ</text><text x="24" y="162" font-size="14">７企画は事前申込</text><rect x="12" y="214" width="216" height="126" rx="12" fill="white" stroke="#0074ae"/><text x="24" y="246" font-size="17" font-weight="bold">２ 日付と回</text><text x="24" y="280" font-size="14">11月28日・29日</text><text x="24" y="310" font-size="14">午前・午後も照合</text><rect x="12" y="362" width="216" height="126" rx="12" fill="white" stroke="#0074ae"/><text x="24" y="394" font-size="17" font-weight="bold">３ 個別条件</text><text x="24" y="428" font-size="14">対象・締切・受付状況</text><text x="24" y="458" font-size="14">申込先で最終確認</text><text x="14" y="540" font-size="12">出典：磐田市 1017137</text><text x="14" y="560" font-size="12">2026年11月8日確認</text><text x="14" y="580" font-size="12">編集部作成／参加確約ではありません</text></g></svg>