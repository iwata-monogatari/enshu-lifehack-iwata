<svg xmlns="http://www.w3.org/2000/svg" width="240" height="590" viewBox="0 0 240 590" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">予定と予約を分ける</title><rect width="240" height="590" rx="14" fill="#edf6fa"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="16" y="36" font-size="18" font-weight="bold">予定と予約を分ける</text><rect x="12" y="66" width="216" height="126" rx="12" fill="white" stroke="#0074ae"/><text x="24" y="98" font-size="17" font-weight="bold">候補を１つ</text><text x="24" y="132" font-size="14">家族が動ける時間を</text><text x="24" y="162" font-size="14">先に一行で残す</text><rect x="12" y="214" width="216" height="126" rx="12" fill="white" stroke="#0074ae"/><text x="24" y="246" font-size="17" font-weight="bold">申込みの確認</text><text x="24" y="280" font-size="14">リンクの掲載だけで</text><text x="24" y="310" font-size="14">受付中と決めない</text><rect x="12" y="362" width="216" height="126" rx="12" fill="white" stroke="#0074ae"/><text x="24" y="394" font-size="17" font-weight="bold">家族へ共有</text><text x="24" y="428" font-size="14">申込後の案内を確認</text><text x="24" y="458" font-size="14">未確定は未確定と記す</text><text x="14" y="540" font-size="12">出典：磐田市 1017137</text><text x="14" y="560" font-size="12">2026年11月8日確認</text><text x="14" y="580" font-size="12">編集部作成／参加確約ではありません</text></g></svg>