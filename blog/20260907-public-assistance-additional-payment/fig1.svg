<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
  <title id="title">磐田市の生活保護費追加給付の対象期間</title>
  <desc id="desc">2013年8月から2018年9月までに受給した全世帯と、2018年10月から2026年3月までに受給した一定条件の世帯を分けて示す</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7fb"/><stop offset="1" stop-color="#f8f5ec"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173f52" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="600" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#173f52">受給した時期で、対象の見方が分かれる</text>
  <text x="600" y="110" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#526b76">現在受給していない世帯も対象になる場合があります</text>
  <line x1="130" y1="354" x2="1070" y2="354" stroke="#aac0c9" stroke-width="12" stroke-linecap="round"/>
  <g filter="url(#shadow)"><rect x="80" y="170" width="490" height="276" rx="26" fill="#fff" stroke="#4e8b5d" stroke-width="6"/><rect x="112" y="202" width="426" height="58" rx="18" fill="#e5f3e4"/><text x="325" y="241" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#356840">2013年8月〜2018年9月</text><text x="325" y="323" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="700" fill="#173f52">全ての世帯</text><text x="325" y="376" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#526b76">この期間に受給したことがある</text><circle cx="129" cy="354" r="16" fill="#4e8b5d"/></g>
  <g filter="url(#shadow)"><rect x="630" y="170" width="490" height="276" rx="26" fill="#fff" stroke="#c47b32" stroke-width="6"/><rect x="662" y="202" width="426" height="58" rx="18" fill="#f9e9d7"/><text x="875" y="241" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#8d4c1d">2018年10月〜2026年3月</text><text x="875" y="316" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f52">一定条件の世帯</text><text x="875" y="362" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#526b76">入院・入所、障害に関する加算、</text><text x="875" y="396" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#526b76">期末一時扶助費などを市へ確認</text><circle cx="1070" cy="354" r="16" fill="#c47b32"/></g>
  <g filter="url(#shadow)"><rect x="235" y="500" width="730" height="104" rx="24" fill="#173f52"/><text x="600" y="543" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#fff">元受給者の申出期限　2027年7月31日</text><text x="600" y="579" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#d8e7ed">後半期間は例だけで自己判断せず、専用電話へ確認</text></g>
</svg>
