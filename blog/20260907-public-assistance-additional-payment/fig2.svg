<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
  <title id="title">磐田市の生活保護費追加給付を申出る順番</title>
  <desc id="desc">受給した時期をメモし、専用電話へ確認してから必要書類を集め、郵送・窓口・電子申請の入口を選ぶ四段階</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef7fb"/><stop offset="1" stop-color="#fffaf2"/></linearGradient><filter id="s2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#173f52" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg2)"/>
  <text x="600" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#173f52">戸籍謄本を取る前に、電話で確認</text>
  <text x="600" y="110" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#526b76">費用と二度手間を先に払わないための順番</text>
  <path d="M280 326H344M568 326H632M856 326H920" fill="none" stroke="#4f879e" stroke-width="8" stroke-linecap="round"/>
  <path d="M332 312l20 14-20 14M620 312l20 14-20 14M908 312l20 14-20 14" fill="none" stroke="#4f879e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#s2)"><rect x="48" y="188" width="232" height="276" rx="24" fill="#fff" stroke="#4f879e" stroke-width="5"/><circle cx="164" cy="246" r="34" fill="#dff0f7"/><text x="164" y="257" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#22617a">1</text><text x="164" y="321" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#173f52">時期をメモ</text><text x="164" y="367" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#526b76">受給年・旧住所</text><text x="164" y="399" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#526b76">当時の世帯主</text></g>
  <g filter="url(#s2)"><rect x="344" y="160" width="224" height="332" rx="24" fill="#fff" stroke="#4e8b5d" stroke-width="7"/><circle cx="456" cy="224" r="34" fill="#e5f3e4"/><text x="456" y="235" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#356840">2</text><text x="456" y="294" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#173f52">専用電話</text><text x="456" y="340" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#356840">0538-30-7770</text><text x="456" y="378" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#526b76">平日 8:30〜17:15</text><rect x="374" y="418" width="164" height="42" rx="21" fill="#e5f3e4"/><text x="456" y="446" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#356840">対象・申出者確認</text></g>
  <g filter="url(#s2)"><rect x="632" y="188" width="224" height="276" rx="24" fill="#fff" stroke="#c47b32" stroke-width="5"/><circle cx="744" cy="246" r="34" fill="#f9e9d7"/><text x="744" y="257" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#8d4c1d">3</text><text x="744" y="321" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#173f52">書類を集める</text><text x="744" y="367" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#526b76">戸籍・本人確認</text><text x="744" y="399" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#526b76">本人名義の口座</text></g>
  <g filter="url(#s2)"><rect x="920" y="188" width="232" height="276" rx="24" fill="#fff" stroke="#4f879e" stroke-width="5"/><circle cx="1036" cy="246" r="34" fill="#dff0f7"/><text x="1036" y="257" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#22617a">4</text><text x="1036" y="321" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#173f52">申出る</text><text x="1036" y="367" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#526b76">郵送・窓口</text><text x="1036" y="399" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#526b76">電子申請</text></g>
  <g filter="url(#s2)"><rect x="270" y="535" width="660" height="76" rx="22" fill="#173f52"/><text x="600" y="582" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#fff">申出期限　2027年7月31日</text></g>
</svg>
