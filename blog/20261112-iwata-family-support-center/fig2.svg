<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">ファミリー・サポート・センター利用までの順番</title><rect width="440" height="600" fill="#fdf4ec"/><g font-family="Meiryo,sans-serif" fill="#7a3410"><text x="24" y="56" font-size="25" font-weight="bold">利用までの順番（磐田市）</text><rect x="20" y="82" width="400" height="104" rx="16" fill="white" stroke="#e8862e"/><text x="36" y="120" font-size="22" font-weight="bold">1 電話で問い合わせ</text><text x="36" y="156" font-size="20">依頼内容と日時、子どもの年齢を伝える</text><rect x="20" y="206" width="400" height="104" rx="16" fill="white" stroke="#e8862e"/><text x="36" y="244" font-size="22" font-weight="bold">2 センターがマッチング</text><text x="36" y="280" font-size="20">援助できる援助会員を探す</text><rect x="20" y="330" width="400" height="104" rx="16" fill="white" stroke="#e8862e"/><text x="36" y="368" font-size="22" font-weight="bold">3 来館して登録</text><text x="36" y="404" font-size="20">登録料1,000円（税込）</text><rect x="20" y="454" width="400" height="104" rx="16" fill="white" stroke="#e8862e"/><text x="36" y="492" font-size="22" font-weight="bold">4 援助が始まる</text><text x="36" y="528" font-size="20">送迎・預かりを利用料で頼む</text></g></svg>
