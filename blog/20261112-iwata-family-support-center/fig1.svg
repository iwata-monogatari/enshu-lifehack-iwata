<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">ファミリー・サポート・センターの利用料と対象</title><rect width="440" height="600" fill="#fdf4ec"/><g font-family="Meiryo,sans-serif" fill="#7a3410"><text x="24" y="56" font-size="25" font-weight="bold">利用料の早見（1時間あたり）</text><rect x="20" y="82" width="400" height="128" rx="16" fill="white" stroke="#e8862e"/><text x="36" y="118" font-size="23" font-weight="bold">平日 600円</text><text x="36" y="154" font-size="20">土日祝 800円（年末年始を含む区分）</text><text x="36" y="186" font-size="20">平日の早朝・夜間 700円</text><rect x="20" y="230" width="400" height="128" rx="16" fill="white" stroke="#e8862e"/><text x="36" y="266" font-size="23" font-weight="bold">対象は0歳児から小学6年生</text><text x="36" y="302" font-size="20">送迎／放課後の預かり／外出時の預かり</text><text x="36" y="334" font-size="20">依頼会員・援助会員とも登録が必要</text><rect x="20" y="378" width="400" height="128" rx="16" fill="white" stroke="#e8862e"/><text x="36" y="414" font-size="23" font-weight="bold">登録料 1,000円（税込）</text><text x="36" y="450" font-size="20">事務局「のびのび」内 0538-37-4102</text><text x="36" y="482" font-size="20">受付9時〜18時（第4木曜・年末年始休み）</text></g></svg>
