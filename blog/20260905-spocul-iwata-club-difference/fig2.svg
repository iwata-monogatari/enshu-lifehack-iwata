<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
  <title id="title">SPO☆CUL IWATAの申込み前に家族が確認する順番</title>
  <desc id="desc">クラブ条件、月額と別途費用、会場と往復時間、送迎担当、通知の順に確認する流れを示す。</desc>
  <rect width="1200" height="675" fill="#f5f2e8"/>
  <text x="600" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#183b4e">申込み前に、五つを一枚に書く</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(55 150)"><circle cx="95" cy="95" r="88" fill="#dcecf2" stroke="#2d6f89" stroke-width="4"/><text x="95" y="82" font-size="30" font-weight="700" fill="#1d5269">1</text><text x="95" y="122" font-size="23" fill="#20313a">クラブ条件</text></g>
    <g transform="translate(285 150)"><circle cx="95" cy="95" r="88" fill="#e7f1d7" stroke="#62873b" stroke-width="4"/><text x="95" y="82" font-size="30" font-weight="700" fill="#466723">2</text><text x="95" y="118" font-size="22" fill="#20313a">月額と</text><text x="95" y="146" font-size="22" fill="#20313a">別途費用</text></g>
    <g transform="translate(515 150)"><circle cx="95" cy="95" r="88" fill="#fff1cf" stroke="#ba7426" stroke-width="4"/><text x="95" y="82" font-size="30" font-weight="700" fill="#8a4a13">3</text><text x="95" y="118" font-size="22" fill="#20313a">会場と</text><text x="95" y="146" font-size="22" fill="#20313a">往復時間</text></g>
    <g transform="translate(745 150)"><circle cx="95" cy="95" r="88" fill="#f1e2ef" stroke="#86547f" stroke-width="4"/><text x="95" y="82" font-size="30" font-weight="700" fill="#6c3c66">4</text><text x="95" y="122" font-size="23" fill="#20313a">送迎担当</text></g>
    <g transform="translate(975 150)"><circle cx="95" cy="95" r="88" fill="#e7e8eb" stroke="#626873" stroke-width="4"/><text x="95" y="82" font-size="30" font-weight="700" fill="#444b55">5</text><text x="95" y="122" font-size="23" fill="#20313a">通知確認</text></g>
  </g>
  <path d="M150 365v80h920v-80" fill="none" stroke="#53646c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="255" y="445" width="690" height="120" rx="28" fill="#fff" stroke="#53646c" stroke-width="4"/>
  <text x="600" y="495" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#183b4e">子どもの希望と、家族が続けられる条件を照合</text>
  <text x="600" y="538" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#53646c">わからない費用は空欄にせず「クラブへ確認」と残す</text>
  <text x="600" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#53646c">申込みは種目名だけで決めない</text>
</svg>
