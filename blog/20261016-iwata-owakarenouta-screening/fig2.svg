<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">家族で相談する順番</title><desc id="desc">予定の共有から公式確認と申込みへ進む図</desc><rect width="960" height="540" rx="24" fill="#eff5f5"/><g font-family="Meiryo,sans-serif" fill="#163b45"><text x="56" y="78" font-size="34" font-weight="bold">今日は、開催日を共有する</text><rect x="56" y="120" width="848" height="64" rx="12" fill="white"/><text x="82" y="162" font-size="27" font-weight="bold">今日</text><text x="310" y="162" font-size="27">開催日を家族と共有</text><rect x="56" y="220" width="848" height="64" rx="12" fill="white"/><text x="82" y="262" font-size="27" font-weight="bold">予定が合えば</text><text x="310" y="262" font-size="27">公式で受付状況を確認</text><rect x="56" y="320" width="848" height="64" rx="12" fill="white"/><text x="82" y="362" font-size="27" font-weight="bold">受付中なら</text><text x="310" y="362" font-size="27">人数・条件を確認し申込み</text><text x="56" y="492" font-size="21">無料・事前申込制・先着100名 ／ 定員で受付終了</text></g></svg>