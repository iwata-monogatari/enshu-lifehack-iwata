<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">健診案内が届く人と申込が要る人</title><rect width="440" height="560" fill="#edf4f7"/><g font-family="Meiryo,sans-serif" fill="#07384d"><text x="24" y="58" font-size="27" font-weight="bold">案内が届く人・申込が要る人</text><rect x="20" y="86" width="400" height="118" rx="16" fill="white" stroke="#0d5c7a"/><text x="36" y="124" font-size="25" font-weight="bold">1. 過去4年間に受診した</text><text x="36" y="168" font-size="23">4月中旬以降に個別案内が届く</text><rect x="20" y="224" width="400" height="118" rx="16" fill="white" stroke="#0d5c7a"/><text x="36" y="262" font-size="25" font-weight="bold">2. 毎年受診している</text><text x="36" y="306" font-size="23">申込不要・4月下旬頃から送付</text><rect x="20" y="362" width="400" height="118" rx="16" fill="white" stroke="#0d5c7a"/><text x="36" y="400" font-size="25" font-weight="bold">3. 初めて・変更したい</text><text x="36" y="444" font-size="23">案内申込が必要（WEB・電話）</text><rect x="20" y="500" width="400" height="40" rx="12" fill="#e2eff5"/><text x="220" y="528" font-size="20" text-anchor="middle">健康増進課 0538-37-2011</text></g></svg>
