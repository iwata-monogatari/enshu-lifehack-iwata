<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">特定健診・がん検診の受け方と期間</title><rect width="440" height="600" fill="#edf4f7"/><g font-family="Meiryo,sans-serif" fill="#07384d"><text x="24" y="58" font-size="27" font-weight="bold">受け方と期間（令和8年度）</text><rect x="20" y="86" width="400" height="118" rx="16" fill="white" stroke="#0d5c7a"/><text x="36" y="124" font-size="25" font-weight="bold">集団バス検診 5月〜11月末</text><text x="36" y="168" font-size="23">希望日の3週間前までに予約</text><rect x="20" y="224" width="400" height="118" rx="16" fill="white" stroke="#0d5c7a"/><text x="36" y="262" font-size="25" font-weight="bold">医療機関 6月〜翌年3月</text><text x="36" y="306" font-size="23">子宮頸がん・乳がんエコーのみ</text><rect x="20" y="362" width="400" height="100" rx="16" fill="white" stroke="#0d5c7a"/><text x="36" y="400" font-size="25" font-weight="bold">特定健診も同時に受診可</text><text x="36" y="440" font-size="23">集団バスで国保・後期高齢者</text><rect x="20" y="482" width="400" height="88" rx="16" fill="#fdf0e7" stroke="#c2501e"/><text x="36" y="520" font-size="23" font-weight="bold" fill="#8a3a14">対象年齢は令和9年3月31日時点</text><text x="36" y="552" font-size="21" fill="#8a3a14">75歳以上の金額は受診日の年齢</text></g></svg>
