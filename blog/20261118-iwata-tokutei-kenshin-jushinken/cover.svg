<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title"><title id="title">磐田市の特定健診・がん検診の受診券｜案内が届く人・申込が要る人、集団バス検診は11月末までの記事表紙</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d5c7a"/><stop offset="1" stop-color="#07384d"/></linearGradient></defs><rect width="760" height="760" fill="url(#bg)"/><g fill="none" stroke="#8fc3d8" stroke-width="3" opacity="0.5"><path d="M0 622 Q 120 600 260 620 T 520 618 T 760 614"/><path d="M0 668 Q 140 646 300 666 T 600 664 T 760 660"/><path d="M0 712 Q 120 692 280 710 T 560 708 T 760 704"/></g><rect x="96" y="96" width="568" height="470" rx="26" fill="#ffffff"/><g font-family="Meiryo,sans-serif"><rect x="128" y="128" width="176" height="48" rx="24" fill="#e2eff5"/><text x="216" y="161" font-size="25" font-weight="bold" fill="#07384d" text-anchor="middle">手続き・制度</text><text x="128" y="240" font-size="43" font-weight="bold" fill="#07384d">健診の案内は</text><text x="128" y="298" font-size="43" font-weight="bold" fill="#07384d">届く人と</text><text x="128" y="356" font-size="43" font-weight="bold" fill="#07384d">申込が要る人</text><text x="128" y="416" font-size="30" fill="#07384d">集団バス検診は <tspan font-weight="bold" fill="#c2501e">11月末まで</tspan></text><text x="128" y="462" font-size="24" fill="#3d6070">特定健診も集団バスで同時受診可</text><text x="128" y="520" font-size="21" fill="#7b9aab">磐田ライフハック iwata.enshu-lifehack.com</text></g></svg>
