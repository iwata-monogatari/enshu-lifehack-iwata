<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t" data-illustration="iwata-editorial"><title id="t">きょうだいで申し込むとき。実績を見る単位と、手続きの単位</title><rect width="640" height="360" rx="18" fill="#f4f6ed"/><g font-family="sans-serif"><text x="24" y="42" text-anchor="start" fill="#173c43" font-size="32">きょうだいで申し込むとき</text><text x="25" y="73" text-anchor="start" fill="#335851" font-size="20">実績を見る単位と、手続きの単位</text><rect x="38" y="91" width="564" height="60" rx="14" fill="#194c50"/><text x="320" y="129" text-anchor="middle" fill="white" font-size="25">令和8年度の利用実績は世帯で確認</text><path d="M320 151v18H165v25m155-25h155v25" stroke="#326c69" stroke-width="4" fill="none"/><rect x="16" y="192" width="296" height="148" rx="14" fill="#d4ebe2"/><text x="164" y="230" text-anchor="middle" fill="#173c43" font-size="24">姉の令和9年度分</text><text x="164" y="278" text-anchor="middle" fill="#173c43" font-size="26">姉の申請を送信</text><text x="164" y="315" text-anchor="middle" fill="#173c43" font-size="20">姉の完了メールを確認</text><rect x="328" y="192" width="296" height="148" rx="14" fill="#f5e5c8"/><text x="476" y="230" text-anchor="middle" fill="#173c43" font-size="24">弟の令和9年度分</text><text x="476" y="278" text-anchor="middle" fill="#173c43" font-size="26">弟の申請を送信</text><text x="476" y="315" text-anchor="middle" fill="#173c43" font-size="20">弟の完了メールを確認</text></g></svg>