<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t" data-illustration="iwata-editorial"><title id="t">月64時間に届かないとき。令和9年度の公設民営クラブ・就労の場合</title><rect width="640" height="360" rx="18" fill="#f4f6ed"/><g font-family="sans-serif"><text x="24" y="42" text-anchor="start" fill="#173c43" font-size="32">月64時間に届かないとき</text><text x="25" y="73" text-anchor="start" fill="#335851" font-size="20">令和9年度の公設民営クラブ・就労の場合</text><rect x="38" y="91" width="564" height="60" rx="14" fill="#194c50"/><text x="320" y="129" text-anchor="middle" fill="white" font-size="25">令和8年度の世帯の利用実績</text><path d="M320 151v18H165v25m155-25h155v25" stroke="#326c69" stroke-width="4" fill="none"/><rect x="16" y="192" width="296" height="148" rx="14" fill="#d4ebe2"/><text x="164" y="230" text-anchor="middle" fill="#173c43" font-size="24">実績あり</text><text x="164" y="278" text-anchor="middle" fill="#173c43" font-size="26">経過措置で申請可</text><text x="164" y="315" text-anchor="middle" fill="#173c43" font-size="20">他の基準と審査あり</text><rect x="328" y="192" width="296" height="148" rx="14" fill="#f5e5c8"/><text x="476" y="230" text-anchor="middle" fill="#173c43" font-size="24">実績なし</text><text x="476" y="278" text-anchor="middle" fill="#173c43" font-size="26">この措置の対象外</text><text x="476" y="315" text-anchor="middle" fill="#173c43" font-size="20">別の事由は市に確認</text></g></svg>