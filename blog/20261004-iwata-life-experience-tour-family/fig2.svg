<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial"><rect width="960" height="540" rx="24" fill="#edf5f8"/><g font-family="Meiryo,sans-serif" fill="#15394c"><text x="48" y="65" font-size="32">現地に持っていく、家族メモ</text><text x="48" y="110" font-size="25">問いの例：雨の日の送迎と仕事を両立できる？</text><rect x="48" y="155" width="264" height="282" rx="16" fill="white"/><text x="68" y="204" font-size="26">見たこと</text><text x="68" y="266" font-size="21">道路・歩く場所</text><text x="68" y="317" font-size="21">住まいの周辺</text><text x="68" y="368" font-size="21">印象と事実は別に</text><rect x="348" y="155" width="264" height="282" rx="16" fill="white"/><text x="368" y="204" font-size="26">市に聞くこと</text><text x="368" y="266" font-size="21">同行・宿泊の条件</text><text x="368" y="317" font-size="21">見学後の相談先</text><text x="368" y="368" font-size="21">回答日も記録する</text><rect x="648" y="155" width="264" height="282" rx="16" fill="white"/><text x="668" y="204" font-size="26">帰宅後に調べる</text><text x="668" y="266" font-size="21">平日の移動時間</text><text x="668" y="317" font-size="21">預け先の申込条件</text><text x="668" y="368" font-size="21">毎月の家計の負担</text><text x="48" y="485" font-size="26">今日の一歩：現地で確かめたいことを一つ書く</text><text x="48" y="520" font-size="19">記入例です。実在の相談記録やツアー行程図ではありません。</text></g></svg>