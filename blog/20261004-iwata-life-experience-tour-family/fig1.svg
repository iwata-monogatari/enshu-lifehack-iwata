<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial"><rect width="960" height="540" rx="24" fill="#edf5f8"/><g font-family="Meiryo,sans-serif" fill="#15394c"><text x="48" y="65" font-size="32">いわたの暮らし体験ツアー</text><text x="48" y="104" font-size="22">申込前に、家族の条件を一つずつ</text><rect x="48" y="138" width="864" height="86" rx="16" fill="white"/><circle cx="91" cy="181" r="25" fill="#0074ae"/><text x="83" y="190" fill="white" font-size="26">1</text><text x="135" y="172" font-size="25">対象条件を市に確認</text><text x="135" y="203" font-size="21">東京圏／静岡県外の表記差・同行家族</text><rect x="48" y="240" width="864" height="86" rx="16" fill="white"/><circle cx="91" cy="283" r="25" fill="#0074ae"/><text x="83" y="292" fill="white" font-size="26">2</text><text x="135" y="274" font-size="25">11月7日・8日の予定を照合</text><text x="135" y="305" font-size="21">集合までの移動・宿泊・帰宅後の予定</text><rect x="48" y="342" width="864" height="86" rx="16" fill="white"/><circle cx="91" cy="385" r="25" fill="#0074ae"/><text x="83" y="394" fill="white" font-size="26">3</text><text x="135" y="376" font-size="25">食事代と交通費を整理</text><text x="135" y="407" font-size="21">初日夕食3,000円／翌日の朝食・昼食は自己負担</text><text x="48" y="484" font-size="25">申込期限 2026年10月18日 → 市公式のフォームへ</text><text x="48" y="518" font-size="19">早期締切の場合あり・残枠未確認（2026年10月4日確認）</text></g></svg>