<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">2026年11月2日からの窓口と電話の受付時間</title><desc id="desc">窓口は9時から16時30分。電話は8時30分から17時15分で変更なし。</desc><rect width="600" height="600" rx="20" fill="#f0f6fa"/><g font-family="Meiryo,sans-serif" fill="#163b50"><text x="28" y="52" font-size="29" font-weight="bold">窓口と電話は、別の受付時間</text><text x="28" y="94" font-size="25">2026年11月2日（月）から</text><rect x="22" y="125" width="556" height="166" rx="15" fill="white"/><text x="45" y="168" font-size="27" font-weight="bold">窓口  9:00 — 16:30</text><rect x="72" y="190" width="450" height="28" rx="8" fill="#0074ae"/><text x="45" y="260" font-size="24">iプラザ・各支所など／時間変更</text><rect x="22" y="313" width="556" height="166" rx="15" fill="white"/><text x="45" y="356" font-size="27" font-weight="bold">電話  8:30 — 17:15</text><rect x="42" y="378" width="525" height="28" rx="8" fill="#397b63"/><text x="45" y="448" font-size="24">電話の受付時間は変更なし</text><text x="28" y="527" font-size="24">認定書は当日発行できない場合も。</text><text x="28" y="567" font-size="22">出典：磐田市の時間変更・交付案内</text></g></svg>