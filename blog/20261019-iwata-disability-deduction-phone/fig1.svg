<svg xmlns="http://www.w3.org/2000/svg" width="600" height="630" viewBox="0 0 600 630" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">障害者控除対象者認定書の電話確認の順番</title><desc id="desc">対象年を決め、電話で確認し、その後に申請方法と予定を決める。</desc><rect width="600" height="630" rx="20" fill="#f0f6fa"/><g font-family="Meiryo,sans-serif" fill="#163b50"><text x="28" y="52" font-size="29" font-weight="bold">親の認定書：電話確認の順番</text><rect x="22" y="80" width="556" height="143" rx="15" fill="white"/><circle cx="65" cy="125" r="25" fill="#0074ae"/><text x="65" y="134" text-anchor="middle" font-size="27" fill="white">1</text><text x="108" y="127" font-size="28" font-weight="bold">電話の前</text><text x="108" y="169" font-size="27">何年分かを決める</text><text x="108" y="206" font-size="25">親の被保険者証を手元に</text><rect x="22" y="240" width="556" height="143" rx="15" fill="white"/><circle cx="65" cy="285" r="25" fill="#0074ae"/><text x="65" y="294" text-anchor="middle" font-size="27" fill="white">2</text><text x="108" y="287" font-size="28" font-weight="bold">電話で確認</text><text x="108" y="329" font-size="27">対象可否・受付時期</text><text x="108" y="366" font-size="25">必要書類・受取りも聞く</text><rect x="22" y="400" width="556" height="143" rx="15" fill="white"/><circle cx="65" cy="445" r="25" fill="#0074ae"/><text x="65" y="454" text-anchor="middle" font-size="27" fill="white">3</text><text x="108" y="447" font-size="28" font-weight="bold">確認した後</text><text x="108" y="489" font-size="27">次にすることを一つ</text><text x="108" y="526" font-size="25">申請方法と予定を決める</text><text x="28" y="596" font-size="24">電話確認だけでは申請は完了しません。</text></g></svg>