<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">文化財フェスティバルの二つの会場</title><desc id="desc">見付の埋蔵文化財センターと岡の歴史文書館は別の会場。職業体験は事前申込、展示解説は当日受付で、企画ごとに条件が異なる。</desc><rect width="960" height="600" rx="24" fill="#f1f6f7"/><g font-family="Meiryo, sans-serif" fill="#173f50"><text x="50" y="65" font-size="30" font-weight="bold">11月29日（日）｜会場は二つ</text><text x="50" y="105" font-size="19">いわた文化財フェスティバル2026</text><rect x="50" y="145" width="420" height="335" rx="18" fill="#fff" stroke="#b5cbd3"/><rect x="490" y="145" width="420" height="335" rx="18" fill="#fff" stroke="#b5cbd3"/><text x="80" y="193" font-size="27" font-weight="bold">埋蔵文化財センター</text><text x="80" y="230" font-size="21">見付3678－1</text><path d="M80 251 H440" stroke="#d4e1e6"/><text x="80" y="293" font-size="22" font-weight="bold">文化財課職業体験</text><text x="80" y="328" font-size="20">事前申込・小学5年生以上</text><text x="80" y="385" font-size="22" font-weight="bold">展示解説</text><text x="80" y="420" font-size="20">当日受付・どなたでも</text><text x="520" y="193" font-size="27" font-weight="bold">歴史文書館</text><text x="520" y="230" font-size="21">岡729－1／竜洋支所内</text><path d="M520 251 H880" stroke="#d4e1e6"/><text x="520" y="293" font-size="22" font-weight="bold">企画展の特別開館など</text><text x="520" y="335" font-size="20">相撲と磐田に関わる企画</text><text x="520" y="385" font-size="20">申込・対象は各企画で確認</text><rect x="50" y="505" width="860" height="58" rx="14" fill="#173f50"/><text x="80" y="543" font-size="23" fill="#fff">同じ行事名でも、参加条件は一律ではありません</text></g></svg>