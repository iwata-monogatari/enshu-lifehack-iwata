<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">出土品と埋蔵文化財センターの役割</title><desc id="desc">土器や石器などの出土品に対して、収蔵保管、調査研究、展示の機能があることを示す関係図。</desc><rect width="960" height="600" rx="24" fill="#f1f6f7"/><g font-family="Meiryo, sans-serif" fill="#173f50"><text x="50" y="65" font-size="30" font-weight="bold">出土品を残し、調べ、伝える</text><text x="50" y="104" font-size="19">埋蔵文化財センターが担う役割</text><rect x="50" y="150" width="250" height="350" rx="18" fill="#fff" stroke="#b5cbd3"/><path d="M112 220 Q125 240 120 260 L110 300 Q170 338 230 300 L220 260 Q215 240 228 220 Z" fill="#c89768" stroke="#805e41" stroke-width="4"/><path d="M121 263 L219 263 M115 289 L225 289" stroke="#805e41" stroke-width="4"/><text x="90" y="375" font-size="27" font-weight="bold">市内の出土品</text><text x="85" y="418" font-size="20">土器・石器など</text><text x="85" y="455" font-size="17">図は資料のイメージです</text><path d="M320 325 L365 325 M350 313 L365 325 L350 337" fill="none" stroke="#277b91" stroke-width="5"/>
<rect x="390" y="150" width="520" height="100" rx="16" fill="#fff" stroke="#b5cbd3"/><circle cx="430" cy="200" r="12" fill="#277b91"/><text x="463" y="189" font-size="26" font-weight="bold">収蔵保管</text><text x="463" y="224" font-size="20">資料を施設に収蔵し、保管する</text><rect x="390" y="275" width="520" height="100" rx="16" fill="#fff" stroke="#b5cbd3"/><circle cx="430" cy="325" r="12" fill="#277b91"/><text x="463" y="314" font-size="26" font-weight="bold">調査研究</text><text x="463" y="349" font-size="20">市内の遺跡から出た資料を調べる</text><rect x="390" y="400" width="520" height="100" rx="16" fill="#fff" stroke="#b5cbd3"/><circle cx="430" cy="450" r="12" fill="#277b91"/><text x="463" y="439" font-size="26" font-weight="bold">展示</text><text x="463" y="474" font-size="20">時代ごとの遺跡や遺物を伝える</text><text x="50" y="550" font-size="18">施設の機能を示す図です。個別の作業手順・工程順ではありません。</text></g></svg>