<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">浜部と渚の交流館の施設カード。浜部では避難利用階と最高部がともに12.3m、渚の交流館では17mと20mに分かれる。</title><rect width="720" height="460" rx="20" fill="#f8f5eb"/><g font-family="Meiryo,sans-serif" fill="#173e41"><text x="28" y="51" font-size="30" >同じ欄を横に読む｜海抜の比較</text><rect x="18" y="200" width="684" height="82" rx="10" fill="#d6eae2"/><text x="273" y="117" font-size="25" >浜部</text><text x="463" y="117" font-size="25" >渚の交流館</text><text x="32" y="177" font-size="24" >地盤</text><text x="275" y="177" font-size="27" >2.3m</text><text x="470" y="177" font-size="27" >5m</text><text x="32" y="252" font-size="26" font-weight="bold">避難利用階</text><text x="275" y="252" font-size="32" font-weight="bold">12.3m</text><text x="470" y="252" font-size="32" font-weight="bold">17m</text><text x="32" y="338" font-size="24" >最高部</text><text x="275" y="338" font-size="27" >12.3m</text><text x="470" y="338" font-size="27" >20m</text><text x="30" y="422" font-size="20" >すべて海抜で表示。出典：磐田市公共施設一覧</text></g></svg>
