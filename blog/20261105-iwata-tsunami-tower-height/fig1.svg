<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">渚の交流館の海抜を同じ物差しで示す図。地盤5m、避難利用階17m、最高部20mで、避難利用階と最高部の差は3m。</title><rect width="720" height="460" rx="20" fill="#f8f5eb"/><g font-family="Meiryo,sans-serif" fill="#173e41"><text x="30" y="50" font-size="31" >渚の交流館｜海面から測る高さ</text><path d="M110 100V380M100 100H310M100 142H310M100 310H310M70 380H310" stroke="#627571" stroke-width="3"/><rect x="140" y="142" width="125" height="168" fill="#d9e7e0"/><path d="M140 142H265" stroke="#006959" stroke-width="10"/><text x="327" y="109" font-size="25" >最高部　海抜20m</text><text x="327" y="153" font-size="28" font-weight="bold">避難利用階　海抜17m</text><text x="327" y="319" font-size="26" >地盤　海抜5m</text><text x="327" y="389" font-size="24" >基準　海抜0m</text><text x="30" y="437" font-size="20" >数値の位置関係を示す模式図。出典：磐田市公共施設一覧</text></g></svg>
