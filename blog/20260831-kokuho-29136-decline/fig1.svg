<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="磐田市の国民健康保険の被保険者数と加入率の7年間の推移を示した図。磐田市が公表した数字で見る磐田市の国保（令和6年度速報値）によると、被保険者数と市の人口と被保険者割合は、平成30年度末が36,915人・169,725人・21.7パーセント、令和元年度末が35,695人・169,673人・21.0パーセント、令和2年度末が35,182人・169,013人・20.8パーセント、令和3年度末が34,069人・167,663人・20.3パーセント、令和4年度末が32,467人・167,375人・19.4パーセント、令和5年度末が30,619人・166,307人・18.4パーセント、令和6年度末が29,136人・164,914人・17.7パーセント。令和元年度末から令和6年度末までの5年間で被保険者は6,559人、18.4パーセント減ったのに対し、市の人口は4,759人、2.8パーセントの減少にとどまる。国保加入世帯も22,210世帯から19,536世帯へ2,674世帯減り、市の総世帯数が68,858世帯から71,840世帯へ2,982世帯増えているのと逆向きに動いている。国保加入世帯の割合は32.3パーセントから27.2パーセントへ下がった" data-illustration="iwata-editorial" data-variant="1">
<defs>
<linearGradient id="bgK1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5f9"/><stop offset="1" stop-color="#f7f6ee"/></linearGradient>
<filter id="cardK1"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#123a52" flood-opacity=".16"/></filter>
<style>.tK{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;font-weight:700;fill:#123a52}.cK{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;fill:#3c5b6d}.wK{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;font-weight:700;fill:#fff}.nK{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;fill:#5c7688}.rK{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;font-weight:700;fill:#c9522f}</style>
</defs>
<rect width="1000" height="640" rx="22" fill="url(#bgK1)"/>
<g filter="url(#cardK1)"><rect x="40" y="26" width="920" height="102" rx="18" fill="#ffffff" opacity=".96"/></g>
<text x="70" y="63" class="cK" font-size="18">移住・暮らし・データ ── 磐田市の国民健康保険 被保険者数の推移（2026年8月31日確認）</text>
<text x="68" y="105" class="tK" font-size="27">人口は2.8%減、国保は18.4%減。減り方の速さが違う</text>

<g filter="url(#cardK1)"><rect x="40" y="158" width="920" height="286" rx="16" fill="#ffffff"/></g>
<rect x="40" y="158" width="920" height="44" rx="16" fill="#005986"/>
<rect x="40" y="188" width="920" height="14" fill="#005986"/>
<text x="64" y="188" class="wK" font-size="19">各年度末の被保険者数・市の人口・被保険者割合</text>

<text x="70" y="232" class="nK" font-size="15">年度末</text>
<text x="330" y="232" class="nK" font-size="15" text-anchor="end">国保 被保険者数</text>
<text x="560" y="232" class="nK" font-size="15" text-anchor="end">磐田市 人口</text>
<text x="720" y="232" class="nK" font-size="15" text-anchor="end">被保険者割合</text>
<text x="940" y="232" class="nK" font-size="15" text-anchor="end">前年度からの増減</text>
<line x1="64" y1="242" x2="940" y2="242" stroke="#cfdde6" stroke-width="2"/>

<text x="70" y="270" class="cK" font-size="16">平成30年度末</text>
<text x="330" y="270" class="tK" font-size="17" text-anchor="end">36,915 人</text>
<text x="560" y="270" class="cK" font-size="16" text-anchor="end">169,725 人</text>
<text x="720" y="270" class="tK" font-size="17" text-anchor="end">21.7%</text>
<text x="940" y="270" class="nK" font-size="15" text-anchor="end">—</text>

<text x="70" y="298" class="cK" font-size="16">令和元年度末</text>
<text x="330" y="298" class="tK" font-size="17" text-anchor="end">35,695 人</text>
<text x="560" y="298" class="cK" font-size="16" text-anchor="end">169,673 人</text>
<text x="720" y="298" class="tK" font-size="17" text-anchor="end">21.0%</text>
<text x="940" y="298" class="rK" font-size="15" text-anchor="end">−1,220 人</text>

<text x="70" y="326" class="cK" font-size="16">令和2年度末</text>
<text x="330" y="326" class="tK" font-size="17" text-anchor="end">35,182 人</text>
<text x="560" y="326" class="cK" font-size="16" text-anchor="end">169,013 人</text>
<text x="720" y="326" class="tK" font-size="17" text-anchor="end">20.8%</text>
<text x="940" y="326" class="rK" font-size="15" text-anchor="end">−513 人</text>

<text x="70" y="354" class="cK" font-size="16">令和3年度末</text>
<text x="330" y="354" class="tK" font-size="17" text-anchor="end">34,069 人</text>
<text x="560" y="354" class="cK" font-size="16" text-anchor="end">167,663 人</text>
<text x="720" y="354" class="tK" font-size="17" text-anchor="end">20.3%</text>
<text x="940" y="354" class="rK" font-size="15" text-anchor="end">−1,113 人</text>

<text x="70" y="382" class="cK" font-size="16">令和4年度末</text>
<text x="330" y="382" class="tK" font-size="17" text-anchor="end">32,467 人</text>
<text x="560" y="382" class="cK" font-size="16" text-anchor="end">167,375 人</text>
<text x="720" y="382" class="tK" font-size="17" text-anchor="end">19.4%</text>
<text x="940" y="382" class="rK" font-size="15" text-anchor="end">−1,602 人</text>

<text x="70" y="410" class="cK" font-size="16">令和5年度末</text>
<text x="330" y="410" class="tK" font-size="17" text-anchor="end">30,619 人</text>
<text x="560" y="410" class="cK" font-size="16" text-anchor="end">166,307 人</text>
<text x="720" y="410" class="tK" font-size="17" text-anchor="end">18.4%</text>
<text x="940" y="410" class="rK" font-size="15" text-anchor="end">−1,848 人</text>

<rect x="56" y="418" width="888" height="18" fill="#fdf3ef"/>
<text x="70" y="433" class="tK" font-size="16">令和6年度末</text>
<text x="330" y="433" class="rK" font-size="18" text-anchor="end">29,136 人</text>
<text x="560" y="433" class="cK" font-size="16" text-anchor="end">164,914 人</text>
<text x="720" y="433" class="rK" font-size="18" text-anchor="end">17.7%</text>
<text x="940" y="433" class="rK" font-size="15" text-anchor="end">−1,483 人</text>

<g filter="url(#cardK1)"><rect x="40" y="466" width="440" height="112" rx="16" fill="#ffffff"/></g>
<rect x="40" y="466" width="440" height="40" rx="16" fill="#0074AE"/>
<rect x="40" y="492" width="440" height="14" fill="#0074AE"/>
<text x="64" y="493" class="wK" font-size="18">5年間の変化（令和元年度末→令和6年度末）</text>
<text x="66" y="528" class="cK" font-size="15">国保 被保険者</text>
<text x="456" y="528" class="rK" font-size="19" text-anchor="end">−6,559 人（−18.4%）</text>
<text x="66" y="558" class="cK" font-size="15">磐田市 人口</text>
<text x="456" y="558" class="tK" font-size="19" text-anchor="end">−4,759 人（−2.8%）</text>

<g filter="url(#cardK1)"><rect x="520" y="466" width="440" height="112" rx="16" fill="#ffffff"/></g>
<rect x="520" y="466" width="440" height="40" rx="16" fill="#0074AE"/>
<rect x="520" y="492" width="440" height="14" fill="#0074AE"/>
<text x="544" y="493" class="wK" font-size="18">世帯は逆を向いている（同じ5年）</text>
<text x="546" y="528" class="cK" font-size="15">国保 加入世帯</text>
<text x="936" y="528" class="rK" font-size="19" text-anchor="end">22,210 → 19,536 世帯</text>
<text x="546" y="558" class="cK" font-size="15">磐田市 総世帯数</text>
<text x="936" y="558" class="tK" font-size="19" text-anchor="end">68,858 → 71,840 世帯</text>

<text x="60" y="602" class="nK" font-size="15">※増減数・増減率・世帯の比較は当方算出。国保加入世帯の割合は32.3%（令和元年度末）から27.2%（令和6年度末）へ低下。</text>
<text x="60" y="626" class="nK" font-size="15">出典：磐田市「医療保険制度と磐田市国保の状況（数字で見る磐田市の国保　令和6年度速報値）」国保運営協議会資料</text>
