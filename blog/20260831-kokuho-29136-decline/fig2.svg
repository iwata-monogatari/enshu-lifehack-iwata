<text x="940" y="518" class="rM" font-size="23" text-anchor="end">−1,483 人</text>

<text x="60" y="596" class="rM" font-size="16">※社会保険との出入りは、国保を「増やす」側に回っている。減らしているのは75歳到達による移行だけ。</text>
<text x="60" y="622" class="nM" font-size="15">出典：磐田市「医療保険制度と磐田市国保の状況（数字で見る磐田市の国保　令和6年度速報値）」国保運営協議会資料。差引は当方算出。</text>
