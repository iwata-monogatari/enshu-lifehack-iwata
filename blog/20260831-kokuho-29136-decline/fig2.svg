<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="磐田市の令和6年度の国民健康保険の異動状況を理由別に分解した図。磐田市が公表した数字で見る磐田市の国保（令和6年度速報値）によると、国保に入った人は8,101人で、内訳は社会保険を抜けた人6,211人、転入1,543人、生活保護の廃止35人、出生77人、後期高齢者医療からの離脱0人、その他235人。国保を抜けた人は9,584人で、内訳は社会保険への加入5,297人、転出1,238人、生活保護の開始91人、死亡239人、後期高齢者医療への加入2,286人、その他433人。差引すると社会保険との出入りはプラス914人、後期高齢者医療との出入りはマイナス2,286人、転出入はプラス305人、出生と死亡はマイナス162人、生活保護はマイナス56人、その他はマイナス198人で、合計はマイナス1,483人となる。国保を減らしているのは後期高齢者医療への移行だけであり、社会保険との出入りはむしろ国保を増やす側に回っていることを示している。その他には世帯分離や世帯合併が含まれると磐田市が注記している" data-illustration="iwata-editorial" data-variant="2">
