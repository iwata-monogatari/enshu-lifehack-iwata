<text x="64" y="448" class="wM" font-size="19">理由別に差し引くと（当方算出）</text>

<text x="80" y="492" class="cM" font-size="15">社会保険との出入り</text>
<text x="80" y="518" class="gM" font-size="23">＋914 人</text>
<text x="80" y="542" class="nM" font-size="13">6,211 − 5,297</text>

<text x="300" y="492" class="cM" font-size="15">後期高齢者医療</text>
<text x="300" y="518" class="rM" font-size="23">−2,286 人</text>
<text x="300" y="542" class="nM" font-size="13">0 − 2,286</text>

