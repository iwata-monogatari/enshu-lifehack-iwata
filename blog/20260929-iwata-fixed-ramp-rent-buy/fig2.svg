<svg xmlns="http://www.w3.org/2000/svg" data-illustration="iwata-editorial" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">借りる・買う・工事するの相談順序</title><desc id="desc">借りる・買う・工事するの相談順序</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".12"/></filter></defs>
<rect width="100%" height="100%" rx="28" fill="#f7f5ef"/>
<text x="480" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#263746">費用の前に、設置方法と利用期間を確認</text><g font-family="sans-serif" text-anchor="middle"><g filter="url(#shadow)"><rect x="45" y="120" width="260" height="250" rx="22" fill="#fff"/><rect x="350" y="120" width="260" height="250" rx="22" fill="#fff"/><rect x="655" y="120" width="260" height="250" rx="22" fill="#fff"/></g><g font-size="27" font-weight="700"><text x="175" y="175" fill="#2f708d">借りる</text><text x="480" y="175" fill="#6c7f46">買う</text><text x="785" y="175" fill="#a35e36">工事する</text></g><g font-size="19" fill="#51616c"><text x="175" y="225">状態変化に合わせやすい</text><text x="175" y="258">対象用具・期間を確認</text><text x="480" y="225">長期利用も含めて比較</text><text x="480" y="258">購入前の手続きを確認</text><text x="785" y="225">床・通路を恒久変更</text><text x="785" y="258">着工前の申請を確認</text></g><g font-size="18" fill="#7a4e2f"><text x="175" y="325">福祉用具専門相談員</text><text x="480" y="325">指定事業者</text><text x="785" y="325">ケアマネ・施工者・市</text></g><rect x="160" y="425" width="640" height="58" rx="16" fill="#edf3f6"/><text x="480" y="462" font-size="22" font-weight="700" fill="#334d5c">注文・支払い・着工より前に相談する</text></g></svg>