<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" data-illustration="iwata-editorial"><rect width="960" height="600" rx="24" fill="#f2f7f5"/><g font-family="Meiryo,sans-serif" fill="#173d50"><text x="48" y="66" font-size="32" font-weight="bold">人生会議は、気持ちに戻れる話し合い</text><text x="48" y="108" font-size="21">本人の希望を一度で固定しない</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347d85"/></marker></defs><g fill="none" stroke="#347d85" stroke-width="5" marker-end="url(#a)"><path d="M405 240H515"/><path d="M735 315V365"/><path d="M535 442H425"/><path d="M215 370V320"/></g><rect x="65" y="165" width="360" height="140" rx="20" fill="white" stroke="#b9d7d6" stroke-width="2"/><circle cx="100" cy="204" r="22" fill="#dceceb"/><text x="93" y="212" font-size="23">1</text><text x="133" y="213" font-size="23" font-weight="bold">大切にしたいこと</text><text x="95" y="264" font-size="23">本人の言葉から</text><rect x="535" y="165" width="360" height="140" rx="20" fill="white" stroke="#b9d7d6" stroke-width="2"/><circle cx="570" cy="204" r="22" fill="#dceceb"/><text x="563" y="212" font-size="23">2</text><text x="603" y="213" font-size="23" font-weight="bold">話す・共有する</text><text x="565" y="264" font-size="23">家族や医療者と</text><rect x="535" y="375" width="360" height="140" rx="20" fill="white" stroke="#b9d7d6" stroke-width="2"/><circle cx="570" cy="414" r="22" fill="#dceceb"/><text x="563" y="422" font-size="23">3</text><text x="603" y="423" font-size="23" font-weight="bold">気持ちを確かめ直す</text><text x="565" y="474" font-size="23">変わってもよい</text><rect x="65" y="375" width="360" height="140" rx="20" fill="white" stroke="#b9d7d6" stroke-width="2"/><circle cx="100" cy="414" r="22" fill="#dceceb"/><text x="93" y="422" font-size="23">4</text><text x="133" y="423" font-size="23" font-weight="bold">また話す</text><text x="95" y="474" font-size="23">話したくない日は休む</text><text x="48" y="562" font-size="20">市の説明を基に作図｜話すことを押しつけない</text></g></svg>