<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" data-illustration="iwata-editorial"><rect width="960" height="600" rx="24" fill="#f2f7f5"/><g font-family="Meiryo,sans-serif" fill="#173d50"><text x="48" y="66" font-size="32" font-weight="bold">同じ紙に、混ぜずに残す</text><text x="48" y="108" font-size="21">希望・支える条件・専門職への質問を分けるメモ</text><rect x="40" y="157" width="260" height="326" rx="16" fill="white" stroke="#b9d7d6" stroke-width="2"/><rect x="60" y="145" width="80" height="28" rx="5" fill="#c6dfd9"/><text x="62" y="216" font-size="26" font-weight="bold">1 本人の言葉</text><text x="62" y="274" font-size="21">話した日を添える</text><text x="62" y="323" font-size="21">「家で過ごせたら</text><text x="62" y="372" font-size="21">うれしい」</text><text x="62" y="421" font-size="21">願いとして残す</text><rect x="350" y="157" width="260" height="326" rx="16" fill="white" stroke="#b9d7d6" stroke-width="2"/><rect x="370" y="145" width="80" height="28" rx="5" fill="#c6dfd9"/><text x="372" y="216" font-size="26" font-weight="bold">2 家族の事情</text><text x="372" y="274" font-size="21">誰が担えるか</text><text x="372" y="323" font-size="21">「平日昼は仕事」</text><text x="372" y="372" font-size="21">「連絡はできる」</text><text x="372" y="421" font-size="21">無理な約束をしない</text><rect x="660" y="157" width="260" height="326" rx="16" fill="white" stroke="#b9d7d6" stroke-width="2"/><rect x="680" y="145" width="80" height="28" rx="5" fill="#c6dfd9"/><text x="682" y="216" font-size="26" font-weight="bold">3 相談したいこと</text><text x="682" y="274" font-size="21">分からない点</text><text x="682" y="323" font-size="21">「どんな支援が</text><text x="682" y="372" font-size="21">必要だろう？」</text><text x="682" y="421" font-size="21">専門職へ持ち込む</text><text x="48" y="545" font-size="23">本人の願い ≠ 家族の約束 ≠ 治療の決定</text><text x="48" y="580" font-size="18">筆者の整理案・記入内容は架空の例です。市の提出様式ではありません。</text></g></svg>