<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">会期・時間・休館日を一組に</title><desc id="desc">担当課の受付時間と、展示時間は別に読みます</desc><rect width="960" height="540" rx="22" fill="#eef5f8"/><g font-family="Meiryo, sans-serif" fill="#123a52"><text x="50" y="65" font-size="32" font-weight="bold">会期・時間・休館日を一組に</text><text x="50" y="105" font-size="21">担当課の受付時間と、展示時間は別に読みます</text><rect x="45" y="140" width="870" height="100" rx="15" fill="white"/><text x="70" y="177" font-size="21">会期</text><text x="70" y="217" font-size="30" font-weight="bold">2026年10月30日 → 2027年1月24日</text><rect x="45" y="260" width="370" height="130" rx="15" fill="white"/><text x="70" y="301" font-size="22">展示時間</text><text x="70" y="354" font-size="34" font-weight="bold">8:30 → 17:00</text><rect x="435" y="260" width="480" height="130" rx="15" fill="white"/><text x="460" y="301" font-size="22">掲載された休館日</text><text x="460" y="338" font-size="23">11/3・11/23、12/29～1/3</text><text x="460" y="373" font-size="23">1/11（1月は2027年）</text><text x="50" y="448" font-size="26" font-weight="bold">今日の一歩：候補日の開館を市公式で確認</text><text x="50" y="488" font-size="19">展示詳細ページ1013907を2026年11月6日確認</text><text x="50" y="519" font-size="18">予定・開館状況は変更される場合があります。</text></g></svg>