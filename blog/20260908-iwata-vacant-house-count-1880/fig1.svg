<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="磐田市の2018年住宅・土地統計調査。空き家全区分8,500戸のうちその他住宅は2,060戸で、そのうち戸建て住宅1,880戸が計画の目標指標であることを三段階で示す" data-illustration="iwata-editorial" data-variant="1">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7fb"/><stop offset="1" stop-color="#f8f3e7"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16435a" flood-opacity=".14"/></filter>
    <style>.title{font:700 35px system-ui,sans-serif;fill:#123b53}.sub{font:500 20px system-ui,sans-serif;fill:#486878}.label{font:700 23px system-ui,sans-serif;fill:#123b53}.num{font:800 50px system-ui,sans-serif;fill:#006a9e}.note{font:500 18px system-ui,sans-serif;fill:#486878}.arrow{stroke:#5d8294;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="60" y="72" class="title">1,880戸は「磐田市の全空き家数」ではない</text>
  <text x="60" y="108" class="sub">磐田市空家等対策計画・2018年住宅・土地統計調査の区分</text>
  <g filter="url(#shadow)">
    <rect x="60" y="170" width="310" height="350" rx="24" fill="#fff" stroke="#b8d7e5" stroke-width="3"/>
    <rect x="445" y="205" width="310" height="280" rx="24" fill="#fff" stroke="#86bd95" stroke-width="3"/>
    <rect x="830" y="240" width="310" height="210" rx="24" fill="#fff" stroke="#e1ad62" stroke-width="3"/>
  </g>
  <text x="215" y="235" text-anchor="middle" class="label">空き家・全区分</text>
  <text x="215" y="315" text-anchor="middle" class="num">8,500戸</text>
  <text x="215" y="366" text-anchor="middle" class="note">賃貸用・売却用・</text>
  <text x="215" y="398" text-anchor="middle" class="note">二次的住宅等を含む</text>
  <text x="600" y="270" text-anchor="middle" class="label">その他住宅</text>
  <text x="600" y="350" text-anchor="middle" class="num">2,060戸</text>
  <text x="600" y="401" text-anchor="middle" class="note">三つの用途区分以外</text>
  <text x="985" y="305" text-anchor="middle" class="label">戸建て・その他住宅</text>
  <text x="985" y="385" text-anchor="middle" class="num">1,880戸</text>
  <path d="M382 340h45m-15-15 15 15-15 15" class="arrow"/>
  <path d="M767 340h45m-15-15 15 15-15 15" class="arrow"/>
  <rect x="60" y="565" width="1080" height="62" rx="16" fill="#123b53"/>
  <text x="600" y="605" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#fff">計画の2026年度目標が数えるのは、右端の限定された区分</text>
</svg>
