<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" data-illustration="iwata-editorial" role="img" aria-labelledby="t d"><title id="t">休日の点検は、この順番で</title><desc id="d">確認できた場所と日付を記録。届かなければ無理をしない。</desc><rect width="960" height="600" rx="28" fill="#edf5f7"/><g font-family="Meiryo, sans-serif" fill="#173e50"><text x="48" y="66" font-size="20" fill="#38758b">磐田ライフハック ｜ 住まいの作動確認</text><text x="48" y="123" font-size="34" font-weight="bold">休日の点検は、この順番で</text><rect x="42" y="175" width="280" height="294" rx="18" fill="white"/><circle cx="182" cy="237" r="34" fill="#0074ae"/><text x="182" y="247" text-anchor="middle" font-size="27" fill="white">01</text><text x="182" y="320" text-anchor="middle" font-size="26" font-weight="bold">説明書を確認</text><text x="182" y="375" text-anchor="middle" font-size="23">自宅の型番に合う</text><text x="182" y="413" text-anchor="middle" font-size="23">操作方法を読む</text><rect x="347" y="175" width="280" height="294" rx="18" fill="white"/><circle cx="487" cy="237" r="34" fill="#0074ae"/><text x="487" y="247" text-anchor="middle" font-size="27" fill="white">02</text><text x="487" y="320" text-anchor="middle" font-size="26" font-weight="bold">安全に操作</text><text x="487" y="375" text-anchor="middle" font-size="23">ボタンかひもで</text><text x="487" y="413" text-anchor="middle" font-size="23">作動を確かめる</text><rect x="652" y="175" width="280" height="294" rx="18" fill="white"/><circle cx="792" cy="237" r="34" fill="#0074ae"/><text x="792" y="247" text-anchor="middle" font-size="27" fill="white">03</text><text x="792" y="320" text-anchor="middle" font-size="26" font-weight="bold">反応を照合</text><text x="792" y="375" text-anchor="middle" font-size="23">正常な音・表示か</text><text x="792" y="413" text-anchor="middle" font-size="23">説明書と比べる</text><text x="48" y="527" font-size="23">確認できた場所と日付を記録。届かなければ無理をしない。</text><text x="48" y="566" font-size="18" fill="#526a76">磐田市の案内を基に作成。個々の製品の取扱説明書に従ってください。</text></g></svg>