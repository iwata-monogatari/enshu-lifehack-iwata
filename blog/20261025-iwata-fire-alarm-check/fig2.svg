<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" data-illustration="iwata-editorial" role="img" aria-labelledby="t d"><title id="t">点検の結果で、次の行動を分ける</title><desc id="d">反応なし＝電池切れ、と決めつけない。本体も劣化します。</desc><rect width="960" height="600" rx="28" fill="#edf5f7"/><g font-family="Meiryo, sans-serif" fill="#173e50"><text x="48" y="66" font-size="20" fill="#38758b">磐田ライフハック ｜ 住まいの作動確認</text><text x="48" y="123" font-size="34" font-weight="bold">点検の結果で、次の行動を分ける</text><rect x="42" y="175" width="280" height="294" rx="18" fill="white"/><circle cx="182" cy="237" r="34" fill="#0074ae"/><text x="182" y="247" text-anchor="middle" font-size="27" fill="white">A</text><text x="182" y="320" text-anchor="middle" font-size="26" font-weight="bold">正常な反応</text><text x="182" y="375" text-anchor="middle" font-size="23">場所・日付を記録</text><text x="182" y="413" text-anchor="middle" font-size="23">家族へ共有する</text><rect x="347" y="175" width="280" height="294" rx="18" fill="white"/><circle cx="487" cy="237" r="34" fill="#0074ae"/><text x="487" y="247" text-anchor="middle" font-size="27" fill="white">B</text><text x="487" y="320" text-anchor="middle" font-size="26" font-weight="bold">反応がない</text><text x="487" y="375" text-anchor="middle" font-size="23">説明書・型番を確認</text><text x="487" y="413" text-anchor="middle" font-size="23">メーカー等へ相談</text><rect x="652" y="175" width="280" height="294" rx="18" fill="white"/><circle cx="792" cy="237" r="34" fill="#0074ae"/><text x="792" y="247" text-anchor="middle" font-size="27" fill="white">C</text><text x="792" y="320" text-anchor="middle" font-size="26" font-weight="bold">安全に届かない</text><text x="792" y="375" text-anchor="middle" font-size="23">操作をやめる</text><text x="792" y="413" text-anchor="middle" font-size="23">家族・管理会社へ</text><text x="48" y="527" font-size="23">反応なし＝電池切れ、と決めつけない。本体も劣化します。</text><text x="48" y="566" font-size="18" fill="#526a76">磐田市の案内を基に作成。個々の製品の取扱説明書に従ってください。</text></g></svg>