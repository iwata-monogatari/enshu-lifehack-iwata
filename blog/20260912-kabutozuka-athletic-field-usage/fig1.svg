<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" data-illustration="iwata-editorial">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="60" y="50" width="1080" height="80" rx="12" fill="#2f6ea8"/>
  <text x="600" y="102" fill="#ffffff" font-size="32" font-weight="bold" text-anchor="middle" font-family="sans-serif">かぶと塚公園陸上競技場の個人利用料金と利用区分</text>
  
  <rect x="80" y="180" width="480" height="260" rx="16" fill="#ffffff" stroke="#2f6ea8" stroke-width="4"/>
  <text x="320" y="240" fill="#2f6ea8" font-size="28" font-weight="bold" text-anchor="middle" font-family="sans-serif">一般・大学生</text>
  <text x="320" y="330" fill="#1e293b" font-size="64" font-weight="bold" text-anchor="middle" font-family="sans-serif">200円</text>
  <text x="320" y="390" fill="#64748b" font-size="20" text-anchor="middle" font-family="sans-serif">1回・専用利用のない時間帯</text>
  
  <rect x="640" y="180" width="480" height="260" rx="16" fill="#ffffff" stroke="#2f6ea8" stroke-width="4"/>
  <text x="880" y="240" fill="#2f6ea8" font-size="28" font-weight="bold" text-anchor="middle" font-family="sans-serif">高校生以下（小・中・高）</text>
  <text x="880" y="330" fill="#1e293b" font-size="64" font-weight="bold" text-anchor="middle" font-family="sans-serif">100円</text>
  <text x="880" y="390" fill="#64748b" font-size="20" text-anchor="middle" font-family="sans-serif">1回・管理事務所で利用券購入</text>
  
  <rect x="80" y="480" width="1040" height="130" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="600" y="530" fill="#1e3a8a" font-size="22" font-weight="bold" text-anchor="middle" font-family="sans-serif">夜間照明利用時の追加料金（照明点灯時間帯）</text>
  <text x="600" y="575" fill="#334155" font-size="20" text-anchor="middle" font-family="sans-serif">個人利用料に加え、点灯区分に応じた照明料が加算されます。点灯時間は季節により変動します。</text>
</svg>