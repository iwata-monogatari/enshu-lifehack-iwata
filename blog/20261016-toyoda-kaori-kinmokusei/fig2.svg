<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">花を見に行くための三つの情報</title><desc id="desc">広報で見頃の目安、施設ガイドで所在地と設備を知り、訪問日の咲き具合は別に確認する。</desc><rect width="960" height="560" rx="24" fill="#faf6eb"/><g font-family="sans-serif" fill="#243c31"><text x="48" y="65" font-size="32" font-weight="bold">知りたいことと、確認先を分ける</text><rect x="48" y="105" width="864" height="95" rx="16" fill="#f6dfad"/><text x="75" y="145" font-size="26" font-weight="bold">1　市広報：見頃の目安</text><text x="112" y="180" font-size="22">2024年9月号の季節案内</text><rect x="48" y="220" width="864" height="95" rx="16" fill="#dce9df"/><text x="75" y="260" font-size="26" font-weight="bold">2　施設ガイド：所在地・設備・問い合わせ先</text><text x="112" y="295" font-size="22">公園へ行ける条件を考える資料</text><rect x="48" y="335" width="864" height="95" rx="16" fill="#e2e8f0"/><text x="75" y="375" font-size="26" font-weight="bold">3　訪問日の状況：咲き具合と確認日</text><text x="112" y="410" font-size="22">分からなければ「未確認」のまま家族と相談</text><text x="70" y="490" font-size="25" font-weight="bold">今日の一歩：市公式の確認先を保存する</text><text x="70" y="525" font-size="20">情報の役割を示す図です。公園の配置図ではありません。</text></g></svg>