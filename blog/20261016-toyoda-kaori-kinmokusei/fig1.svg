<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">見頃の目安と当日の開花は別の情報</title><desc id="desc">2024年市広報の見頃は9月下旬から10月中旬。2026年10月16日の開花を示すものではない。</desc><rect width="960" height="520" rx="24" fill="#faf6eb"/><g font-family="sans-serif" fill="#243c31"><text x="48" y="65" font-size="32" font-weight="bold">キンモクセイの見頃を読む</text><text x="48" y="108" font-size="22">出典：広報いわた 2024年9月号31頁</text><path d="M70 230H890" stroke="#c6cbbb" stroke-width="5"/><rect x="90" y="175" width="600" height="100" rx="18" fill="#f1c268"/><text x="120" y="235" font-size="31" font-weight="bold">9月下旬 ～ 10月中旬</text><text x="718" y="235" font-size="25">10月下旬</text><text x="105" y="315" font-size="23">広報に掲載された季節の目安</text><rect x="48" y="355" width="864" height="120" rx="16" fill="#e4ece3"/><text x="75" y="400" font-size="26" font-weight="bold">2026年10月16日の咲き具合は未確認</text><text x="75" y="440" font-size="22">季節の帯は、開花予測や現地の観測記録ではありません。</text></g></svg>