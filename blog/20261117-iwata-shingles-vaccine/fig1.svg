<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">帯状疱疹予防接種の対象と自己負担</title><rect width="440" height="600" fill="#edf4f7"/><g font-family="Meiryo,sans-serif" fill="#07384d"><text x="24" y="58" font-size="27" font-weight="bold">対象と自己負担（令和8年度）</text><rect x="20" y="86" width="400" height="118" rx="16" fill="white" stroke="#0d5c7a"/><text x="36" y="124" font-size="25" font-weight="bold">対象 65歳になる方</text><text x="36" y="168" font-size="23">昭和36年4月2日〜37年4月1日生</text><rect x="20" y="224" width="400" height="118" rx="16" fill="white" stroke="#0d5c7a"/><text x="36" y="262" font-size="25" font-weight="bold">対象 70〜100歳の5歳刻み</text><text x="36" y="306" font-size="23">令和11年度までの経過措置</text><rect x="20" y="362" width="400" height="100" rx="16" fill="white" stroke="#0d5c7a"/><text x="36" y="400" font-size="25" font-weight="bold">生 4,500円（1回）</text><text x="36" y="440" font-size="23">不活化 1回16,500円（2回）</text><rect x="20" y="482" width="400" height="88" rx="16" fill="#fdf0e7" stroke="#c2501e"/><text x="36" y="520" font-size="23" font-weight="bold" fill="#8a3a14">期間 2026年4月1日〜2027年3月31日</text><text x="36" y="552" font-size="21" fill="#8a3a14">予診票・クーポン券は郵送済み</text></g></svg>
