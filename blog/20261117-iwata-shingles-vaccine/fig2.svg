<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">帯状疱疹予防接種を受ける前に確かめる3点</title><rect width="440" height="560" fill="#edf4f7"/><g font-family="Meiryo,sans-serif" fill="#07384d"><text x="24" y="58" font-size="27" font-weight="bold">受ける前に確かめる3点</text><rect x="20" y="86" width="400" height="118" rx="16" fill="white" stroke="#0d5c7a"/><text x="36" y="124" font-size="25" font-weight="bold">1. 案内の封筒があるか</text><text x="36" y="168" font-size="23">予診票・クーポン券は4月に郵送</text><rect x="20" y="224" width="400" height="118" rx="16" fill="white" stroke="#0d5c7a"/><text x="36" y="262" font-size="25" font-weight="bold">2. ワクチンの種類の相談</text><text x="36" y="306" font-size="23">生か不活化かを医師と決める</text><rect x="20" y="362" width="400" height="118" rx="16" fill="white" stroke="#0d5c7a"/><text x="36" y="400" font-size="25" font-weight="bold">3. 2回目からの逆算</text><text x="36" y="444" font-size="23">不活化の1回目は1月末が目安</text><rect x="20" y="500" width="400" height="40" rx="12" fill="#e2eff5"/><text x="220" y="528" font-size="20" text-anchor="middle">無料券は接種前に提示する</text></g></svg>
