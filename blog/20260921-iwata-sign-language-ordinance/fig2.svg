<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">本人に伝達方法を確かめてから接客する</title><desc id="desc">接客の提案。希望を確認し、本人に合う方法を用意し、金額と次の行動を確認する。</desc><rect width="960" height="540" rx="24" fill="#edf6fc"/><g font-family="Meiryo,sans-serif" fill="#163c55"><text x="48" y="64" font-size="30" font-weight="bold">伝える方法は、本人に確かめる</text>
<text x="48" y="100" font-size="19">店や窓口でのやり取りの提案</text>
<rect x="48" y="136" width="864" height="198" rx="18" fill="white"/>
<circle cx="146" cy="197" r="30" fill="#efbc8b"/><path d="M98 282v-27q0-35 48-35t48 35v27" fill="#087bb5"/>
<circle cx="810" cy="197" r="30" fill="#efbc8b"/><path d="M762 282v-27q0-35 48-35t48 35v27" fill="#398278"/>
<rect x="223" y="157" width="507" height="121" rx="18" fill="#e6f2f8"/>
<text x="249" y="195" font-size="24">どの方法だと</text><text x="249" y="234" font-size="24">お話ししやすいですか？</text>
<path d="M242 278l-19 18 50-18" fill="#e6f2f8"/>
<text x="109" y="316" font-size="18">店・窓口</text><text x="789" y="316" font-size="18">本人</text>
<rect x="48" y="362" width="266" height="118" rx="14" fill="#d4e9f6"/><rect x="347" y="362" width="266" height="118" rx="14" fill="#d4e9f6"/><rect x="646" y="362" width="266" height="118" rx="14" fill="#d4e9f6"/>
<text x="68" y="399" font-size="22" font-weight="bold">1　希望を確かめる</text><text x="68" y="438" font-size="19">使う方法を決めつけない</text>
<text x="367" y="399" font-size="22" font-weight="bold">2　合う方法を用意</text><text x="367" y="438" font-size="19">紙・画面・実物など</text>
<text x="666" y="399" font-size="22" font-weight="bold">3　内容を確認する</text><text x="666" y="438" font-size="19">金額・次の行動も共有</text>
<path d="M320 420h18m-7-7 7 7-7 7M619 420h18m-7-7 7 7-7 7" fill="none" stroke="#087bb5" stroke-width="3"/>
<text x="48" y="516" font-size="17">※本人の希望に合わせるための例です。一律の対応手順ではありません。</text></g></svg>