<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">2026年9月の青色点灯カレンダー</title><desc id="desc">駅前は9月18日から25日、かたりあは22日から29日。9月23日は手話言語の国際デー。</desc><rect width="960" height="460" rx="24" fill="#edf6fc"/><g font-family="Meiryo,sans-serif" fill="#163c55"><text x="40" y="56" font-size="29" font-weight="bold">青色点灯は、会場で期間が違う</text><text x="40" y="95" font-size="20">2026年9月｜磐田市の公式案内に基づく期間</text><rect x="294" y="131" width="49" height="224" rx="5" fill="#fff"/><text x="304" y="165" font-size="19">18</text><rect x="345" y="131" width="49" height="224" rx="5" fill="#fff"/><text x="355" y="165" font-size="19">19</text><rect x="396" y="131" width="49" height="224" rx="5" fill="#fff"/><text x="406" y="165" font-size="19">20</text><rect x="447" y="131" width="49" height="224" rx="5" fill="#fff"/><text x="457" y="165" font-size="19">21</text><rect x="498" y="131" width="49" height="224" rx="5" fill="#fff"/><text x="508" y="165" font-size="19">22</text><rect x="549" y="131" width="49" height="224" rx="5" fill="#d6e6ff"/><text x="559" y="165" font-size="19">23</text><rect x="600" y="131" width="49" height="224" rx="5" fill="#fff"/><text x="610" y="165" font-size="19">24</text><rect x="651" y="131" width="49" height="224" rx="5" fill="#fff"/><text x="661" y="165" font-size="19">25</text><rect x="702" y="131" width="49" height="224" rx="5" fill="#fff"/><text x="712" y="165" font-size="19">26</text><rect x="753" y="131" width="49" height="224" rx="5" fill="#fff"/><text x="763" y="165" font-size="19">27</text><rect x="804" y="131" width="49" height="224" rx="5" fill="#fff"/><text x="814" y="165" font-size="19">28</text><rect x="855" y="131" width="49" height="224" rx="5" fill="#fff"/><text x="865" y="165" font-size="19">29</text><text x="40" y="216" font-size="20" font-weight="bold">駅前</text><text x="40" y="245" font-size="17">七重の塔・しっぺいの銅像</text><text x="40" y="309" font-size="20" font-weight="bold">かたりあ</text><rect x="294" y="192" width="406" height="54" rx="9" fill="#176bc2"/><text x="361" y="226" font-size="22" fill="white">9月18日 ～ 25日</text><rect x="498" y="279" width="406" height="54" rx="9" fill="#176bc2"/><text x="566" y="313" font-size="22" fill="white">9月22日 ～ 29日</text><text x="40" y="396" font-size="20">9月23日：手話言語の国際デー</text><text x="40" y="431" font-size="17">点灯時刻は案内本文に記載なし。外出前に市公式ページで最新情報を確認。</text></g></svg>