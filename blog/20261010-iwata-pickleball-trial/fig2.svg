<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">持ち物と家族の一日の段取り</title><desc id="desc">屋内シューズ、水筒、タオル。行きと帰りを体験の前後に加える。</desc><rect width="960" height="540" rx="24" fill="#f6f2e8"/><g font-family="Meiryo, sans-serif" fill="#23483f"><text x="48" y="62" font-size="31" font-weight="bold">体験の二時間に、家族の時間を足す</text><text x="48" y="100" font-size="20">持ち物と往復を考えるための図（公式の集合時刻ではありません）</text>
