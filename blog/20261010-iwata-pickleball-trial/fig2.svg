<g transform="translate(686 144)"><rect x="0" y="0" width="135" height="112" rx="8" fill="#e7b8a2" stroke="#a9775e" stroke-width="3"/><path d="M16 16V96M28 16V96M112 16V96" stroke="#fff5e8" stroke-width="4"/><text x="67" y="151" text-anchor="middle" font-size="23">タオル</text></g>
<rect x="48" y="332" width="230" height="107" rx="16" fill="#e2e7da"/><rect x="298" y="332" width="364" height="107" rx="16" fill="#376951"/><rect x="682" y="332" width="230" height="107" rx="16" fill="#e2e7da"/>
<text x="163" y="375" text-anchor="middle" font-size="24">準備・行き</text><text x="163" y="409" text-anchor="middle" font-size="18">家庭ごとに時間が違う</text><text x="480" y="375" text-anchor="middle" font-size="26" fill="white">体験 9:30～11:30</text><text x="480" y="409" text-anchor="middle" font-size="19" fill="white">運動できる服装で</text><text x="797" y="375" text-anchor="middle" font-size="24">帰り・昼食</text><text x="797" y="409" text-anchor="middle" font-size="18">片付けと休息も予定に</text>
