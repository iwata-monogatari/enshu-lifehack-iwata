<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" data-illustration="iwata-editorial">
<rect width="760" height="520" fill="#fdf6ec"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">温存後生殖補助医療の助成上限額</text>
<rect x="40" y="84" width="680" height="76" rx="14" fill="#ffffff"/><text x="64" y="118" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">凍結した胚を用いた治療</text><text x="696" y="118" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">10万円</text>
<rect x="40" y="176" width="680" height="76" rx="14" fill="#ffffff"/><text x="64" y="210" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">凍結した未受精卵子を用いた治療</text><text x="696" y="210" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">25万円</text>
<rect x="40" y="268" width="680" height="76" rx="14" fill="#ffffff"/><text x="64" y="302" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">卵巣組織再移植後／凍結精子を用いた治療</text><text x="696" y="302" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">30万円</text>
<rect x="40" y="360" width="680" height="76" rx="14" fill="#ffffff"/><text x="64" y="394" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">助成回数（初回時の女性の年齢で判定）</text><text x="696" y="394" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">40歳未満6回／40歳以上3回</text>
<text x="40" y="486" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：磐田市「若年がん患者等妊孕性温存治療費等助成事業」案内（温存後生殖補助医療）</text>
</svg>