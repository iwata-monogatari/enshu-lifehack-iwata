<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">妊孕性温存治療の助成上限額（磐田市）</text>
<rect x="40" y="84" width="680" height="76" rx="14" fill="#ffffff"/><text x="64" y="118" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">胚（受精卵）凍結保存</text><text x="696" y="118" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">40万円</text><text x="64" y="146" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">県事業併用時は5万円</text>
<rect x="40" y="176" width="680" height="76" rx="14" fill="#ffffff"/><text x="64" y="210" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">未受精卵子凍結保存</text><text x="696" y="210" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">40万円</text><text x="64" y="238" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">県事業併用時は20万円</text>
<rect x="40" y="268" width="680" height="76" rx="14" fill="#ffffff"/><text x="64" y="302" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">卵巣組織凍結保存（再移植を含む）</text><text x="696" y="302" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">40万円</text>
<rect x="40" y="360" width="680" height="76" rx="14" fill="#ffffff"/><text x="64" y="394" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">精子凍結保存／精巣内精子採取術</text><text x="696" y="394" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">2.5万円／35万円</text>
<text x="40" y="486" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：磐田市「若年がん患者等妊孕性温存治療費等助成事業」案内（2025年9月版）</text>
