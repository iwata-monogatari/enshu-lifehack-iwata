<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" data-illustration="iwata-editorial">
<rect width="760" height="560" fill="#edf5fa"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">事前申請と事後申請の進め方（磐田市）</text>
<rect x="40" y="84" width="680" height="56" rx="12" fill="#ffffff"/><text x="64" y="108" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#2f6f9f">事前 1. 交付申請</text><text x="64" y="130" font-family="Meiryo, sans-serif" font-size="15" fill="#555555">交付申請書・事業計画書（様式第2号）・見積書の写しなどを提出</text>
<rect x="40" y="150" width="680" height="56" rx="12" fill="#ffffff"/><text x="64" y="174" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#2f6f9f">事前 2. 交付決定通知を受けてから発注</text><text x="64" y="196" font-family="Meiryo, sans-serif" font-size="15" fill="#555555">発注・工事・支払いは令和9年2月28日までに完了する</text>
<rect x="40" y="216" width="680" height="56" rx="12" fill="#ffffff"/><text x="64" y="240" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#2f6f9f">事前 3. 完了報告</text><text x="64" y="262" font-family="Meiryo, sans-serif" font-size="15" fill="#555555">完了後7日以内または令和9年3月5日のいずれか早い日まで</text>
<rect x="40" y="282" width="680" height="56" rx="12" fill="#ffffff"/><text x="64" y="306" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#2f6f9f">事後 令和8年4月1日〜10月29日に完了・支払済み</text><text x="64" y="328" font-family="Meiryo, sans-serif" font-size="15" fill="#555555">交付申請書に事業実績報告書と領収書の写しなどを添えて1回で提出</text>
<rect x="40" y="348" width="680" height="56" rx="12" fill="#ffffff"/><text x="64" y="372" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#2f6f9f">共通 地域防災に関する届け出</text><text x="64" y="394" font-family="Meiryo, sans-serif" font-size="15" fill="#555555">空調はクーリングシェルター応募、井戸は災害時協力井戸の登録、その他は承諾書</text>
<rect x="40" y="414" width="680" height="56" rx="12" fill="#ffffff"/><text x="64" y="438" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#2f6f9f">共通 申請の最終期限</text><text x="64" y="460" font-family="Meiryo, sans-serif" font-size="15" fill="#555555">令和9年2月28日まで。予算がなくなり次第終了</text>
<rect x="40" y="480" width="680" height="56" rx="12" fill="#ffffff"/><text x="64" y="504" font-family="Meiryo, sans-serif" font-size="19" font-weight="bold" fill="#2f6f9f">補助金の支払い</text><text x="64" y="526" font-family="Meiryo, sans-serif" font-size="15" fill="#555555">交付確定日（事後申請は交付決定日）から概ね1か月後</text>
<text x="40" y="548" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：磐田市「令和8年度 磐田市中小企業ライフライン強靭化支援補助金交付要領」</text>
</svg>
