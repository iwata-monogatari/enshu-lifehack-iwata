<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" data-illustration="iwata-editorial">
<rect width="760" height="560" fill="#edf5fa"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">対象事業の3区分と交付額（磐田市・令和8年度）</text>
<rect x="40" y="84" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="122" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">区分ア 省エネ設備への更新</text><text x="696" y="122" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">更新のみ対象</text><text x="64" y="152" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">業務用エアコン・給湯器・ボイラ・高効率コージェネレーションなど</text>
<rect x="40" y="192" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="230" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">区分イ 再エネ設備・蓄電池</text><text x="696" y="230" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">自家消費型</text><text x="64" y="260" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">太陽光発電・産業用蓄電池・EV外部給電設備。売電目的は対象外</text>
<rect x="40" y="300" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="338" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">区分ウ 水資源の設備</text><text x="696" y="338" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">確保・有効活用</text><text x="64" y="368" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">井戸・ポンプ・ろ過設備・受水槽・貯水槽・雨水再利用設備など</text>
<rect x="40" y="408" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="446" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">交付額</text><text x="696" y="446" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">2分の1以内・上限200万円</text><text x="64" y="476" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">1,000円未満切捨て・税抜き計算。申請は1事業者1回限り</text>
<text x="40" y="536" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：磐田市「令和8年度 磐田市中小企業ライフライン強靭化支援補助金交付要領」</text>
</svg>
