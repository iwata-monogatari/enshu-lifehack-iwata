<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" data-illustration="iwata-editorial" role="img" aria-labelledby="caption"><title id="caption">電話で伝える言葉の例</title><rect width="760" height="440" rx="20" fill="#f6f4ec"/><g font-family="Meiryo, sans-serif" fill="#193e3a"><text x="38" y="60" font-size="36" font-weight="bold">電話で伝える言葉の例</text><rect x="30" y="88" width="700" height="146" rx="18" fill="#fff2df"/><text x="54" y="133" font-size="28">自分で聞いたこと</text><text x="54" y="194" font-size="32" font-weight="bold">「助けて」という声</text><text x="387" y="192" font-size="20">帰り道、建物の外で聞きました</text><rect x="30" y="251" width="700" height="146" rx="18" fill="#dcf1e9"/><text x="54" y="296" font-size="28">自分には分からないこと</text><text x="54" y="357" font-size="32" font-weight="bold">中の様子は見えない</text><text x="387" y="355" font-size="20">誰がいたかは分かりません</text></g></svg>