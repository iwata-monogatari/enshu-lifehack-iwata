<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial"><title id="title">式典の情報と家族の予定を分ける</title><desc id="desc">磐田市の2027年二十歳の集いの案内を整理した記事固有の図</desc><rect width="960" height="600" rx="24" fill="#eff6f8"/><g font-family="Meiryo, sans-serif"><text x="48" y="65" font-size="32" font-weight="bold" fill="#123a52">式典の情報と家族の予定を分ける</text><rect x="40" y="100" width="880" height="112" rx="16" fill="white"/><circle cx="82" cy="155" r="24" fill="#0074ae"/><text x="82" y="164" text-anchor="middle" fill="white" font-size="26">1</text><text x="125" y="137" font-size="23" fill="#476374">市が公表する式典</text><text x="125" y="181" font-size="29" fill="#123a52" font-weight="bold">2027年1月10日　11時～正午</text><rect x="40" y="235" width="880" height="112" rx="16" fill="white"/><circle cx="82" cy="290" r="24" fill="#0074ae"/><text x="82" y="299" text-anchor="middle" fill="white" font-size="26">2</text><text x="125" y="272" font-size="23" fill="#476374">本人・家族が相談する予定</text><text x="125" y="316" font-size="29" fill="#123a52" font-weight="bold">帰省・送迎・前後の予定は別の欄へ</text><rect x="40" y="370" width="880" height="112" rx="16" fill="white"/><circle cx="82" cy="425" r="24" fill="#0074ae"/><text x="82" y="434" text-anchor="middle" fill="white" font-size="26">3</text><text x="125" y="407" font-size="23" fill="#476374">今日できる一歩</text><text x="125" y="451" font-size="29" fill="#123a52" font-weight="bold">本人が市公式ページを一度開く</text><text x="48" y="548" font-size="23" fill="#123a52">対象：2006年4月2日～2007年4月1日生まれ</text><text x="48" y="580" font-size="16" fill="#476374">出典：磐田市公式「令和9年磐田市『二十歳の集い』」／2026年10月19日確認</text></g></svg>