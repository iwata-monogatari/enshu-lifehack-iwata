<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
  <title id="title">中原B古墳群展へ出発する前の三段階</title><desc id="desc">日付、交通、会場の順で確認する流れ。会期、休館日、車とバス、住所と時間を三つのカードに分けて示す。</desc>
  <rect width="1200" height="675" rx="32" fill="#f5f1e8"/><path d="M0 555 C180 500 310 610 490 560 S825 500 1200 570 V675 H0Z" fill="#dfe9df"/>
  <text x="600" y="82" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="700" fill="#263c35">出発前は、この順で確認</text>
  <g transform="translate(55 145)"><rect width="310" height="325" rx="24" fill="#fff" stroke="#75977f" stroke-width="4"/><circle cx="55" cy="56" r="31" fill="#285b48"/><text x="55" y="68" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#fff">1</text><text x="105" y="67" font-family="sans-serif" font-size="35" font-weight="700" fill="#263c35">日付</text><text x="155" y="145" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#9b4b32">8月1日〜10月25日</text><line x1="42" y1="181" x2="268" y2="181" stroke="#d8c8b8" stroke-width="3"/><text x="155" y="233" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#364c45">祝日・振替休日</text><text x="155" y="276" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#364c45">休館</text></g>
  <path d="M386 300 H427 M412 282 L432 300 L412 318" fill="none" stroke="#285b48" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(445 145)"><rect width="310" height="325" rx="24" fill="#fff" stroke="#75977f" stroke-width="4"/><circle cx="55" cy="56" r="31" fill="#285b48"/><text x="55" y="68" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#fff">2</text><text x="105" y="67" font-family="sans-serif" font-size="35" font-weight="700" fill="#263c35">交通</text><rect x="36" y="114" width="238" height="66" rx="15" fill="#e8f1eb"/><text x="155" y="156" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#263c35">車：駐車10台</text><rect x="36" y="204" width="238" height="82" rx="15" fill="#e8f1eb"/><text x="155" y="238" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#263c35">バス：図書館前</text><text x="155" y="272" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#263c35">下車徒歩1分</text></g>
  <path d="M776 300 H817 M802 282 L822 300 L802 318" fill="none" stroke="#285b48" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(835 145)"><rect width="310" height="325" rx="24" fill="#fff" stroke="#75977f" stroke-width="4"/><circle cx="55" cy="56" r="31" fill="#285b48"/><text x="55" y="68" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#fff">3</text><text x="105" y="67" font-family="sans-serif" font-size="35" font-weight="700" fill="#263c35">会場</text><text x="155" y="138" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#263c35">埋蔵文化財センター</text><text x="155" y="190" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263c35">見付3678-1</text><line x1="42" y1="218" x2="268" y2="218" stroke="#d8c8b8" stroke-width="3"/><text x="155" y="270" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#9b4b32">8:30〜17:00</text></g>
  <rect x="325" y="520" width="550" height="92" rx="46" fill="#285b48"/><text x="600" y="580" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#fff">無料・申込不要</text>
