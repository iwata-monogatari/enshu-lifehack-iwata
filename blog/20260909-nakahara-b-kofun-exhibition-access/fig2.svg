<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
  <title id="title">中原B古墳群展へ向かうバスと車の二つの経路</title><desc id="desc">左側に磐田駅二番乗り場から二俣山東行きバスで図書館前へ行き徒歩一分の経路、右側に車で図書館東側十台の駐車場へ行く経路を示す概念図。</desc>
  <rect width="1200" height="675" rx="32" fill="#eef4f0"/><text x="600" y="72" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="700" fill="#263c35">会場までの二つの行き方</text>
  <g transform="translate(55 115)"><rect width="520" height="460" rx="28" fill="#fff" stroke="#587f9a" stroke-width="4"/><rect width="520" height="82" rx="28" fill="#2f6688"/><rect y="54" width="520" height="28" fill="#2f6688"/><text x="260" y="54" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#fff">バスで行く</text><rect x="48" y="120" width="180" height="80" rx="16" fill="#e7f1f7"/><text x="138" y="153" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#263c35">JR磐田駅</text><text x="138" y="184" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#263c35">2番乗り場</text><path d="M240 160 H300 M282 143 L303 160 L282 177" fill="none" stroke="#2f6688" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="313" y="120" width="160" height="80" rx="16" fill="#e7f1f7"/><text x="393" y="153" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#263c35">二俣山東行き</text><text x="393" y="184" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#263c35">遠鉄バス</text><path d="M393 215 V266 M376 248 L393 269 L410 248" fill="none" stroke="#2f6688" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="282" width="240" height="73" rx="16" fill="#e7f1f7"/><text x="260" y="327" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#263c35">図書館前で下車</text><text x="260" y="402" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#9b4b32">会場まで徒歩1分</text></g>
  <g transform="translate(625 115)"><rect width="520" height="460" rx="28" fill="#fff" stroke="#8b7259" stroke-width="4"/><rect width="520" height="82" rx="28" fill="#72553d"/><rect y="54" width="520" height="28" fill="#72553d"/><text x="260" y="54" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#fff">車で行く</text><rect x="110" y="122" width="300" height="74" rx="16" fill="#f3ece5"/><text x="260" y="168" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#263c35">目的地：見付3678-1</text><path d="M260 216 V268 M243 250 L260 271 L277 250" fill="none" stroke="#72553d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="284" width="320" height="90" rx="16" fill="#f3ece5"/><text x="260" y="322" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#263c35">磐田市立図書館 東側</text><text x="260" y="356" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#263c35">駐車場 10台</text><text x="260" y="404" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9b4b32">満車時の代替駐車場は</text><text x="260" y="432" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9b4b32">確認した公式3ページに案内なし</text></g>
  <rect x="340" y="603" width="520" height="48" rx="24" fill="#285b48"/><text x="600" y="635" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#fff">概念図です。道路形状・縮尺は示していません</text>
</svg>
