<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc">
<title id="title">10月号で11月・12月の学びを探す</title><desc id="desc">2026年10月号は11月と12月の情報を掲載。申込期限は講座ごとの案内で確認します。</desc>
<rect width="960" height="520" rx="24" fill="#f0f6fa"/>
<g font-family="Meiryo, sans-serif" fill="#173e54"><text x="48" y="65" font-size="30" font-weight="bold">学びの庭｜号の月と、参加する月</text><text x="48" y="105" font-size="20">2026年10月号の掲載名から読む</text>
<rect x="55" y="150" width="265" height="230" rx="15" fill="white" stroke="#0074ae" stroke-width="3"/><path d="M78 170v185" stroke="#d2e8f1" stroke-width="8"/><text x="103" y="214" font-size="24">学びの庭</text><text x="103" y="275" font-size="42" font-weight="bold">10月号</text><text x="103" y="330" font-size="20">案内を読む号</text>
<path d="M351 260h80m-20-16 20 16-20 16" fill="none" stroke="#0074ae" stroke-width="7" stroke-linecap="round"/>
<rect x="465" y="167" width="200" height="203" rx="15" fill="white"/><rect x="697" y="167" width="200" height="203" rx="15" fill="white"/><path d="M465 212h200m32 0h200" stroke="#0074ae" stroke-width="4"/><text x="490" y="195" font-size="19">掲載対象</text><text x="722" y="195" font-size="19">掲載対象</text><text x="494" y="287" font-size="44" font-weight="bold">11月</text><text x="726" y="287" font-size="44" font-weight="bold">12月</text><text x="504" y="337" font-size="19">講座情報</text><text x="736" y="337" font-size="19">講座情報</text>
<text x="48" y="452" font-size="24" font-weight="bold">申込期限は別に確認。開催月から推測しない。</text><text x="48" y="490" font-size="17">出典：磐田市「交流センター講座・イベント情報」／2026年10月11日確認</text></g></svg>
