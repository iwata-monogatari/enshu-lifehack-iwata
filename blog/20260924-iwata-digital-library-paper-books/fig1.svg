<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">親子読書の貸出と返却の比較</title><desc id="desc">紙の図書は1人10冊、電子書籍は1人2点。期間はいずれも2週間。</desc><rect width="960" height="540" rx="24" fill="#f0f6fa"/><g font-family="Meiryo, sans-serif" fill="#153c53"><text x="48" y="64" font-size="32" fill="#153c53" font-weight="bold">紙10冊・電子2点。読む期間は同じ</text><rect x="40" y="98" width="425" height="330" rx="20" fill="white"/><rect x="495" y="98" width="425" height="330" rx="20" fill="white"/><text x="68" y="143" font-size="26" fill="#153c53" >紙の図書</text><text x="523" y="143" font-size="26" fill="#153c53" >電子書籍</text><rect x="73" y="184" width="21" height="89" rx="3" fill="#177ba8"/><rect x="100" y="184" width="21" height="89" rx="3" fill="#4b9eab"/><rect x="127" y="184" width="21" height="89" rx="3" fill="#177ba8"/><rect x="154" y="184" width="21" height="89" rx="3" fill="#4b9eab"/><rect x="181" y="184" width="21" height="89" rx="3" fill="#177ba8"/><rect x="527" y="170" width="111" height="115" rx="10" fill="#153c53"/><rect x="538" y="181" width="89" height="88" rx="3" fill="#d9edf4"/><path d="M551 206h62M551 220h62M551 234h40" stroke="#177ba8" stroke-width="5"/><text x="240" y="240" font-size="52" fill="#153c53" font-weight="bold">10冊</text><text x="662" y="240" font-size="52" fill="#153c53" font-weight="bold">2点</text><text x="68" y="323" font-size="27" fill="#153c53" >1人あたり／2週間</text><text x="523" y="323" font-size="27" fill="#153c53" >1人あたり／2週間</text><text x="68" y="374" font-size="25" fill="#153c53" >本を返却先へ持参</text><text x="523" y="374" font-size="25" fill="#153c53" >期限で自動返却</text><text x="48" y="468" font-size="23" fill="#153c53" >電子貸出の対象：磐田市内に在住・在勤・在学の方</text><text x="48" y="507" font-size="18" fill="#153c53" >出典：磐田市立図書館 利用案内・電子書籍ご利用ガイド／2026-09-24確認</text></g></svg>