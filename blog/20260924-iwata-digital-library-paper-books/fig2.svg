<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">親子読書にかかる移動時間の仮定比較</title><desc id="desc">片道15分で2往復なら60分、1往復なら30分。準備済みの電子貸出は来館移動0回。</desc><rect width="960" height="540" rx="24" fill="#f0f6fa"/><g font-family="Meiryo, sans-serif" fill="#153c53"><text x="48" y="62" font-size="32" fill="#153c53" font-weight="bold">片道15分なら、往復に何分使う？</text><text x="48" y="101" font-size="23" fill="#153c53" >仮定の計算です。市平均・実測ではありません。</text><text x="48" y="151" font-size="25" fill="#153c53" >紙：借りる日＋返すだけの日</text><text x="48" y="181" font-size="20" fill="#153c53" >15分 × 2方向 × 2往復</text><rect x="48" y="194" width="480" height="24" rx="8" fill="#177ba8"/><text x="550" y="217" font-size="28" fill="#153c53" font-weight="bold">60分</text><text x="48" y="265" font-size="25" fill="#153c53" >紙：返却と次の貸出を同じ日に</text><text x="48" y="295" font-size="20" fill="#153c53" >15分 × 2方向 × 1往復</text><rect x="48" y="308" width="240" height="24" rx="8" fill="#529c9f"/><text x="310" y="331" font-size="28" fill="#153c53" font-weight="bold">30分</text><text x="48" y="379" font-size="25" fill="#153c53" >電子：貸出・返却のための来館</text><text x="48" y="409" font-size="20" fill="#153c53" >登録・利用条件・端末環境が整った場合</text><text x="70" y="445" font-size="28" fill="#153c53" font-weight="bold">0回</text><text x="48" y="505" font-size="21" fill="#153c53" >館内滞在・外出の支度・画面操作の時間は含みません。</text></g></svg>