<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">スマホ払い後の二重払いを防ぐ三段階の管理図</title><rect width="960" height="560" fill="#f0f6f7"/><g font-family="Meiryo, sans-serif"><text x="44" y="62" font-size="34" fill="#163b50" font-weight="bold">スマホ払い後、紙を未払いに戻さない</text><rect x="40" y="115" width="270" height="295" rx="18" fill="#ffffff"/><circle cx="88" cy="163" r="24" fill="#0074ae"/><text x="80" y="172" font-size="26" fill="#ffffff" font-weight="bold">1</text><text x="65" y="227" font-size="25" fill="#163b50" font-weight="bold">履歴を確かめる</text><text x="65" y="287" font-size="22" fill="#163b50" font-weight="normal">読み取りだけでなく</text><text x="65" y="325" font-size="22" fill="#163b50" font-weight="normal">決済の完了を見る</text><path d="M321 264 h15 l-7 -9 m7 9 l-7 9" stroke="#0074ae" stroke-width="4" fill="none"/><rect x="345" y="115" width="270" height="295" rx="18" fill="#ffffff"/><circle cx="393" cy="163" r="24" fill="#0074ae"/><text x="385" y="172" font-size="26" fill="#ffffff" font-weight="bold">2</text><text x="370" y="227" font-size="25" fill="#163b50" font-weight="bold">紙に済みと記す</text><text x="370" y="287" font-size="22" fill="#163b50" font-weight="normal">納付済み・支払日を</text><text x="370" y="325" font-size="22" fill="#163b50" font-weight="normal">見える場所へ記入</text><path d="M626 264 h15 l-7 -9 m7 9 l-7 9" stroke="#0074ae" stroke-width="4" fill="none"/><rect x="650" y="115" width="270" height="295" rx="18" fill="#ffffff"/><circle cx="698" cy="163" r="24" fill="#0074ae"/><text x="690" y="172" font-size="26" fill="#ffffff" font-weight="bold">3</text><text x="675" y="227" font-size="25" fill="#163b50" font-weight="bold">家族へ伝える</text><text x="675" y="287" font-size="22" fill="#163b50" font-weight="normal">どの請求を払ったか</text><text x="675" y="325" font-size="22" fill="#163b50" font-weight="normal">短い連絡で共有</text><rect x="40" y="442" width="880" height="78" rx="18" fill="#dcefe8"/><text x="66" y="476" font-size="25" fill="#163b50" font-weight="bold">領収書が必要なら、スマホで支払う前に方法を確認。</text><text x="66" y="506" font-size="18" fill="#163b50" font-weight="normal">市の案内をもとにした家庭での管理例／2026年9月27日確認</text></g></svg>