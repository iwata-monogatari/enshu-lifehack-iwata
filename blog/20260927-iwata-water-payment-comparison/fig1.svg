<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">口座振替とスマホ払いの家族向け比較図</title><rect width="960" height="560" fill="#f0f6f7"/><g font-family="Meiryo, sans-serif"><text x="44" y="62" font-size="34" fill="#163b50" font-weight="bold">家族が「支払い済み」とわかるまで</text><rect x="40" y="95" width="430" height="335" rx="18" fill="#ffffff"/><rect x="490" y="95" width="430" height="335" rx="18" fill="#ffffff"/><text x="70" y="146" font-size="31" fill="#0074ae" font-weight="bold">口座振替</text><text x="520" y="146" font-size="31" fill="#0074ae" font-weight="bold">スマホ払い</text><path d="M80 210 L130 180 L180 210 Z M90 216 V266 M130 216 V266 M170 216 V266 M78 275 H183" fill="none" stroke="#0074ae" stroke-width="8"/><rect x="529" y="175" width="70" height="112" rx="10" fill="none" stroke="#0074ae" stroke-width="7"/><path d="M550 230 L563 243 L585 213" fill="none" stroke="#269977" stroke-width="7"/><text x="205" y="220" font-size="25" fill="#163b50" font-weight="normal">毎回の操作を</text><text x="205" y="257" font-size="25" fill="#163b50" font-weight="normal">減らす</text><text x="625" y="220" font-size="25" fill="#163b50" font-weight="normal">納付書ごとに</text><text x="625" y="257" font-size="25" fill="#163b50" font-weight="normal">自分で払う</text><text x="70" y="332" font-size="25" fill="#163b50" font-weight="normal">確認：口座の残高</text><text x="70" y="373" font-size="25" fill="#163b50" font-weight="normal">　　　引き落とし結果</text><text x="520" y="332" font-size="25" fill="#163b50" font-weight="normal">確認：アプリの支払履歴</text><text x="520" y="373" font-size="25" fill="#163b50" font-weight="normal">　　　紙の納付済み表示</text><rect x="40" y="454" width="880" height="68" rx="18" fill="#dcefe8"/><text x="77" y="498" font-size="29" fill="#163b50" font-weight="bold">共通のゴール：家族が聞き直さずに確認できる</text></g></svg>