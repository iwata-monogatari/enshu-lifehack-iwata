<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial"><title id="title">鑑賞日を一つ選ぶカレンダー</title><desc id="desc">10月17〜25日のうち19日と22日を除く7日が候補。展示は10時から、最終日の25日は16時まで。</desc><style>text{font-family:Meiryo,'Noto Sans JP',sans-serif;fill:#163e54}.small{font-size:22px}.label{font-size:26px;font-weight:bold}</style><rect width="960" height="520" rx="24" fill="#f4f8fa"/><text x="42" y="58" font-size="31" font-weight="bold">にこっと・ジュニアアート展　2026年10月</text><text x="42" y="99" class="small">家族で選べる7日間 ／ 19日・22日は休館</text><rect x="42" y="130" width="164" height="124" rx="14" fill="#e3f0f4"/><text x="57" y="170" class="label">17日（土）</text><text x="57" y="207" class="small">鑑賞候補</text><text x="57" y="236" font-size="20">16時30分まで</text><rect x="219" y="130" width="164" height="124" rx="14" fill="#e3f0f4"/><text x="234" y="170" class="label">18日（日）</text><text x="234" y="207" class="small">鑑賞候補</text><text x="234" y="236" font-size="20">16時30分まで</text><rect x="396" y="130" width="164" height="124" rx="14" fill="#eee5df"/><text x="411" y="170" class="label">19日（月）</text><text x="411" y="207" class="small">休館</text><text x="411" y="236" font-size="20">展示なし</text><rect x="573" y="130" width="164" height="124" rx="14" fill="#e3f0f4"/><text x="588" y="170" class="label">20日（火）</text><text x="588" y="207" class="small">鑑賞候補</text><text x="588" y="236" font-size="20">16時30分まで</text><rect x="750" y="130" width="164" height="124" rx="14" fill="#e3f0f4"/><text x="765" y="170" class="label">21日（水）</text><text x="765" y="207" class="small">鑑賞候補</text><text x="765" y="236" font-size="20">16時30分まで</text><rect x="42" y="271" width="164" height="124" rx="14" fill="#eee5df"/><text x="57" y="311" class="label">22日（木）</text><text x="57" y="348" class="small">休館</text><text x="57" y="377" font-size="20">展示なし</text><rect x="219" y="271" width="164" height="124" rx="14" fill="#e3f0f4"/><text x="234" y="311" class="label">23日（金）</text><text x="234" y="348" class="small">鑑賞候補</text><text x="234" y="377" font-size="20">16時30分まで</text><rect x="396" y="271" width="164" height="124" rx="14" fill="#e3f0f4"/><text x="411" y="311" class="label">24日（土）</text><text x="411" y="348" class="small">鑑賞候補</text><text x="411" y="377" font-size="20">16時30分まで</text><rect x="573" y="271" width="164" height="124" rx="14" fill="#e3f0f4"/><text x="588" y="311" class="label">25日（日）</text><text x="588" y="348" class="small">最終日</text><text x="588" y="377" font-size="20">16時まで</text><text x="42" y="451" class="label">展示開始は10時。施設の開館時刻とは別です。</text><text x="42" y="492" class="small">出発前に磐田市公式の展示案内で変更を確認してください。</text></svg>