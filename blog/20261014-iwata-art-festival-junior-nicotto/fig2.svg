<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial"><title id="title">親子鑑賞の三つの段取り</title><desc id="desc">候補日を選ぶ、市公式で確認する、にこっと2階で無理のない範囲で鑑賞する。</desc><style>text{font-family:Meiryo,'Noto Sans JP',sans-serif;fill:#163e54}.small{font-size:22px}.label{font-size:26px;font-weight:bold}</style><rect width="960" height="520" rx="24" fill="#f4f8fa"/><text x="42" y="58" font-size="32" font-weight="bold">親子の秋鑑賞は、日を一つ選ぶところから</text><text x="42" y="99" class="small">準備を増やしすぎず、家族のペースで。</text><rect x="42" y="140" width="276" height="278" rx="20" fill="#e3f0f4"/><text x="62" y="184" class="label">1　日を選ぶ</text><text x="62" y="337" class="small">家族の予定から</text><text x="62" y="374" class="small">候補日を一つ</text><rect x="115" y="213" width="130" height="82" rx="8" fill="white" stroke="#197494" stroke-width="3"/><path d="M115 239h130" stroke="#197494" stroke-width="3"/><path d="M158 266l15 14 28-28" fill="none" stroke="#197494" stroke-width="7"/><rect x="342" y="140" width="276" height="278" rx="20" fill="#e3f0f4"/><text x="362" y="184" class="label">2　公式で確認</text><text x="362" y="337" class="small">休館日と展示時間</text><text x="362" y="374" class="small">出発前に照合</text><rect x="423" y="207" width="114" height="94" rx="8" fill="white" stroke="#197494" stroke-width="3"/><path d="M444 235h70m-70 24h70m-70 24h46" stroke="#197494" stroke-width="5"/><rect x="642" y="140" width="276" height="278" rx="20" fill="#e3f0f4"/><text x="662" y="184" class="label">3　2階で鑑賞</text><text x="662" y="337" class="small">気になる作品を</text><text x="662" y="374" class="small">無理のない範囲で</text><rect x="708" y="212" width="144" height="87" fill="white" stroke="#197494" stroke-width="3"/><circle cx="745" cy="243" r="16" fill="#e4ac6a"/><path d="M729 281l42-27 30 14 32-34v47z" fill="#6fa6a5"/><text x="42" y="462" class="small">短く切り上げてもよい。全部を見ることを目標にしない。</text><text x="42" y="498" font-size="19">段取りの概念図です。実際の会場・出品作品の再現ではありません。</text></svg>