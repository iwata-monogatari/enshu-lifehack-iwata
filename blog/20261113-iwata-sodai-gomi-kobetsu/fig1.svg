<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">粗大ごみ戸別収集の申し込み手順</title><rect width="440" height="600" fill="#eef6fb"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="24" y="56" font-size="25" font-weight="bold">申し込みの手順（磐田市）</text><rect x="20" y="82" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="120" font-size="22" font-weight="bold">1 品目・個数・大きさをメモ</text><text x="36" y="156" font-size="20">対象は長さ2m以内・重さ80kg以下</text><rect x="20" y="206" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="244" font-size="22" font-weight="bold">2 LINEか電話で申し込む</text><text x="36" y="280" font-size="20">希望日の2週間前までが原則</text><rect x="20" y="330" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="368" font-size="22" font-weight="bold">3 収集日と料金を確認</text><text x="36" y="404" font-size="20">収集は月〜金（祝日・年末年始除く）</text><rect x="20" y="454" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="492" font-size="22" font-weight="bold">4 家の外に出して立ち会う</text><text x="36" y="528" font-size="20">集合住宅は1階まで。支払いは現金・PayPay</text></g></svg>
