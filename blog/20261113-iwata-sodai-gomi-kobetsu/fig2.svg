<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">粗大ごみ戸別収集の料金の組み立て</title><rect width="440" height="600" fill="#eef6fb"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="24" y="56" font-size="25" font-weight="bold">料金の組み立て（磐田市）</text><rect x="20" y="82" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="120" font-size="22" font-weight="bold">基本料金 1,040円</text><text x="36" y="156" font-size="20">＋品物代 1点につき210円</text><rect x="20" y="206" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="244" font-size="22" font-weight="bold">例：4点なら1,880円</text><text x="36" y="280" font-size="20">1,040円＋（210円×4点）</text><rect x="20" y="330" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="368" font-size="22" font-weight="bold">家電リサイクル品を含む場合</text><text x="36" y="404" font-size="20">運搬料1点1,100円＋リサイクル券</text><rect x="20" y="454" width="400" height="104" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="492" font-size="22" font-weight="bold">基本料金の減免あり</text><text x="36" y="528" font-size="20">70歳以上のみの世帯など＋民生委員の確認</text></g></svg>
