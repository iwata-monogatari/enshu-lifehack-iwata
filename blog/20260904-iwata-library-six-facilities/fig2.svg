<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
<title id="title">近い館を入口にして全館の仕組みで補う手順</title><desc id="desc">近い館を選び、蔵書検索と受取館指定で予約し、別の館へ返却する流れを示した図。</desc>
<rect width="1200" height="675" fill="#f4f8fb"/><rect x="54" y="50" width="1092" height="575" rx="28" fill="#fff" stroke="#c2d8e6" stroke-width="4"/>
<text x="95" y="112" font-family="sans-serif" font-size="32" font-weight="700" fill="#124b62">近い館を入口にする4ステップ</text>
<g font-family="sans-serif" text-anchor="middle"><g fill="#e6f3f5" stroke="#2f8293" stroke-width="3"><rect x="105" y="205" width="210" height="150" rx="20"/><rect x="360" y="205" width="210" height="150" rx="20"/><rect x="630" y="205" width="210" height="150" rx="20"/><rect x="885" y="205" width="210" height="150" rx="20"/></g>
<g fill="#176175"><text x="210" y="245" font-size="24" font-weight="700">1 近い館</text><text x="210" y="285" font-size="21">移動の負担を</text><text x="210" y="316" font-size="21">先に比べる</text><text x="465" y="245" font-size="24" font-weight="700">2 蔵書検索</text><text x="465" y="285" font-size="21">読みたい本を</text><text x="465" y="316" font-size="21">全館から探す</text><text x="735" y="245" font-size="24" font-weight="700">3 受取館</text><text x="735" y="285" font-size="21">近い館を指定</text><text x="735" y="316" font-size="21">連絡日を記録</text><text x="990" y="245" font-size="24" font-weight="700">4 別館返却</text><text x="990" y="285" font-size="21">市内全館・</text><text x="990" y="316" font-size="21">にこっとへ返す</text></g>
<g fill="none" stroke="#e39b56" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M320 280h30"/><path d="M575 280h45"/><path d="M845 280h30"/></g><g fill="#e39b56"><path d="m342 267 22 13-22 13z"/><path d="m607 267 22 13-22 13z"/><path d="m867 267 22 13-22 13z"/></g></g>
<rect x="180" y="450" width="840" height="92" rx="18" fill="#fff5e7" stroke="#e39b56" stroke-width="3"/><text x="600" y="490" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#75491f">近い館で借りる ＝ 遠い館を使えない、ではない</text><text x="600" y="525" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#75491f">予約・受取・返却を分けると、家族の予定に合わせられる</text>
</svg>
