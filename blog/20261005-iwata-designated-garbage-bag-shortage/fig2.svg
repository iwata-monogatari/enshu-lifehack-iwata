<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" data-illustration="iwata-editorial"><rect width="960" height="540" rx="24" fill="#edf4f8"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="48" y="60" font-size="30" font-weight="bold">手元の袋一つを、公式条件と照合</text><text x="48" y="101" font-size="20">臨時措置の期限：2026年10月31日まで</text><rect x="48" y="130" width="864" height="68" rx="12" fill="white"/><text x="70" y="173" font-size="23" font-weight="bold">1　用途を読む</text><text x="310" y="173" font-size="22">他自治体指定袋・事業系青色袋は不可</text><rect x="48" y="212" width="864" height="68" rx="12" fill="white"/><text x="70" y="255" font-size="23" font-weight="bold">2　素材と見え方</text><text x="310" y="255" font-size="22">透明・半透明のプラスチック製等</text><rect x="48" y="294" width="864" height="68" rx="12" fill="white"/><text x="70" y="337" font-size="23" font-weight="bold">3　容量を照合</text><text x="310" y="337" font-size="22">可燃6～45 L ／ 不燃6～30 L</text><rect x="48" y="376" width="864" height="68" rx="12" fill="white"/><text x="70" y="419" font-size="23" font-weight="bold">4　記名と口を確認</text><text x="310" y="419" font-size="22">区分・地区名・氏名を書き、口を縛る</text><text x="48" y="507" font-size="20">分別区分・地区の収集日は、市公式のカレンダーで別に確認</text></g></svg>