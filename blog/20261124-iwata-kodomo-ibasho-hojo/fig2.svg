<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" data-illustration="iwata-editorial">
<rect width="760" height="560" fill="#eef7f1"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">申請から振込までの流れ（磐田市）</text>
<rect x="40" y="84" width="680" height="64" rx="14" fill="#ffffff"/><text x="64" y="124" font-family="Meiryo, sans-serif" font-size="20" fill="#333333">1. 申請書・事業計画書・収支予算書・見積書等を提出</text>
<rect x="40" y="160" width="680" height="64" rx="14" fill="#ffffff"/><text x="64" y="200" font-family="Meiryo, sans-serif" font-size="20" fill="#333333">2. 市が審査し、交付決定通知書で可否を通知</text>
<rect x="40" y="236" width="680" height="64" rx="14" fill="#ffffff"/><text x="64" y="276" font-family="Meiryo, sans-serif" font-size="20" fill="#333333">3. 事業を実施（年6回以上・責任者を配置）</text>
<rect x="40" y="312" width="680" height="64" rx="14" fill="#ffffff"/><text x="64" y="352" font-family="Meiryo, sans-serif" font-size="20" fill="#333333">4. 完了後7日以内（または年度末まで）に実績報告</text>
<rect x="40" y="388" width="680" height="64" rx="14" fill="#ffffff"/><text x="64" y="428" font-family="Meiryo, sans-serif" font-size="20" fill="#333333">5. 確定通知後7日以内に請求書→補助金の振込</text>
<text x="40" y="516" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">関係書類は事業完了後5年間保管／こども未来課 電話0538-37-2808</text>
</svg>
