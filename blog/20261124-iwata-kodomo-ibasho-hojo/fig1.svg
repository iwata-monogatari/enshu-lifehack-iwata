<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" data-illustration="iwata-editorial">
<rect width="760" height="520" fill="#eef7f1"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">こどもの居場所づくり補助金の補助額（磐田市）</text>
<rect x="40" y="84" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="122" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">食事提供（こども食堂など）</text><text x="696" y="122" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">上限20万円</text><text x="64" y="152" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">補助基準額40万円／無料または低料金で食事を提供する活動</text>
<rect x="40" y="192" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="230" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">学習支援（宿題の見守りなど）</text><text x="696" y="230" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">上限5万円</text><text x="64" y="260" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">補助基準額10万円／無料で行う学習支援。食事提供との両方申請も可</text>
<rect x="40" y="300" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="338" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">遊び・見守り・交流</text><text x="696" y="338" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">上限5万円</text><text x="64" y="368" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">補助基準額10万円／令和7年度に対象へ追加された活動</text>
<text x="40" y="486" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">補助額は実支出額と基準額の少ない方の2分の1（1,000円未満切り捨て）／申請は1団体1回限り。出典：磐田市 募集要項（こども未来課）</text>
</svg>
