<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">市の相続相談：内容で比較</title><rect width="760" height="520" rx="24" fill="#edf5fa"/><g font-family="Meiryo,sans-serif" fill="#173b50"><text x="38" y="65" font-size="32" font-weight="bold">市の相続相談：内容で比較</text><rect x="28" y="100" width="704" height="170" rx="18" fill="white"/><text x="50" y="142" font-size="29" font-weight="bold">司法書士の相談</text><text x="50" y="188" font-size="27">相続・登記の手続き</text><text x="50" y="231" font-size="24">相続税・贈与税は対象外</text><rect x="28" y="290" width="704" height="170" rx="18" fill="white"/><text x="50" y="332" font-size="29" font-weight="bold">弁護士の相談</text><text x="50" y="378" font-size="27">法律問題への助言</text><text x="50" y="421" font-size="24">書類作成などの実務は行わない</text></g></svg>