<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">相談先を選ぶ順番</title><rect width="760" height="900" rx="24" fill="#edf5fa"/><g font-family="Meiryo,sans-serif" fill="#173b50"><text x="38" y="65" font-size="32" font-weight="bold">相談先を選ぶ順番</text><rect x="28" y="100" width="704" height="170" rx="18" fill="white"/><text x="50" y="142" font-size="29" font-weight="bold">1 聞きたい内容</text><text x="50" y="188" font-size="27">一文で、今の疑問を書く</text><text x="50" y="231" font-size="24">書類が全部そろう前でも整理はできる</text><rect x="28" y="290" width="704" height="170" rx="18" fill="white"/><text x="50" y="332" font-size="29" font-weight="bold">2 利用条件</text><text x="50" y="378" font-size="27">市内在住の当事者か確認</text><text x="50" y="421" font-size="24">家族だけの相談可否は受付へ</text><rect x="28" y="480" width="704" height="170" rx="18" fill="white"/><text x="50" y="522" font-size="29" font-weight="bold">3 行ける曜日</text><text x="50" y="568" font-size="27">内容が合う枠から比べる</text><text x="50" y="611" font-size="24">11月は弁護士相談に日曜の定例枠</text><rect x="28" y="670" width="704" height="170" rx="18" fill="white"/><text x="50" y="712" font-size="29" font-weight="bold">4 予約の確認</text><text x="50" y="758" font-size="27">開催日と受付開始を市で確認</text><text x="50" y="801" font-size="24">定例案内は空席の保証ではない</text></g></svg>