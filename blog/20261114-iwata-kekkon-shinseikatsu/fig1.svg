<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">結婚新生活支援事業の対象要件</title><rect width="440" height="600" fill="#fdf0f4"/><g font-family="Meiryo,sans-serif" fill="#571f38"><text x="24" y="56" font-size="25" font-weight="bold">対象世帯の四つの関門（磐田市）</text><rect x="20" y="82" width="400" height="104" rx="16" fill="white" stroke="#a03d63"/><text x="36" y="120" font-size="22" font-weight="bold">1 婚姻の時期</text><text x="36" y="156" font-size="20">令和8年1月1日以降に婚姻届が受理</text><rect x="20" y="206" width="400" height="104" rx="16" fill="white" stroke="#a03d63"/><text x="36" y="244" font-size="22" font-weight="bold">2 年齢</text><text x="36" y="280" font-size="20">婚姻日に夫婦とも39歳以下</text><rect x="20" y="330" width="400" height="104" rx="16" fill="white" stroke="#a03d63"/><text x="36" y="368" font-size="22" font-weight="bold">3 所得</text><text x="36" y="404" font-size="20">合計500万円未満（奨学金返済は控除）</text><rect x="20" y="454" width="400" height="104" rx="16" fill="white" stroke="#a03d63"/><text x="36" y="492" font-size="22" font-weight="bold">4 住民票と契約</text><text x="36" y="528" font-size="20">住民票は新居の住所・名義は夫婦</text></g></svg>
