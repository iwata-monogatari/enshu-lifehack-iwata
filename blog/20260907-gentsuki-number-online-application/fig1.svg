<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
  <title id="title">原付ナンバー電子申請から郵送受取まで</title>
  <desc id="desc">スマートフォンで申請後、内容確認と郵便料430円の決済について画面や市からの連絡に従い、レターパックライトで標識を受け取る全体像</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7fb"/><stop offset="1" stop-color="#f6fbf4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17465b" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="600" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#173f52">電子申請から原付ナンバー到着まで</text>
  <text x="600" y="108" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#526b76">2026年9月1日開始　確認と決済は画面・連絡に従う</text>
  <path d="M244 337H350M796 337H902" fill="none" stroke="#4f879e" stroke-width="8" stroke-linecap="round"/>
  <path d="M338 323l20 14-20 14M890 323l20 14-20 14" fill="none" stroke="#4f879e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)"><rect x="70" y="170" width="174" height="334" rx="27" fill="#fff" stroke="#22617a" stroke-width="5"/><rect x="87" y="212" width="140" height="230" rx="10" fill="#dff0f7"/><circle cx="157" cy="474" r="13" fill="#22617a"/><rect x="122" y="188" width="70" height="8" rx="4" fill="#83a8b8"/><path d="M115 274h84M115 311h84M115 348h55" stroke="#22617a" stroke-width="10" stroke-linecap="round"/><circle cx="191" cy="394" r="20" fill="#5b9b68"/><path d="M181 394l7 7 14-17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g filter="url(#shadow)"><rect x="358" y="199" width="162" height="276" rx="20" fill="#fff" stroke="#22617a" stroke-width="5"/><path d="M387 269h104M387 309h104M387 349h74" stroke="#7aa6b9" stroke-width="11" stroke-linecap="round"/><path d="M406 414l20 20 47-60" fill="none" stroke="#5b9b68" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M393 199v-27h92v27" fill="#dff0f7" stroke="#22617a" stroke-width="5"/></g>
  <g filter="url(#shadow)"><rect x="634" y="215" width="162" height="244" rx="22" fill="#fff" stroke="#c47b32" stroke-width="5"/><path d="M655 261l60 49 60-49" fill="#f9e9d7" stroke="#c47b32" stroke-width="6" stroke-linejoin="round"/><path d="M655 408l51-64a12 12 0 0 1 18 0l51 64" fill="none" stroke="#c47b32" stroke-width="6"/><text x="715" y="389" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#9b571f">430円</text></g>
  <g filter="url(#shadow)"><rect x="910" y="226" width="220" height="144" rx="18" fill="#fff" stroke="#22617a" stroke-width="6"/><circle cx="950" cy="270" r="11" fill="none" stroke="#22617a" stroke-width="5"/><circle cx="1090" cy="270" r="11" fill="none" stroke="#22617a" stroke-width="5"/><text x="1020" y="326" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#22617a">磐田市</text><rect x="941" y="380" width="158" height="72" rx="10" fill="#e5f3e4" stroke="#5b9b68" stroke-width="5"/><text x="1020" y="425" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#356840">標識到着</text></g>
  <g font-family="sans-serif" font-size="23" font-weight="700" fill="#173f52" text-anchor="middle"><text x="157" y="552">1　フォーム入力</text><text x="577" y="552">2　内容確認・郵便料決済</text><text x="1020" y="552">3　郵送受取</text></g>
  <text x="600" y="619" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#526b76">不備連絡に備え、日中に連絡を受けられる連絡先を正確に入力</text>
</svg>
