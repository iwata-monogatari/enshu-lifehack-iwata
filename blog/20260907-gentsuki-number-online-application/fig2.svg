<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
  <title id="title">原付ナンバーの電子申請と窓口の選び分け</title>
  <desc id="desc">標識を急ぐ場合は窓口へ事前確認し、平日に動きにくく1週間から10日待てる場合は電子申請を検討する判断図</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef7fb"/><stop offset="1" stop-color="#fffaf2"/></linearGradient><filter id="s2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#173f52" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg2)"/>
  <text x="600" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#173f52">標識が必要な日から、入口を選ぶ</text>
  <g filter="url(#s2)"><rect x="405" y="120" width="390" height="116" rx="24" fill="#fff" stroke="#22617a" stroke-width="5"/><text x="600" y="170" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#173f52">1週間〜10日程度</text><text x="600" y="207" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#526b76">標識の到着を待てる？</text></g>
  <path d="M510 238C510 300 321 284 321 347M690 238C690 300 879 284 879 347" fill="none" stroke="#4f879e" stroke-width="8" stroke-linecap="round"/>
  <path d="M307 329l14 22 14-22M865 329l14 22 14-22" fill="none" stroke="#4f879e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#s2)"><rect x="100" y="351" width="442" height="230" rx="25" fill="#fff" stroke="#c47b32" stroke-width="5"/><circle cx="174" cy="426" r="38" fill="#f9e9d7"/><path d="M174 402v27l18 13" fill="none" stroke="#b56527" stroke-width="8" stroke-linecap="round"/><text x="321" y="417" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#8d4c1d">急ぐ</text><text x="321" y="461" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#526b76">市民税課・各支所へ事前確認</text><text x="321" y="505" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#526b76">車種・書類・受付時間を伝える</text><rect x="203" y="530" width="236" height="34" rx="17" fill="#f9e9d7"/><text x="321" y="554" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#8d4c1d">送信前に窓口へ相談</text></g>
  <g filter="url(#s2)"><rect x="658" y="351" width="442" height="230" rx="25" fill="#fff" stroke="#4e8b5d" stroke-width="5"/><rect x="724" y="390" width="66" height="102" rx="10" fill="#e5f3e4" stroke="#4e8b5d" stroke-width="5"/><circle cx="757" cy="474" r="6" fill="#4e8b5d"/><text x="879" y="417" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#356840">待てる</text><text x="879" y="461" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#526b76">24時間の電子申請を検討</text><text x="879" y="505" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#526b76">郵便料430円・郵便受けで受取</text><rect x="761" y="530" width="236" height="34" rx="17" fill="#e5f3e4"/><text x="879" y="554" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#356840">書類と端末を先に確認</text></g>
  <text x="600" y="630" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#526b76">電子か窓口かは、430円だけでなく移動時間と必要日を一緒に比べる</text>
</svg>
