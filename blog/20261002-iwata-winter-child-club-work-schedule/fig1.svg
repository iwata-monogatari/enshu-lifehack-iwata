<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><style>text{font-family:Meiryo,sans-serif;fill:#173d51}.heading{font-size:30px;font-weight:700}.label{font-size:25px;font-weight:700}.small{font-size:21px}</style><rect width="960" height="520" rx="24" fill="#edf5f8"/><title id="title">勤務表から送迎の一行を作る</title><desc id="desc">9時から17時の勤務に仮の移動時間40分を足すと迎えは17時40分。送りと迎えの担当、未定事項を記録する。</desc><text x="42" y="57" class="heading">勤務表の一日を、送迎までつなげる</text><text x="42" y="96" class="small">家族用メモの記入例 ／ 時間は仮の例です</text><rect x="42" y="136" width="470" height="101" rx="12" fill="#087da8"/><text x="65" y="178" class="label" style="fill:white">勤務 9:00〜17:00</text><text x="65" y="214" class="small" style="fill:white">始業と終業を勤務表から写す</text><path d="M525 185h43m-12-10 12 10-12 10" fill="none" stroke="#173d51" stroke-width="4"/><rect x="582" y="136" width="330" height="101" rx="12" fill="#ffdf99"/><text x="603" y="179" class="label">迎え 17:40</text><text x="603" y="214" class="small">移動40分を足した例</text><rect x="42" y="273" width="870" height="144" rx="12" fill="white"/><path d="M332 285v120M622 285v120" stroke="#c7dce5" stroke-width="2"/><text x="65" y="314" class="label">送り担当</text><text x="65" y="365" class="small">名前・到着時刻</text><text x="355" y="314" class="label">迎え担当</text><text x="355" y="365" class="small">名前・到着見込み</text><text x="645" y="314" class="label">代わりの担当</text><text x="645" y="365" class="small">未定なら質問にする</text><text x="42" y="462" class="small">一日のメモとは別に、平日週3日以上などの利用条件も確認。</text><text x="42" y="493" class="small">これは申請書ではなく、家族の準備用の図です。</text></svg>