<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><style>text{font-family:Meiryo,sans-serif;fill:#173d51}.heading{font-size:30px;font-weight:700}.label{font-size:25px;font-weight:700}.small{font-size:21px}</style><rect width="960" height="520" rx="24" fill="#edf5f8"/><title id="title">冬休み利用の申請から開始前まで</title><desc id="desc">2026年10月31日第1次期限、11月中旬結果通知、初めて利用する場合は利用開始前の説明会または面接に参加する。</desc><text x="42" y="57" class="heading">申請・通知・利用前を、別々の予定に</text><text x="42" y="98" class="small">磐田市・2026年冬休みの児童クラブ</text><path d="M112 157v246" stroke="#9dc9da" stroke-width="7"/><circle cx="112" cy="168" r="24" fill="#087da8"/><text x="104" y="177" class="label" style="fill:white">1</text><text x="159" y="168" class="label">10月31日（土）　第1次期限</text><text x="159" y="203" class="small">電子申請は土日可。窓口は平日／支所・郵送は不可</text><circle cx="112" cy="278" r="24" fill="#087da8"/><text x="104" y="287" class="label" style="fill:white">2</text><text x="159" y="278" class="label">11月中旬　審査結果通知</text><text x="159" y="313" class="small">利用決定を確認して、場所と送迎をつなぎ直す</text><circle cx="112" cy="388" r="24" fill="#087da8"/><text x="104" y="397" class="label" style="fill:white">3</text><text x="159" y="388" class="label">利用開始前　説明会または面接</text><text x="159" y="423" class="small">初めての利用は参加が必要。案内で日程を確認</text><text x="42" y="485" class="small">市の令和8年度利用募集案内（本文1・3頁）／2026年10月2日確認</text></svg>