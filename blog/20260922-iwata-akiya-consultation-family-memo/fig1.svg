<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" data-illustration="iwata-editorial"><rect width="960" height="600" rx="24" fill="#f2f7f8"/><g font-family="Meiryo, sans-serif" fill="#173b4d"><text x="48" y="64" font-size="30" font-weight="bold">家族の相談メモ：結論はまだ一つにしない</text><path d="M75 218 L150 148 L225 218 V312 H75Z" fill="#d5e7ee" stroke="#27708c" stroke-width="5"/><path d="M58 220 L150 135 L242 220" fill="none" stroke="#27708c" stroke-width="8"/><rect x="132" y="254" width="38" height="58" fill="#fff"/><text x="83" y="360" font-size="23">磐田の実家</text><path d="M255 270 H303" stroke="#27708c" stroke-width="5"/><path d="M292 259 L305 270 L292 281" fill="none" stroke="#27708c" stroke-width="5"/><rect x="330" y="116" width="580" height="116" rx="16" fill="#e7f0f7" stroke="#c5d5db"/><text x="355" y="158" font-size="25" font-weight="bold">1　困りごと</text><text x="375" y="200" font-size="25">草刈りを一人で担当</text><rect x="330" y="255" width="580" height="116" rx="16" fill="#edf2df" stroke="#c5d5db"/><text x="355" y="297" font-size="25" font-weight="bold">2　希望</text><text x="375" y="339" font-size="25">管理回数を減らしたい</text><rect x="330" y="394" width="580" height="116" rx="16" fill="#fcf0dc" stroke="#c5d5db"/><text x="355" y="436" font-size="25" font-weight="bold">3　未確認</text><text x="375" y="478" font-size="25">土地と建物の名義は？</text><text x="48" y="564" font-size="21">誰の希望かを添える ／ 分からない欄は、そのまま相談へ</text></g></svg>