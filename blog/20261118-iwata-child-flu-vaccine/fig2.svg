<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">子どものインフルエンザ予防接種を受ける前に確かめる3点</title><rect width="440" height="600" fill="#edf4f7"/><g font-family="Meiryo,sans-serif" fill="#084a3e"><text x="24" y="58" font-size="27" font-weight="bold">受ける前に確かめる3点</text><rect x="20" y="86" width="400" height="118" rx="16" fill="white" stroke="#0f6a5c"/><text x="36" y="124" font-size="25" font-weight="bold">1 料金の総額</text><text x="36" y="168" font-size="23">13歳未満は2回分を電話で確認</text><rect x="20" y="224" width="400" height="118" rx="16" fill="white" stroke="#0f6a5c"/><text x="36" y="262" font-size="25" font-weight="bold">2 2回目の予約</text><text x="36" y="306" font-size="23">間隔2〜4週間を先に押さえる</text><rect x="20" y="362" width="400" height="100" rx="16" fill="white" stroke="#0f6a5c"/><text x="36" y="400" font-size="25" font-weight="bold">3 健保組合の補助</text><text x="36" y="440" font-size="23">市の助成とは別の仕組みを確認</text><rect x="20" y="482" width="400" height="88" rx="16" fill="#fdf0e7" stroke="#c2501e"/><text x="36" y="520" font-size="23" font-weight="bold" fill="#8a3a14">当日は母子健康手帳を持参</text><text x="36" y="552" font-size="21" fill="#8a3a14">領収書は年度末まで保管</text></g></svg>
