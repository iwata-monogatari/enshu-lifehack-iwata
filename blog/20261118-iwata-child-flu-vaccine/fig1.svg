<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">子どものインフルエンザと磐田市の助成</title><rect width="440" height="600" fill="#edf4f7"/><g font-family="Meiryo,sans-serif" fill="#084a3e"><text x="24" y="58" font-size="27" font-weight="bold">子どもと市の助成（令和8年度）</text><rect x="20" y="86" width="400" height="118" rx="16" fill="white" stroke="#0f6a5c"/><text x="36" y="124" font-size="25" font-weight="bold">高齢者 助成あり</text><text x="36" y="168" font-size="23">65歳以上など 自己負担1,600円</text><rect x="20" y="224" width="400" height="118" rx="16" fill="white" stroke="#0f6a5c"/><text x="36" y="262" font-size="25" font-weight="bold">子ども 助成なし</text><text x="36" y="306" font-size="23">任意接種・全額自己負担</text><rect x="20" y="362" width="400" height="100" rx="16" fill="white" stroke="#0f6a5c"/><text x="36" y="400" font-size="25" font-weight="bold">こども医療費も対象外</text><text x="36" y="440" font-size="23">予防接種代は助成されません</text><rect x="20" y="482" width="400" height="88" rx="16" fill="#fdf0e7" stroke="#c2501e"/><text x="36" y="520" font-size="23" font-weight="bold" fill="#8a3a14">料金は医療機関ごとに確認</text><text x="36" y="552" font-size="21" fill="#8a3a14">2026年11月18日 市公式で確認</text></g></svg>
