<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" data-illustration="iwata-editorial"><title>常設と月1回、選ぶ順番</title><rect width="640" height="760" rx="24" fill="#f2f7f7"/><g font-family="Meiryo, sans-serif"><text x="32" y="65" font-size="32" font-weight="bold" fill="#123a52">常設と月1回、選ぶ順番</text><rect x="24" y="105" width="592" height="165" rx="16" fill="#d9edf2"/><text x="44" y="145" font-size="30" font-weight="bold" fill="#123a52">1　品目</text><text x="44" y="184" font-size="26" fill="#263f4d">常設だけ？　両方で回収？</text><text x="44" y="218" font-size="26" fill="#263f4d">製品の表示や状態を確認。</text><rect x="24" y="292" width="592" height="165" rx="16" fill="#e2edda"/><text x="44" y="332" font-size="30" font-weight="bold" fill="#123a52">2　日時</text><text x="44" y="371" font-size="26" fill="#263f4d">開設日と自分の予定を照合。</text><text x="44" y="405" font-size="26" fill="#263f4d">常設も土曜・年末年始は除外。</text><rect x="24" y="479" width="592" height="165" rx="16" fill="#f5ead1"/><text x="44" y="519" font-size="30" font-weight="bold" fill="#123a52">3　移動</text><text x="44" y="558" font-size="26" fill="#263f4d">住所・荷物の量・運ぶ人。</text><text x="44" y="592" font-size="26" fill="#263f4d">近さだけでは決めない。</text><text x="32" y="690" font-size="23" fill="#526875">今日の一歩：一品の受入先を確認。</text><text x="32" y="721" font-size="23" fill="#526875">磐田市の案内／2026年10月18日確認</text></g></svg>