<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" data-illustration="iwata-editorial"><title>開設日を予定表で比べる</title><rect width="640" height="760" rx="24" fill="#f2f7f7"/><g font-family="Meiryo, sans-serif"><text x="32" y="65" font-size="32" font-weight="bold" fill="#123a52">開設日を予定表で比べる</text><rect x="24" y="105" width="592" height="165" rx="16" fill="#d9edf2"/><text x="44" y="145" font-size="30" font-weight="bold" fill="#123a52">新島の常設</text><text x="44" y="184" font-size="26" fill="#263f4d">平日 8:30–17:00</text><text x="44" y="218" font-size="26" fill="#263f4d">日曜・祝日 9:00–12:00</text><text x="44" y="252" font-size="26" fill="#263f4d">土曜・年末年始を除く。</text><rect x="24" y="292" width="592" height="165" rx="16" fill="#e2edda"/><text x="44" y="332" font-size="30" font-weight="bold" fill="#123a52">地区の月1回</text><text x="44" y="371" font-size="26" fill="#263f4d">第2日曜：福田</text><text x="44" y="405" font-size="26" fill="#263f4d">第3日曜：竜洋・豊岡</text><text x="44" y="439" font-size="26" fill="#263f4d">第4日曜：豊田</text><rect x="24" y="479" width="592" height="165" rx="16" fill="#f5ead1"/><text x="44" y="519" font-size="30" font-weight="bold" fill="#123a52">竜洋の終了時刻は要確認</text><text x="44" y="558" font-size="26" fill="#263f4d">持ち込み案内：12時</text><text x="44" y="592" font-size="26" fill="#263f4d">施設ガイド：11時</text><text x="44" y="626" font-size="26" fill="#263f4d">記載が異なるため市へ確認。</text><text x="32" y="690" font-size="23" fill="#526875">通常の案内。臨時変更は公式で確認。</text><text x="32" y="721" font-size="23" fill="#526875">磐田市の案内／2026年10月18日確認</text></g></svg>