<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" data-illustration="iwata-editorial" role="img">
<title>かぶと塚公園スポーツ施設：無料個人利用と有料施設の比較</title>
<rect width="960" height="520" rx="24" fill="#f0f7fb"/>
<g font-family="Meiryo, sans-serif">
<text x="44" y="60" font-size="28" font-weight="bold" fill="#173554">かぶと塚公園の利用形態｜無料エリア vs 有料スポーツ施設</text>
<rect x="44" y="90" width="420" height="380" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="74" y="135" font-size="22" font-weight="bold" fill="#16a34a">無料・自由利用エリア</text>
<text x="74" y="180" font-size="16" fill="#334155">【対象】ジョギングコース・散策路・芝生広場</text>
<text x="74" y="215" font-size="16" fill="#334155">【予約】不要（開園時間中はいつでも利用可）</text>
<text x="74" y="250" font-size="16" fill="#334155">【料金】無料（駐車場も全日無料）</text>
<text x="74" y="285" font-size="16" fill="#334155">【特徴】ウッドチップ園路・木陰のベンチ完備</text>
<text x="74" y="320" font-size="16" fill="#334155">【向く人】ウォーキング・軽い運動・親子散歩</text>
<text x="74" y="365" font-size="15" fill="#16a34a" font-weight="bold">◎ 予約なしで今日すぐ始められる手軽さ</text>

<rect x="494" y="90" width="420" height="380" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="524" y="135" font-size="22" font-weight="bold" fill="#2563eb">有料・専用利用施設</text>
<text x="524" y="180" font-size="16" fill="#334155">【対象】総合体育館・陸上競技場・テニスコート</text>
<text x="524" y="215" font-size="16" fill="#334155">【予約】事前予約制（体育館窓口／公共施設予約）</text>
<text x="524" y="250" font-size="16" fill="#334155">【料金】規定の使用料（夜間照明等は別料金）</text>
<text x="524" y="285" font-size="16" fill="#334155">【特徴】公式規格コース・更衣室・シャワー完備</text>
<text x="524" y="320" font-size="16" fill="#334155">【向く人】部活・クラブ・団体練習・本格練習</text>
<text x="524" y="365" font-size="15" fill="#2563eb" font-weight="bold">◎ 本格的な設備と夜間ナイター環境が充実</text>
</g>
</svg>
