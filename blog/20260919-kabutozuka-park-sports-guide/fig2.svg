<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img">
<title>かぶと塚公園を利用する前の3つの段取りフロー</title>
<rect width="960" height="560" rx="24" fill="#f8fafc"/>
<g font-family="Meiryo, sans-serif">
<text x="44" y="60" font-size="28" font-weight="bold" fill="#0f172a">かぶと塚公園での運動開始｜3つの事前チェック</text>

<rect x="44" y="95" width="872" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="85" cy="155" r="26" fill="#2563eb"/>
<text x="77" y="164" font-size="24" font-weight="bold" fill="#ffffff">1</text>
<text x="135" y="135" font-size="20" font-weight="bold" fill="#1e293b">施設の予約空き状況と大会開催の有無を確認</text>
<text x="135" y="165" font-size="15" fill="#475569">・競技場や体育館は週末に市内大会・高校総体予選等で全面貸切になることが多い</text>
<text x="135" y="190" font-size="15" fill="#475569">・一般開放日やジョギングコースは大会開催中も利用可能だが駐車場混雑を考慮する</text>

<rect x="44" y="235" width="872" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="85" cy="295" r="26" fill="#0891b2"/>
<text x="77" y="304" font-size="24" font-weight="bold" fill="#ffffff">2</text>
<text x="135" y="275" font-size="20" font-weight="bold" fill="#1e293b">適したシューズと服装・水分補給の準備</text>
<text x="135" y="305" font-size="15" fill="#475569">・体育館内は室内専用シューズが必須（土足厳禁・外靴での立ち入り不可）</text>
<text x="135" y="330" font-size="15" fill="#475569">・ジョギングコースは屋外用ランニングシューズ、日差し対策の帽子と水分を持参</text>

<rect x="44" y="375" width="872" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="85" cy="435" r="26" fill="#16a34a"/>
<text x="77" y="444" font-size="24" font-weight="bold" fill="#ffffff">3</text>
<text x="135" y="415" font-size="20" font-weight="bold" fill="#1e293b">無料駐車場の利用と周囲の歩行者への安全配慮</text>
<text x="135" y="445" font-size="15" fill="#475569">・公園東側・北側に大容量無料駐車場完備。夕暮れ時は早めのライト点灯を励行</text>
<text x="135" y="470" font-size="15" fill="#475569">・園路は散歩中の高齢者や幼児も通行するため、すれ違い時は減速と声かけを徹底</text>

<text x="44" y="530" font-size="14" fill="#64748b">※ 施設利用の最新規則・利用料金は磐田市公式ウェブサイトおよび総合体育館窓口で確認してください。</text>
</g>
</svg>
