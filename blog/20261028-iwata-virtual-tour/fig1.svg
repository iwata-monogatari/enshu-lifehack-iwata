<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">バーチャルツアー・磐田</title><desc id="desc">家族の予定表に写す、開催日時と会場</desc><rect width="960" height="640" rx="26" fill="#f2f7f8"/><g font-family="Meiryo, sans-serif" fill="#143c51"><text x="48" y="66" font-size="34" font-weight="bold">バーチャルツアー・磐田</text><text x="48" y="112" font-size="23">家族の予定表に写す、開催日時と会場</text><rect x="40" y="148" width="880" height="124" rx="18" fill="white"/><rect x="40" y="148" width="12" height="124" rx="6" fill="#0074ae"/><text x="72" y="186" font-size="23" fill="#006b91">日時</text><text x="72" y="225" font-size="30" font-weight="bold">2026年10月31日（土）10時～正午</text><text x="72" y="256" font-size="21">開催枠です。一人あたりの体験時間ではありません。</text><rect x="40" y="293" width="880" height="124" rx="18" fill="white"/><rect x="40" y="293" width="12" height="124" rx="6" fill="#0074ae"/><text x="72" y="331" font-size="23" fill="#006b91">会場</text><text x="72" y="370" font-size="30" font-weight="bold">旧見付学校</text><text x="72" y="401" font-size="21">磐田市見付2452-1</text><rect x="40" y="438" width="880" height="124" rx="18" fill="white"/><rect x="40" y="438" width="12" height="124" rx="6" fill="#0074ae"/><text x="72" y="476" font-size="23" fill="#006b91">参加方法</text><text x="72" y="515" font-size="30" font-weight="bold">申込不要・直接会場へ</text><text x="72" y="546" font-size="21">機器・体験時間・料金は案内に記載なし。</text><text x="48" y="612" font-size="21">出典：磐田市「文化財だより」第259号3頁・施設案内</text></g></svg>