<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">画面と実物をつなぐ、親子の観察</title><desc id="desc">筆者の提案です。公式プログラムの手順ではありません。</desc><rect width="960" height="720" rx="26" fill="#f2f7f8"/><g font-family="Meiryo, sans-serif" fill="#143c51"><text x="48" y="66" font-size="34" font-weight="bold">画面と実物をつなぐ、親子の観察</text><text x="48" y="112" font-size="23">筆者の提案です。公式プログラムの手順ではありません。</text><rect x="40" y="148" width="880" height="124" rx="18" fill="white"/><rect x="40" y="148" width="12" height="124" rx="6" fill="#0074ae"/><text x="72" y="186" font-size="23" fill="#006b91">01 画面で気づく</text><text x="72" y="225" font-size="30" font-weight="bold">気になる形を一つ探す</text><text x="72" y="256" font-size="21">屋根や窓など、本人が選んだ場所から。</text><rect x="40" y="293" width="880" height="124" rx="18" fill="white"/><rect x="40" y="293" width="12" height="124" rx="6" fill="#0074ae"/><text x="72" y="331" font-size="23" fill="#006b91">02 実物で確かめる</text><text x="72" y="370" font-size="30" font-weight="bold">会場で見られる部分と比べる</text><text x="72" y="401" font-size="21">デジタルの再現と実物は同じものではありません。</text><rect x="40" y="438" width="880" height="124" rx="18" fill="white"/><rect x="40" y="438" width="12" height="124" rx="6" fill="#0074ae"/><text x="72" y="476" font-size="23" fill="#006b91">03 疑問を持ち帰る</text><text x="72" y="515" font-size="30" font-weight="bold">同じところ・違うところを話す</text><text x="72" y="546" font-size="21">正解を急がず、気づいたことを一つ。</text><text x="48" y="692" font-size="21">会場で見られる範囲や安全上の案内に従ってください。</text></g></svg>