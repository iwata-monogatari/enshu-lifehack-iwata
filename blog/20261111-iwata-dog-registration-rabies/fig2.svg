<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">犬を飼い始めてから済ませる順番</title><rect width="440" height="600" fill="#fdf6ec"/><g font-family="Meiryo,sans-serif" fill="#5d430e"><text x="24" y="58" font-size="26" font-weight="bold">飼い始めたら、この順番で</text><rect x="20" y="86" width="400" height="104" rx="16" fill="white" stroke="#d9a441"/><text x="36" y="128" font-size="23" font-weight="bold">1. まず登録（3,000円）</text><text x="36" y="164" font-size="20">未登録では注射済票が出ない</text><rect x="20" y="210" width="400" height="104" rx="16" fill="white" stroke="#d9a441"/><text x="36" y="252" font-size="23" font-weight="bold">2. 毎年4〜6月に注射</text><text x="36" y="288" font-size="20">済証をもらったら届出を確認</text><rect x="20" y="334" width="400" height="104" rx="16" fill="white" stroke="#d9a441"/><text x="36" y="376" font-size="23" font-weight="bold">3. 鑑札と済票を装着</text><text x="36" y="412" font-size="20">迷子・災害時の飼い主探しの手がかり</text><rect x="20" y="458" width="400" height="104" rx="16" fill="white" stroke="#d9a441"/><text x="36" y="500" font-size="23" font-weight="bold">4. 変更・死亡は届出</text><text x="36" y="536" font-size="20">一部は電子申請でもできる</text></g></svg>
