<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">犬の登録と狂犬病予防注射の手数料と交付物</title><rect width="440" height="600" fill="#eef4fa"/><g font-family="Meiryo,sans-serif" fill="#173f63"><text x="24" y="58" font-size="26" font-weight="bold">登録と注射の早見（磐田市）</text><rect x="20" y="86" width="400" height="140" rx="16" fill="white" stroke="#2e6da4"/><text x="36" y="124" font-size="24" font-weight="bold">登録は生涯に一度の手続き</text><text x="36" y="162" font-size="21">手数料 3,000円（環境課・支所）</text><text x="36" y="196" font-size="21">鑑札・愛犬手帳・門標シールを交付</text><rect x="20" y="246" width="400" height="140" rx="16" fill="white" stroke="#2e6da4"/><text x="36" y="284" font-size="24" font-weight="bold">注射は毎年4月から6月</text><text x="36" y="322" font-size="21">動物病院で接種、愛犬手帳を持参</text><text x="36" y="356" font-size="21">済票の交付手数料 550円</text><rect x="20" y="406" width="400" height="140" rx="16" fill="white" stroke="#2e6da4"/><text x="36" y="444" font-size="24" font-weight="bold">済証と済票は別物</text><text x="36" y="482" font-size="21">済証は紙の証明書（病院発行）</text><text x="36" y="516" font-size="21">済票は金属のプレート（装着する）</text></g></svg>
