<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" data-illustration="iwata-editorial" role="img" aria-label="学校資料を囲む家族と三つの会話の糸口"><rect width="100%" height="100%" rx="24" fill="#f4f7f2"/><g font-family="Meiryo, sans-serif" fill="#173c4b"><text x="50" y="65" font-size="36" font-weight="bold">昔の学校を、家族の言葉で話してみる</text><text x="50" y="110" font-size="25">会話の糸口の提案｜展示物・展示室の再現ではありません</text><rect x="380" y="165" width="440" height="245" rx="14" fill="#fff" stroke="#aac6cc" stroke-width="4"/><rect x="430" y="200" width="340" height="150" fill="#e6eeec"/><path d="M465 250 L600 210 L735 250 V330 H465 Z" fill="#c1d9d9" stroke="#397487" stroke-width="4"/><path d="M582 330 V285 H618 V330 M480 270 H530 V305 H480 Z M670 270 H720 V305 H670 Z" fill="#fff" stroke="#397487" stroke-width="3"/><text x="600" y="389" text-anchor="middle" font-size="24">学校風景・行事を手がかりに</text><circle cx="225" cy="295" r="31" fill="#dfbd9c"/><path d="M177 405 V364 Q177 327 225 329 Q273 327 273 364 V405 Z" fill="#38758a"/><circle cx="940" cy="275" r="31" fill="#dfbd9c"/><path d="M892 385 V344 Q892 307 940 309 Q988 307 988 344 V385 Z" fill="#8f704f"/><circle cx="1020" cy="348" r="31" fill="#dfbd9c"/><path d="M972 458 V417 Q972 380 1020 382 Q1068 380 1068 417 V458 Z" fill="#c29141"/><path d="M262 236 Q325 191 366 245 M831 223 Q858 191 897 225" fill="none" stroke="#91afb4" stroke-width="5" stroke-dasharray="7 9"/><rect x="45" y="475" width="350" height="128" rx="16" fill="#fff"/><text x="65" y="514" font-size="28" font-weight="bold">1　資料の年代を読む</text><text x="65" y="562" font-size="26">いつの学校だろう？</text><rect x="425" y="475" width="350" height="128" rx="16" fill="#fff"/><text x="445" y="514" font-size="28" font-weight="bold">2　親の記憶を聞く</text><text x="445" y="562" font-size="26">通学は誰と一緒？</text><rect x="805" y="475" width="350" height="128" rx="16" fill="#fff"/><text x="825" y="514" font-size="28" font-weight="bold">3　言葉を一行残す</text><text x="825" y="562" font-size="26">本人の了解を得て</text><text x="50" y="647" font-size="23">思い出せなくても大丈夫。会話や記録を無理に求めない見学に。</text></g></svg>