<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" data-illustration="iwata-editorial">
<rect width="760" height="560" fill="#fdf6ec"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">申請から振込までの流れ（磐田市）</text>
<rect x="40" y="84" width="680" height="64" rx="14" fill="#ffffff"/><text x="64" y="124" font-family="Meiryo, sans-serif" font-size="20" fill="#333333">1. 耳鼻咽喉科を受診し、申請書に医師の証明を受ける</text>
<rect x="40" y="160" width="680" height="64" rx="14" fill="#ffffff"/><text x="64" y="200" font-family="Meiryo, sans-serif" font-size="20" fill="#333333">2. 販売店で相談・フィッティングし、見積書を依頼</text>
<rect x="40" y="236" width="680" height="64" rx="14" fill="#ffffff"/><text x="64" y="276" font-family="Meiryo, sans-serif" font-size="20" fill="#333333">3. 申請書＋見積書を高齢者支援課（iプラザ3階）へ提出</text>
<rect x="40" y="312" width="680" height="64" rx="14" fill="#ffffff"/><text x="64" y="352" font-family="Meiryo, sans-serif" font-size="20" fill="#333333">4. 交付決定通知書が届く（発送まで3週間程度）</text>
<rect x="40" y="388" width="680" height="64" rx="14" fill="#ffffff"/><text x="64" y="428" font-family="Meiryo, sans-serif" font-size="20" fill="#333333">5. 購入→請求書（領収書の写し・通帳の写し）→振込</text>
<text x="40" y="516" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">医師の証明は申請日以前3か月以内のもの／電子申請も可能／高齢者支援課 電話0538-37-4869</text>
</svg>
