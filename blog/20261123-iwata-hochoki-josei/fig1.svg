<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" data-illustration="iwata-editorial">
<rect width="760" height="520" fill="#fdf6ec"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">高齢者補聴器購入費助成の内容（磐田市）</text>
<rect x="40" y="84" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="122" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">助成額（補聴器の購入費）</text><text x="696" y="122" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">2分の1以内・上限3万円</text><text x="64" y="152" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">購入費5万円なら2万5千円、8万円なら上限の3万円／助成は1人1回限り</text>
<rect x="40" y="192" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="230" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">対象者</text><text x="696" y="230" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">65歳以上</text><text x="64" y="260" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">市内在住／両耳30デシベル以上／耳鼻咽喉科医師の証明／世帯の所得・市税要件あり</text>
<rect x="40" y="300" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="338" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">順番の注意</text><text x="696" y="338" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">申請→決定→購入</text><text x="64" y="368" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">助成金交付決定前に購入した補聴器は助成対象外です</text>
<text x="40" y="486" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：磐田市 高齢者補聴器購入費助成事業の案内チラシ・申請書様式（高齢者支援課）</text>
</svg>
