<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial"><rect width="960" height="560" rx="24" fill="#eff6fa"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#16445c"><text x="60" y="80" font-size="34" font-weight="bold">申し込みを決める前の、小さな一歩</text><text x="60" y="126" font-size="22">この記事で提案する、相談までの準備</text></g><g fill="#fff" stroke="#78a7bb" stroke-width="3"><rect x="60" y="190" width="240" height="230" rx="18"/><rect x="360" y="190" width="240" height="230" rx="18"/><rect x="660" y="190" width="240" height="230" rx="18"/></g><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#16445c" text-anchor="middle"><text x="180" y="245" font-size="28">01</text><text x="480" y="245" font-size="28">02</text><text x="780" y="245" font-size="28">03</text><text x="180" y="302" font-size="30" font-weight="bold">制度を知る</text><text x="480" y="302" font-size="30" font-weight="bold">質問を選ぶ</text><text x="780" y="302" font-size="30" font-weight="bold">窓口へ相談</text><text x="180" y="355" font-size="21">市の案内を読む</text><text x="480" y="355" font-size="21">家族の疑問を一つ</text><text x="780" y="355" font-size="21">個別条件を確認</text><text x="480" y="490" font-size="25">相談の準備と、認定・登録の手続きは別です。</text></g><g stroke="#b77535" stroke-width="5" fill="none"><path d="M315 302h30m-12-12 12 12-12 12M615 302h30m-12-12 12 12-12 12"/></g></svg>