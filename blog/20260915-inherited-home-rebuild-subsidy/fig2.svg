<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">除却費と新築費、住み替え費用を分けた家計の図</title><rect width="960" height="540" rx="24" fill="#f3f7fa"/><g font-family="Meiryo, sans-serif" fill="#143e56"><text x="48" y="60" font-size="30" font-weight="bold">建替えの家計：費用を分けて見る</text>
<rect x="40" y="92" width="880" height="130" rx="16" fill="#e0f0f6"/>
<path d="M68 154L108 120L148 154M78 148V192H138V148" stroke="#0074ae" stroke-width="6" fill="none"/>
<text x="176" y="139" font-size="25" font-weight="bold">古い住宅の除却費</text>
<text x="176" y="181" font-size="25" fill="#0074ae" font-weight="bold">補助対象経費は 2分の1（上限あり）</text>
<rect x="40" y="238" width="430" height="152" rx="16" fill="#fff"/>
<text x="66" y="280" font-size="24" font-weight="bold">新しい住宅の工事費</text><text x="66" y="322" font-size="22">新築費を半額にする</text><text x="66" y="356" font-size="22">補助ではない</text>
<rect x="490" y="238" width="430" height="152" rx="16" fill="#fff"/>
<text x="516" y="280" font-size="24" font-weight="bold">仮住まい・引っ越し費</text><text x="516" y="322" font-size="22">家計に別枠で置き、</text><text x="516" y="356" font-size="22">必要な支出を見落とさない</text>
<text x="48" y="438" font-size="22" font-weight="bold">市内転居等：上限100万円 ／ 条件を満たす市外転居：150万円</text>
<text x="48" y="478" font-size="21">補助の支払いは完了報告・交付確定の後。立て替え時期も確認。</text>
<text x="48" y="514" font-size="18">出典：磐田市「既存住宅取得等事業費補助金」／2026年9月15日確認</text></g></svg>