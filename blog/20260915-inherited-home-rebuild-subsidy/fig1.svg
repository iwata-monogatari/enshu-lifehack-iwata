<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">取得から1年と年度内完了を分けた期限の図</title><rect width="960" height="540" rx="24" fill="#f3f7fa"/><g font-family="Meiryo, sans-serif" fill="#143e56"><text x="48" y="60" font-size="30" font-weight="bold">相続後の建替え：二つの期限を照合</text>
<rect x="40" y="88" width="880" height="152" rx="16" fill="#fff"/>
<text x="64" y="126" font-size="23" font-weight="bold">① 住宅ごとに違う「取得から1年」</text>
<path d="M120 171H824" fill="none" stroke="#0074ae" stroke-width="7"/><path d="M808 158L832 171L808 184" fill="none" stroke="#0074ae" stroke-width="7"/>
<circle cx="120" cy="171" r="12" fill="#0074ae"/>
<text x="74" y="213" font-size="22">取得日</text><text x="348" y="162" font-size="23" font-weight="bold">1年以内に除却</text><text x="668" y="213" font-size="20">起点は市へ確認</text>
<rect x="40" y="260" width="880" height="160" rx="16" fill="#fff"/>
<text x="64" y="300" font-size="23" font-weight="bold">② 年度の中で「事業着手から完了」</text>
<path d="M120 343H830" fill="none" stroke="#b27935" stroke-width="7"/>
<path d="M120 328V358M830 328V358" stroke="#b27935" stroke-width="5"/>
<text x="64" y="391" font-size="22">2026年4月1日</text><text x="673" y="391" font-size="22">2027年3月31日</text>
<text x="336" y="334" font-size="21" font-weight="bold">年度をまたがない</text>
<text x="48" y="466" font-size="23" font-weight="bold">両方の条件が必要。1年の余裕＝翌年度も使える、ではない。</text>
<text x="48" y="506" font-size="18">完了報告も原則年度末まで。出典：磐田市「既存住宅取得等事業費補助金」</text></g></svg>