<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial"><rect width="960" height="560" rx="24" fill="#f0f6f8"/><style>text{font-family:Meiryo,sans-serif;fill:#183f51}.title{font-size:32px;font-weight:bold}.label{font-size:25px;font-weight:bold}.small{font-size:21px}.note{font-size:19px}</style><title>買い物前、一食分だけ決める</title><text x="48" y="62" class="title">買い物前、一食分だけ決める</text><text x="48" y="99" class="small">保存方法・期限・開封の有無を確認してから</text>
<rect x="48" y="136" width="245" height="330" rx="20" fill="white" stroke="#56839a" stroke-width="3"/><path d="M48 264H293M77 177V230M77 294V365" fill="none" stroke="#56839a" stroke-width="7"/>
