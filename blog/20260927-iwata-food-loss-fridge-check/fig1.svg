<rect x="365" y="270" width="545" height="94" rx="16" fill="#fff"/><text x="389" y="307" class="label">2　使う食事と人数を決める</text><text x="424" y="342" class="small">例：日曜の夕食、家で食べる人の分</text>
<path d="M632 371V393L620 382M632 393L644 382" fill="none" stroke="#197ea0" stroke-width="4"/>
<rect x="365" y="404" width="545" height="94" rx="16" fill="#d9ebcd"/><text x="389" y="441" class="label">3　不足分だけ買い物メモへ</text><text x="424" y="477" class="small">家にある物は、買い足さない</text>
<text x="48" y="534" class="note">筆者の提案。食べられるか不明な食品を無理に使わない。</text></svg>