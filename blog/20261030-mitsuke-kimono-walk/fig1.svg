<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
<title id="title">着物散策の日程と申込期限</title><desc id="desc">10月13日が申込締切、11月1日午前が開催予定。追加受付は要確認。</desc>
<rect width="900" height="480" rx="24" fill="#f4f8f6"/><text x="50" y="65" font-size="32" fill="#174c60">着物散策：日程と受付を分けて確認</text>
<path d="M130 225H770" stroke="#93b5ba" stroke-width="8"/><circle cx="250" cy="225" r="23" fill="#d27a41"/><circle cx="650" cy="225" r="23" fill="#14758a"/>
<text x="160" y="145" font-size="36" fill="#623a27">10月13日</text><text x="159" y="310" font-size="29" fill="#253f48">申込締切</text><text x="543" y="145" font-size="36" fill="#174c60">11月1日 午前</text><text x="561" y="310" font-size="29" fill="#253f48">開催予定</text>
<text x="50" y="405" font-size="24" fill="#384f53">追加受付は未確認。出発前に旧見付学校へ問い合わせ。</text>
