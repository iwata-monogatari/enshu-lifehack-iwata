<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><style>text{font-family:Meiryo,sans-serif;fill:#17394c}.title{font-size:30px;font-weight:bold}.head{font-size:23px;font-weight:bold}.note{font-size:19px}.small{font-size:16px}</style><rect width="960" height="540" rx="20" fill="#f1f7fa"/><title id="title">国保税の二つの納付カレンダー</title><desc id="desc">年金天引きは年6回、普通徴収は年8回。11月に第4期と第5期の納期がある。</desc><text x="40" y="52" class="title">国保税は「回数」と「時期」を分けて見る</text><text x="40" y="91" class="note">磐田市・2026年度の通常の予定 ／ 途中変更は通知書で確認</text><rect x="32" y="115" width="896" height="142" rx="16" fill="white"/><text x="52" y="151" class="head">年金天引き：年6回</text><rect x="60" y="170" width="125" height="68" rx="10" fill="#dcebf2"/><text x="122" y="199" text-anchor="middle" class="head">4月</text><text x="122" y="224" text-anchor="middle" class="small">仮徴収</text><rect x="204" y="170" width="125" height="68" rx="10" fill="#dcebf2"/><text x="266" y="199" text-anchor="middle" class="head">6月</text><text x="266" y="224" text-anchor="middle" class="small">仮徴収</text><rect x="348" y="170" width="125" height="68" rx="10" fill="#dcebf2"/><text x="410" y="199" text-anchor="middle" class="head">8月</text><text x="410" y="224" text-anchor="middle" class="small">仮徴収</text><rect x="492" y="170" width="125" height="68" rx="10" fill="#ffe3b1"/><text x="554" y="199" text-anchor="middle" class="head">10月</text><text x="554" y="224" text-anchor="middle" class="small">本徴収</text><rect x="636" y="170" width="125" height="68" rx="10" fill="#ffe3b1"/><text x="698" y="199" text-anchor="middle" class="head">12月</text><text x="698" y="224" text-anchor="middle" class="small">本徴収</text><rect x="780" y="170" width="125" height="68" rx="10" fill="#ffe3b1"/><text x="842" y="199" text-anchor="middle" class="head">翌年2月</text><text x="842" y="224" text-anchor="middle" class="small">本徴収</text><rect x="32" y="275" width="896" height="178" rx="16" fill="white"/><text x="52" y="311" class="head">普通徴収：期別は年8回（口座振替日も同じ）</text><rect x="52" y="330" width="102" height="74" rx="10" fill="#e4f1eb"/><text x="103" y="358" text-anchor="middle" class="small">第1期</text><text x="103" y="389" text-anchor="middle" class="note">7/31</text><rect x="161" y="330" width="102" height="74" rx="10" fill="#e4f1eb"/><text x="212" y="358" text-anchor="middle" class="small">第2期</text><text x="212" y="389" text-anchor="middle" class="note">8/31</text><rect x="270" y="330" width="102" height="74" rx="10" fill="#e4f1eb"/><text x="321" y="358" text-anchor="middle" class="small">第3期</text><text x="321" y="389" text-anchor="middle" class="note">9/30</text><rect x="379" y="330" width="102" height="74" rx="10" fill="#ffe3b1"/><text x="430" y="358" text-anchor="middle" class="small">第4期</text><text x="430" y="389" text-anchor="middle" class="note">11/2</text><rect x="488" y="330" width="102" height="74" rx="10" fill="#ffe3b1"/><text x="539" y="358" text-anchor="middle" class="small">第5期</text><text x="539" y="389" text-anchor="middle" class="note">11/30</text><rect x="597" y="330" width="102" height="74" rx="10" fill="#e4f1eb"/><text x="648" y="358" text-anchor="middle" class="small">第6期</text><text x="648" y="389" text-anchor="middle" class="note">12/25</text><rect x="706" y="330" width="102" height="74" rx="10" fill="#e4f1eb"/><text x="757" y="358" text-anchor="middle" class="small">第7期</text><text x="757" y="389" text-anchor="middle" class="note">翌年2/1</text><rect x="815" y="330" width="102" height="74" rx="10" fill="#e4f1eb"/><text x="866" y="358" text-anchor="middle" class="small">第8期</text><text x="866" y="389" text-anchor="middle" class="note">翌年3/1</text><text x="52" y="432" class="note">11月は2日・30日の2回。全期前納は7月31日（経過済み）。</text><text x="40" y="489" class="note">10月は本徴収月。自分の金額は通知書で確認する。</text><text x="40" y="518" class="small">出典：磐田市「国民健康保険税の納付」「市税の納付方法・納期限」2026-10-05確認</text></svg>