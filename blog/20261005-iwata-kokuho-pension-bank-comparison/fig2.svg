<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><style>text{font-family:Meiryo,sans-serif;fill:#17394c}.title{font-size:30px;font-weight:bold}.head{font-size:23px;font-weight:bold}.note{font-size:19px}.small{font-size:16px}</style><rect width="960" height="540" rx="20" fill="#f1f7fa"/><title id="title">現在の確認と変更手続きの順序</title><desc id="desc">今日は通知書の徴収方法を確認。変更を希望する場合は口座登録後に市へ申出し、変更可否と期限、開始を確認する。</desc><text x="40" y="52" class="title">今日の一歩と、変更を決めた後を分ける</text><rect x="40" y="88" width="880" height="98" rx="15" fill="#ffe3b1"/><text x="65" y="124" class="head">今日：通知書の「徴収方法」を確認</text><text x="65" y="159" class="note">年金天引き？ 普通徴収？ 口座振替か納付書かも確かめる</text><path d="M480 190v30m-10-10 10 10 10-10" fill="none" stroke="#0074ae" stroke-width="4"/><rect x="40" y="228" width="420" height="152" rx="15" fill="white"/><rect x="500" y="228" width="420" height="152" rx="15" fill="white"/><text x="62" y="269" class="head">変更するなら① 口座登録</text><text x="62" y="311" class="note">金融機関窓口 または</text><text x="62" y="345" class="note">磐田市Web口座振替受付サービス</text><path d="M466 306h28m-10-10 10 10-10 10" fill="none" stroke="#0074ae" stroke-width="4"/><text x="522" y="269" class="head">② 市へ納付方法の申出</text><text x="522" y="311" class="note">国保年金課 または</text><text x="522" y="345" class="note">各支所市民生活課</text><text x="40" y="423" class="head">変更可否・申出期限・開始時期は市に確認</text><text x="40" y="462" class="note">納付実績等による。年金天引きから納付書払いへの変更は不可。</text><text x="40" y="493" class="note">口座を登録しただけで、次回の年金天引きが止まるとは限らない。</text><text x="40" y="523" class="small">出典：磐田市「国民健康保険税の納付」2026-10-05確認</text></svg>