<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
<title id="title">申込みと参加確定を分けて記録する</title><desc id="desc">11月9日18時締切、応募多数の場合は抽選、開催は11月21日9時30分から正午。通知時期は未確認。</desc>
<rect width="960" height="560" rx="24" fill="#f4f6ed"/>
<g font-family="Meiryo,sans-serif" fill="#243d36"><text x="48" y="66" font-size="32" font-weight="bold">予定表には「申込」と「開催」を別々に</text><path d="M90 130V438" stroke="#42695c" stroke-width="8"/>
<circle cx="90" cy="143" r="16" fill="#0074ae"/><text x="135" y="145" font-size="29" font-weight="bold">11月9日（月）18時　申込締切</text><text x="135" y="185" font-size="23">市公式ページから電子申請</text>
<circle cx="90" cy="278" r="16" fill="#bc6b30"/><text x="135" y="276" font-size="29" font-weight="bold">応募多数の場合は抽選</text><text x="135" y="316" font-size="23">通知時期・方法は未確認。案内を確かめる</text>
<circle cx="90" cy="411" r="16" fill="#0074ae"/><text x="135" y="409" font-size="29" font-weight="bold">11月21日（土）9時30分～正午</text><text x="135" y="449" font-size="23">かぶと塚公園グラウンド／雨天中止</text>
<text x="48" y="506" font-size="23">申込済み ＝ 参加確定、ではありません。</text><text x="48" y="539" font-size="18">2026年の日程／磐田市公式案内を10月31日に確認</text></g></svg>
