<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
<title id="title">磐田モルック大会の参加条件を照合する</title><desc id="desc">一人ずつ学年と地域条件を確認し、3名以上のチームで予定を合わせる。</desc>
<rect width="960" height="560" rx="24" fill="#eef6f8"/>
<g font-family="Meiryo,sans-serif" fill="#153d50"><text x="48" y="66" font-size="32" font-weight="bold">声をかける前に、参加条件を共有</text>
<rect x="48" y="100" width="864" height="108" rx="16" fill="white"/><circle cx="101" cy="154" r="30" fill="#0074ae"/><text x="90" y="166" fill="white" font-size="30">1</text><text x="155" y="147" font-size="29" font-weight="bold">小学3年生以上</text><text x="155" y="184" font-size="23">きょうだいも、一人ずつ学年を確認</text>
<rect x="48" y="224" width="864" height="108" rx="16" fill="white"/><circle cx="101" cy="278" r="30" fill="#0074ae"/><text x="90" y="290" fill="white" font-size="30">2</text><text x="155" y="271" font-size="29" font-weight="bold">磐田市在住・在勤・在学</text><text x="155" y="308" font-size="23">住所だけで決めず、勤務・通学先も照合</text>
<rect x="48" y="348" width="864" height="108" rx="16" fill="white"/><circle cx="101" cy="402" r="30" fill="#0074ae"/><text x="90" y="414" fill="white" font-size="30">3</text><text x="155" y="395" font-size="29" font-weight="bold">3名以上で申込み</text><text x="155" y="432" font-size="23">11月21日（土）午前の予定を聞く</text>
<text x="48" y="506" font-size="23">3人限定ではありません。人数の上限は要確認。</text><text x="48" y="539" font-size="18">磐田市公式「磐田モルック大会」／2026年10月31日確認</text></g></svg>
