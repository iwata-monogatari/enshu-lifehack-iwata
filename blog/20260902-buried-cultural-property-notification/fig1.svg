<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" data-illustration="iwata-editorial"><title id="t">工事前の遺跡範囲確認の流れ</title><desc id="d">地番と地図を用意し、来課、電子申請、メールで照会する。電話での範囲確認はできない。遺跡に該当し掘削を伴う場合は届出と協議へ進む。</desc><rect width="1200" height="675" fill="#f5f1e8"/><text x="600" y="70" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#243b35">工事前の遺跡範囲確認</text><rect x="70" y="150" width="270" height="180" rx="24" fill="#fff" stroke="#42756b" stroke-width="5"/><text x="205" y="205" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#243b35">1　用意する</text><text x="205" y="255" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#243b35">全地番</text><text x="205" y="300" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#243b35">対象地の地図</text><path d="M355 240h90" stroke="#92713b" stroke-width="8"/><path d="M445 240l-22-15v30z" fill="#92713b"/><rect x="465" y="150" width="270" height="180" rx="24" fill="#fff" stroke="#42756b" stroke-width="5"/><text x="600" y="205" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#243b35">2　照会する</text><text x="600" y="255" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#243b35">来課・電子申請・メール</text><rect x="510" y="280" width="180" height="38" rx="19" fill="#7c302f"/><text x="600" y="307" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">電話確認は不可</text><path d="M750 240h90" stroke="#92713b" stroke-width="8"/><path d="M840 240l-22-15v30z" fill="#92713b"/><rect x="860" y="150" width="270" height="180" rx="24" fill="#fff" stroke="#42756b" stroke-width="5"/><text x="995" y="205" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#243b35">3　結果で分岐</text><text x="995" y="255" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#243b35">該当なし → 工事準備</text><text x="995" y="300" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#243b35">該当あり → 届出確認</text><rect x="200" y="425" width="800" height="140" rx="26" fill="#e4eee8" stroke="#42756b" stroke-width="4"/><text x="600" y="480" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#243b35">遺跡内で掘削を伴う工事</text><text x="600" y="530" text-anchor="middle" font-family="sans-serif" font-size="29" fill="#243b35">工事着手60日前までの届出を文化財課へ確認</text><text x="600" y="635" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#58635f">個別の工事条件は磐田市文化財課で確認</text></svg>
