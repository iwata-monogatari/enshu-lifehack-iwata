<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" data-illustration="iwata-editorial"><title id="t">工事前の共有確認票</title><desc id="d">全地番、対象範囲の地図、掘削範囲と深さ、着工予定日、照会担当者、文化財課の回答日を家族と施工会社で共有する確認票。</desc><rect width="1200" height="675" fill="#eef3ee"/><rect x="190" y="55" width="820" height="565" rx="26" fill="#fff" stroke="#365f57" stroke-width="6"/><text x="600" y="115" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#243b35">工事前の共有確認票</text><g font-family="sans-serif" font-size="27" fill="#243b35"><rect x="260" y="155" width="36" height="36" rx="4" fill="#fff" stroke="#92713b" stroke-width="4"/><text x="325" y="184">工事範囲にかかる全地番</text><line x1="700" y1="183" x2="930" y2="183" stroke="#a9b4af" stroke-width="3"/><rect x="260" y="220" width="36" height="36" rx="4" fill="#fff" stroke="#92713b" stroke-width="4"/><text x="325" y="249">対象範囲を囲んだ地図</text><line x1="700" y1="248" x2="930" y2="248" stroke="#a9b4af" stroke-width="3"/><rect x="260" y="285" width="36" height="36" rx="4" fill="#fff" stroke="#92713b" stroke-width="4"/><text x="325" y="314">掘削範囲と深さ</text><line x1="700" y1="313" x2="930" y2="313" stroke="#a9b4af" stroke-width="3"/><rect x="260" y="350" width="36" height="36" rx="4" fill="#fff" stroke="#92713b" stroke-width="4"/><text x="325" y="379">工事着手予定日</text><line x1="700" y1="378" x2="930" y2="378" stroke="#a9b4af" stroke-width="3"/><rect x="260" y="415" width="36" height="36" rx="4" fill="#fff" stroke="#92713b" stroke-width="4"/><text x="325" y="444">遺跡範囲の照会担当者</text><line x1="700" y1="443" x2="930" y2="443" stroke="#a9b4af" stroke-width="3"/><rect x="260" y="480" width="36" height="36" rx="4" fill="#fff" stroke="#92713b" stroke-width="4"/><text x="325" y="509">文化財課の回答日</text><line x1="700" y1="508" x2="930" y2="508" stroke="#a9b4af" stroke-width="3"/></g><rect x="350" y="548" width="500" height="44" rx="22" fill="#365f57"/><text x="600" y="579" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">家族・設計者・施工会社で一枚を共有</text></svg>
