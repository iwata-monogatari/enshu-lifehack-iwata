<svg xmlns="http://www.w3.org/2000/svg" width="640" height="730" viewBox="0 0 640 730" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">洪水と津波の読み分け</title><desc id="desc">同じ候補住所を、洪水と津波の二つの想定で別々に照合する。資料名・地点・凡例を確認する。</desc><rect width="640" height="730" rx="22" fill="#f3f7fa"/><g font-family="Meiryo, sans-serif" fill="#173c50"><text x="32" y="55" font-size="30" font-weight="bold">同じ住所を、別々の想定で読む</text>
<rect x="32" y="84" width="576" height="70" rx="14" fill="#173c50"/><text x="320" y="130" font-size="30" fill="white" text-anchor="middle">住み替え候補の住所を一つ</text>
<path d="M320 154V190" stroke="#173c50" stroke-width="4"/><path d="M308 178L320 190L332 178" fill="none" stroke="#173c50" stroke-width="4"/>
<rect x="32" y="205" width="576" height="170" rx="15" fill="#e1f0fa" stroke="#0074ae" stroke-width="2"/><text x="55" y="248" font-size="32" font-weight="bold">洪水の図</text><text x="55" y="293" font-size="27">降雨による浸水の想定を確認</text><text x="55" y="337" font-size="27">天竜川・太田川水系を区別する</text>
<rect x="32" y="397" width="576" height="150" rx="15" fill="#e5f3ef" stroke="#297666" stroke-width="2"/><text x="55" y="441" font-size="32" font-weight="bold">津波の図</text><text x="55" y="487" font-size="27">津波の浸水想定を別に確認</text><text x="55" y="526" font-size="25">対象範囲と候補地点を照合する</text>
<text x="32" y="595" font-size="28" font-weight="bold">両方で確かめること</text><text x="32" y="639" font-size="27">資料名 ／ 地点 ／ その図の凡例</text><text x="32" y="687" font-size="22">説明図です。実際の浸水範囲は示していません。</text></g></svg>