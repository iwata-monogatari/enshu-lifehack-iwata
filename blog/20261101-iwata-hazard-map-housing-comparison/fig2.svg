<svg xmlns="http://www.w3.org/2000/svg" width="640" height="750" viewBox="0 0 640 750" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">家族で残す候補住所の比較メモ</title><desc id="desc">洪水と津波の欄を分け、未確認を残し、URLと確認日を添える。</desc><rect width="640" height="750" rx="22" fill="#f3f7fa"/><g font-family="Meiryo, sans-serif" fill="#173c50"><text x="32" y="55" font-size="30" font-weight="bold">家族の比較メモ：候補は一軒</text><text x="32" y="100" font-size="25">住所：＿＿＿＿＿＿＿＿＿＿＿＿</text>
<rect x="32" y="128" width="576" height="170" rx="14" fill="white" stroke="#0074ae" stroke-width="2"/><text x="53" y="170" font-size="30" font-weight="bold">洪水の欄</text><text x="53" y="215" font-size="26">地区・川の名前・資料名</text><text x="53" y="258" font-size="26">地点と凡例を確認できたか</text>
<rect x="32" y="320" width="576" height="151" rx="14" fill="white" stroke="#297666" stroke-width="2"/><text x="53" y="363" font-size="30" font-weight="bold">津波の欄</text><text x="53" y="407" font-size="26">資料名・対象範囲・候補地点</text><text x="53" y="448" font-size="26">凡例を確認できたか</text>
<rect x="32" y="492" width="576" height="130" rx="14" fill="#fff1d6"/><text x="53" y="535" font-size="28" font-weight="bold">読めない欄は「未確認」</text><text x="53" y="580" font-size="26">次に聞く質問として、そのまま残す</text>
<text x="32" y="666" font-size="26">両図のURLと確認日を添える</text><text x="32" y="711" font-size="21">家族用の整理例。市の様式・安全判定ではありません。</text></g></svg>