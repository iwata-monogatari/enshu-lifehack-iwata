<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
<title id="title">磐田市のスポーツ施設を選ぶ順番</title><desc id="desc">運動の目的、人数、屋内外、予約と料金、自宅からの距離を順番に確認する図。</desc>
<rect width="1200" height="675" fill="#f5f1e8"/><rect x="55" y="48" width="1090" height="579" rx="28" fill="#fffdf8" stroke="#294c60" stroke-width="5"/>
<text x="92" y="115" font-family="sans-serif" font-size="38" font-weight="700" fill="#294c60">初めての施設選び</text><text x="92" y="155" font-family="sans-serif" font-size="22" fill="#53636b">施設名より先に、続けられる条件を決める</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="105" y="225" width="170" height="170" rx="22" fill="#d9eadf"/><text x="190" y="285" font-size="28" font-weight="700" fill="#214c3d">1</text><text x="190" y="330" font-size="24" fill="#214c3d">目的</text><text x="190" y="365" font-size="18" fill="#214c3d">歩く・球技・泳ぐ</text>
<rect x="315" y="225" width="170" height="170" rx="22" fill="#e7dfc8"/><text x="400" y="285" font-size="28" font-weight="700" fill="#634f2d">2</text><text x="400" y="330" font-size="24" fill="#634f2d">人数</text><text x="400" y="365" font-size="18" fill="#634f2d">一人・団体</text>
<rect x="525" y="225" width="170" height="170" rx="22" fill="#d6e8ed"/><text x="610" y="285" font-size="28" font-weight="700" fill="#294c60">3</text><text x="610" y="330" font-size="24" fill="#294c60">屋内外</text><text x="610" y="365" font-size="18" fill="#294c60">体育館・グラウンド</text>
<rect x="735" y="225" width="170" height="170" rx="22" fill="#f1ddc9"/><text x="820" y="285" font-size="28" font-weight="700" fill="#70442b">4</text><text x="820" y="330" font-size="24" fill="#70442b">予約・料金</text><text x="820" y="365" font-size="18" fill="#70442b">時間・空調・照明</text>
<rect x="945" y="225" width="170" height="170" rx="22" fill="#e4d9ec"/><text x="1030" y="285" font-size="28" font-weight="700" fill="#503c62">5</text><text x="1030" y="330" font-size="24" fill="#503c62">距離</text><text x="1030" y="365" font-size="18" fill="#503c62">自宅から続くか</text></g>
<path d="M278 310h30M488 310h30M698 310h30M908 310h30" stroke="#c17a46" stroke-width="8" stroke-linecap="round"/><rect x="225" y="475" width="750" height="84" rx="42" fill="#294c60"/><text x="600" y="528" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#fffdf8">候補を一施設に絞って、公式ページを確認</text>
</svg>
