<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">工事中の散策を決める三段階</title><desc id="desc">出発前に市公式の工事案内、到着時に規制表示、見学中に家族の疲れと帰り道を確認する。</desc><rect width="960" height="540" rx="24" fill="#f4f1e7"/><g font-family="sans-serif" fill="#243c39"><text x="48" y="66" font-size="34" font-weight="bold">工事中の見学は、確認しながら決める</text><text x="48" y="107" font-size="22">遠江国分寺跡へ家族で出かける前に</text><g fill="#fff" stroke="#bacbc3" stroke-width="2"><rect x="48" y="149" width="268" height="226" rx="16"/><rect x="346" y="149" width="268" height="226" rx="16"/><rect x="644" y="149" width="268" height="226" rx="16"/></g><g fill="#21655c" font-size="28" font-weight="bold"><text x="74" y="195">1　出発前</text><text x="372" y="195">2　到着時</text><text x="670" y="195">3　見学中</text></g><g font-size="23"><text x="74" y="248">市の工事案内を開く</text><text x="74" y="291">入口・経路が不明なら</text><text x="74" y="325">条件を添えて確認</text><text x="372" y="248">現地の規制表示を見る</text><text x="372" y="291">予定と違う場合は</text><text x="372" y="325">歩き方を変更する</text><text x="670" y="248">疲れと帰り道を考える</text><text x="670" y="291">全部を巡らず</text><text x="670" y="325">引き返してもよい</text></g><path d="M320 263 L340 263 M331 254 L340 263 L331 272 M618 263 L638 263 M629 254 L638 263 L629 272" fill="none" stroke="#21655c" stroke-width="3"/><rect x="48" y="407" width="864" height="92" rx="14" fill="#f0dfbb"/><text x="72" y="444" font-size="24" font-weight="bold">平日8:30〜17:00は工事の作業予定時間</text><text x="72" y="479" font-size="22">見学時間や、規制が解除される時間を示すものではありません。</text></g></svg>