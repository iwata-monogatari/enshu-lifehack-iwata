<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">基壇と礎石を分けて見る</title><desc id="desc">復元した土台と保存した古い石の関係を表す概念図。現地の配置や通行可能範囲ではない。</desc><rect width="960" height="560" rx="24" fill="#f4f1e7"/><g font-family="sans-serif" fill="#243c39"><text x="48" y="65" font-size="34" font-weight="bold">建物がなくても、土台と石から読む</text><text x="48" y="104" font-size="22">遠江国分寺跡・塔基壇を見るための概念図</text><path d="M100 322 L340 256 L580 322 L340 392 Z" fill="#d8b778" stroke="#6f6147" stroke-width="3"/><path d="M100 322 L100 362 L340 431 L340 392 Z" fill="#ae895c"/><path d="M340 392 L580 322 L580 362 L340 431 Z" fill="#c49b68"/><ellipse cx="333" cy="321" rx="61" ry="28" fill="#677d7b" stroke="#324d4b" stroke-width="4"/><ellipse cx="451" cy="325" rx="30" ry="16" fill="#677d7b"/><path d="M331 286 L331 178 L603 178" fill="none" stroke="#436a66" stroke-width="3"/><text x="622" y="183" font-size="26" font-weight="bold">礎石＝柱を支える石</text><text x="622" y="221" font-size="21">奈良時代の石を保存処理</text><path d="M488 384 L602 384" stroke="#977248" stroke-width="3"/><text x="622" y="371" font-size="26" font-weight="bold">基壇＝建物の土台</text><text x="622" y="409" font-size="21">遺構を守り、その上に復元</text><rect x="48" y="461" width="864" height="64" rx="12" fill="#e0e9df"/><text x="70" y="489" font-size="21">塔基壇は、古い石を見せるため高さを調整しています。</text><text x="70" y="514" font-size="17">説明用の図です。形・寸法・石の配置・見学経路は示していません。</text></g></svg>