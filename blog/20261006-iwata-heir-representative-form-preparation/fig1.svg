<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">相続人代表者届の五つの記入欄</title><desc id="desc">代表者、故人、他の相続人、登記状況、備考を分けて確認し、自署を頼む前に情報をそろえる。</desc><rect width="960" height="620" rx="24" fill="#edf5f9"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="44" y="60" font-size="30" font-weight="bold">自署を頼む前に、①〜⑤を整理</text><rect x="36" y="88" width="888" height="76" rx="12" fill="white"/><text x="58" y="117" font-size="23" font-weight="bold">① 通知を受け取る代表者</text><text x="58" y="147" font-size="21">住所・氏名の自署・生年月日・電話・故人との続柄</text><rect x="36" y="176" width="888" height="76" rx="12" fill="white"/><text x="58" y="205" font-size="23" font-weight="bold">② 亡くなった方</text><text x="58" y="235" font-size="21">死亡時の住所・氏名・ふりがな・死亡年月日</text><rect x="36" y="264" width="888" height="76" rx="12" fill="white"/><text x="58" y="293" font-size="23" font-weight="bold">③ 代表者以外の相続人</text><text x="58" y="323" font-size="21">住所・氏名の自署・故人との続柄</text><rect x="36" y="352" width="888" height="76" rx="12" fill="white"/><text x="58" y="381" font-size="23" font-weight="bold">④ 法務局への相続登記</text><text x="58" y="411" font-size="21">登記済／申請中／未申請の現状を確認</text><rect x="36" y="440" width="888" height="76" rx="12" fill="white"/><text x="58" y="469" font-size="23" font-weight="bold">⑤ 備考と添付資料</text><text x="58" y="499" font-size="21">変更なら前代表者。添付資料は家族の条件で確認</text><text x="44" y="568" font-size="22">相続人全員の自署は、市の記入例と照合。</text><text x="44" y="601" font-size="20">記入できない欄・欄不足・添付資料の疑問は資産税課へ。</text></g></svg>