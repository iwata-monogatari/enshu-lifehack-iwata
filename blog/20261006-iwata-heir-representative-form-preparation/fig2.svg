<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">市への申告と法務局の登記は別の期限</title><desc id="desc">相続人代表者届は同封案内の期限を確認。相続登記は個別の起算点を確認し、2024年4月1日より前の相続には2027年3月31日の案内がある。</desc><rect width="960" height="540" rx="24" fill="#edf5f9"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="44" y="60" font-size="30" font-weight="bold">返信と登記、期限は別々に記録</text><rect x="36" y="102" width="426" height="290" rx="16" fill="white"/><text x="60" y="148" font-size="27" font-weight="bold">市へ出す申告書</text><text x="60" y="204" font-size="23">通知を受け取る人などを申告</text><text x="60" y="251" font-size="23">期限：同封案内を確認</text><text x="60" y="298" font-size="23">不明な日付は資産税課へ</text><text x="60" y="345" font-size="23">提出しても名義変更は未了</text><rect x="498" y="102" width="426" height="290" rx="16" fill="white"/><text x="522" y="148" font-size="27" font-weight="bold">法務局での相続登記</text><text x="522" y="204" font-size="23">土地・家屋の名義変更</text><text x="522" y="251" font-size="23">期限：取得を知った時期等</text><text x="522" y="298" font-size="23">施行前の相続の案内</text><text x="522" y="345" font-size="23">2027年3月31日</text><text x="44" y="442" font-size="22">2024年4月1日より前の未登記の相続は、登記期限を確認。</text><text x="44" y="480" font-size="22">個別の起算点・遺産分割後の対応は法務局または司法書士へ。</text><text x="44" y="518" font-size="19">磐田市公式資料をもとに整理／2026年10月6日確認</text></g></svg>