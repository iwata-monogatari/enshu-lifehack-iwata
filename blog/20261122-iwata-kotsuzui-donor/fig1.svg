<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" data-illustration="iwata-editorial">
<rect width="760" height="520" fill="#fdf6ec"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">骨髄移植ドナー支援事業の助成金額（磐田市）</text>
<rect x="40" y="84" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="122" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">ドナー（提供した方）</text><text x="696" y="122" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">1日2万円</text><text x="64" y="152" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">通院・入院・面談の日数分（1回の提供につき7日まで）／上限14万円</text>
<rect x="40" y="192" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="230" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">ドナーが勤務する事業所</text><text x="696" y="230" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">1日1万円</text><text x="64" y="260" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">ドナーの通院・入院・面談の日数分（7日まで）／上限7万円</text>
<rect x="40" y="300" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="338" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">数え方の例：通院2日＋入院3日＋面談1日＝6日</text><text x="696" y="338" text-anchor="end" font-family="Meiryo, sans-serif" font-size="23" font-weight="bold" fill="#e8873a">ドナー12万円</text><text x="64" y="368" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">事業所は同じ6日で6万円（上限の範囲内）</text>
<text x="40" y="486" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：磐田市「骨髄移植ドナー支援事業助成」（ページ番号1007784、2026年1月13日更新）</text>
</svg>
