<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" data-illustration="iwata-editorial">
<rect width="760" height="520" fill="#fdf6ec"/>
<text x="40" y="56" font-family="Meiryo, sans-serif" font-size="26" font-weight="bold" fill="#222222">申請に必要な書類（磐田市）</text>
<rect x="40" y="84" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="122" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">ドナー：申請書（様式第1号）</text><text x="64" y="152" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">＋日本骨髄バンクが発行した「提供が完了したことを証明する書類」</text>
<rect x="40" y="192" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="230" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">事業所：申請書（様式第2号）</text><text x="64" y="260" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">＋完了証明書類＋雇用関係が分かる書類＋事業所の所在地が分かる書類</text>
<rect x="40" y="300" width="680" height="92" rx="14" fill="#ffffff"/><text x="64" y="338" font-family="Meiryo, sans-serif" font-size="21" fill="#333333">期限：提供を完了した日の翌日から1年以内</text><text x="64" y="368" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">提出先は健康増進課（iプラザ）。交付決定通知の郵送後に指定口座へ入金</text>
<text x="40" y="486" font-family="Meiryo, sans-serif" font-size="15" fill="#777777">出典：磐田市「骨髄移植ドナー支援事業助成」（ページ番号1007784、2026年1月13日更新）</text>
</svg>
