<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="磐田市のこども誰でも通園制度の申請から利用までの五段階を示した図" data-illustration="iwata-editorial" data-variant="2">
<defs><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f7fa"/><stop offset="1" stop-color="#f8f4e9"/></linearGradient><filter id="s2"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#163e51" flood-opacity=".16"/></filter><style>.title{font:700 29px 'Yu Gothic',sans-serif;fill:#163e51}.num{font:700 24px 'Yu Gothic',sans-serif;fill:#fff}.head{font:700 18px 'Yu Gothic',sans-serif;fill:#163e51}.body{font:15px 'Yu Gothic',sans-serif;fill:#46616e}.note{font:700 18px 'Yu Gothic',sans-serif;fill:#b34d32}</style></defs>
<rect width="1000" height="620" rx="24" fill="url(#bg2)"/><text x="58" y="58" class="body">磐田市・こども誰でも通園制度</text><text x="58" y="102" class="title">予約の前に、認定と初回面談がある</text>
<g filter="url(#s2)"><rect x="45" y="155" width="170" height="230" rx="18" fill="#fff"/><rect x="230" y="155" width="170" height="230" rx="18" fill="#fff"/><rect x="415" y="155" width="170" height="230" rx="18" fill="#fff"/><rect x="600" y="155" width="170" height="230" rx="18" fill="#fff"/><rect x="785" y="155" width="170" height="230" rx="18" fill="#fff"/></g>
<g><circle cx="85" cy="195" r="25" fill="#007a78"/><text x="85" y="203" text-anchor="middle" class="num">1</text><circle cx="270" cy="195" r="25" fill="#007a78"/><text x="270" y="203" text-anchor="middle" class="num">2</text><circle cx="455" cy="195" r="25" fill="#007a78"/><text x="455" y="203" text-anchor="middle" class="num">3</text><circle cx="640" cy="195" r="25" fill="#007a78"/><text x="640" y="203" text-anchor="middle" class="num">4</text><circle cx="825" cy="195" r="25" fill="#007a78"/><text x="825" y="203" text-anchor="middle" class="num">5</text></g>
<text x="65" y="250" class="head">認定申請</text><text x="65" y="280" class="body">つうえん</text><text x="65" y="303" class="body">ポータル</text>
<text x="250" y="250" class="head">登録</text><text x="250" y="280" class="body">審査後のメール</text><text x="250" y="303" class="body">からシステムへ</text>
<text x="435" y="250" class="head">初回面談</text><text x="435" y="280" class="body">予約して子どもの</text><text x="435" y="303" class="body">状態を共有する</text>
<text x="620" y="250" class="head">利用予約</text><text x="620" y="280" class="body">面談後に空き枠</text><text x="620" y="303" class="body">から日時を選ぶ</text>
<text x="805" y="250" class="head">当日利用</text><text x="805" y="280" class="body">連絡を受けられる</text><text x="805" y="303" class="body">状態にしておく</text>
<path d="M215 270h15M400 270h15M585 270h15M770 270h15" stroke="#b34d32" stroke-width="6"/>
<rect x="70" y="430" width="860" height="108" rx="16" fill="#fff" filter="url(#s2)"/><text x="100" y="472" class="note">月10時間は翌月へ繰り越せない。翌月分の前倒しもできない。</text><text x="100" y="510" class="body">空き、曜日、時間帯、昼食、30分単位の扱いは、予約画面と利用施設で確認する。</text>
<text x="58" y="580" class="body">出典：磐田市「乳児等通園支援事業（こども誰でも通園制度）」2026年9月3日確認</text>
</svg>
