<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">見回り報告から家族の判断へ</title><desc id="desc">現地の見回り、家族の受取担当、次の判断の三段階。未確認箇所を判断材料として残す。</desc><rect width="960" height="560" rx="24" fill="#f2f7fa"/><g font-family="Meiryo, sans-serif" fill="#183b50"><text x="48" y="65" font-size="30" font-weight="bold">写真が届いた後、誰が次を決める？</text><rect x="48" y="124" width="248" height="224" rx="18" fill="white" stroke="#9abccc" stroke-width="2"/><circle cx="93" cy="168" r="24" fill="#176d97"/><text x="86" y="177" font-size="25" fill="white">1</text><text x="68" y="231" font-size="25" font-weight="bold">現地の見回り</text><text x="68" y="280" font-size="21">実施日・確認箇所</text><text x="68" y="317" font-size="21">写真を報告</text><rect x="356" y="124" width="248" height="224" rx="18" fill="white" stroke="#9abccc" stroke-width="2"/><circle cx="401" cy="168" r="24" fill="#176d97"/><text x="394" y="177" font-size="25" fill="white">2</text><text x="376" y="231" font-size="25" font-weight="bold">家族の受取担当</text><text x="376" y="280" font-size="21">報告を家族へ共有</text><text x="376" y="317" font-size="21">不明点を整理</text><rect x="664" y="124" width="248" height="224" rx="18" fill="white" stroke="#9abccc" stroke-width="2"/><circle cx="709" cy="168" r="24" fill="#176d97"/><text x="702" y="177" font-size="25" fill="white">3</text><text x="684" y="231" font-size="25" font-weight="bold">次の判断</text><text x="684" y="280" font-size="21">家族の次回訪問</text><text x="684" y="317" font-size="21">別作業は条件確認</text><path d="M310 233 h26 m-10 -10 l10 10 -10 10" fill="none" stroke="#176d97" stroke-width="4"/><path d="M618 233 h26 m-10 -10 l10 10 -10 10" fill="none" stroke="#176d97" stroke-width="4"/><rect x="48" y="390" width="864" height="100" rx="16" fill="#e2edf0"/><text x="76" y="429" font-size="24" font-weight="bold">「見られなかった箇所」も判断材料</text><text x="76" y="468" font-size="21">写真に写らない範囲を、問題なしと読み替えない。</text><text x="48" y="530" font-size="18">著者の準備案。報告方法・実施時期・対応範囲は契約先へ確認。</text></g></svg>