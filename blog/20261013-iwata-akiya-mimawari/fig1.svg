<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">空き家見回りの作業範囲</title><desc id="desc">市が案内する目視と写真報告を、除草・室内や鍵・修理や緊急対応の確認事項と分けた図。</desc><rect width="960" height="560" rx="24" fill="#f2f7fa"/><g font-family="Meiryo, sans-serif" fill="#183b50"><text x="48" y="65" font-size="30" font-weight="bold">見回りと、別に確認する仕事</text><rect x="48" y="96" width="864" height="190" rx="18" fill="#dbeef8"/><path d="M85 178 L145 126 L205 178 V245 H85 Z" fill="white" stroke="#26759b" stroke-width="5"/><path d="M128 245 V202 H162 V245" fill="#bad9e8" stroke="#26759b" stroke-width="4"/><text x="246" y="142" font-size="23" font-weight="bold">市が案内する見回り</text><text x="246" y="185" font-size="26">目視で確認 → 写真付き報告</text><text x="246" y="225" font-size="25" font-weight="bold">掲載額 1回 2,240円</text><text x="246" y="262" font-size="18">2026年10月13日確認・現在の条件は契約先へ</text><rect x="48" y="324" width="276" height="144" rx="16" fill="white" stroke="#bdced8" stroke-width="2"/><text x="70" y="365" font-size="24" font-weight="bold">除草</text><text x="70" y="404" font-size="20">見回り料金に含むか</text><text x="70" y="439" font-size="20">別見積もりか確認</text><rect x="342" y="324" width="276" height="144" rx="16" fill="white" stroke="#bdced8" stroke-width="2"/><text x="364" y="365" font-size="24" font-weight="bold">室内・鍵</text><text x="364" y="404" font-size="20">室内作業の受託と</text><text x="364" y="439" font-size="20">鍵の扱いを確認</text><rect x="636" y="324" width="276" height="144" rx="16" fill="white" stroke="#bdced8" stroke-width="2"/><text x="658" y="365" font-size="24" font-weight="bold">修理・緊急対応</text><text x="658" y="404" font-size="20">対応の可否・範囲と</text><text x="658" y="439" font-size="20">連絡の順序を確認</text><text x="48" y="514" font-size="20">希望する作業を分けて伝えるための整理図（著者作成）</text></g></svg>