<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" data-illustration="iwata-editorial" role="img">
<title>磐田市の粗大ごみ処分：自己搬入と戸別収集の比較</title>
<rect width="960" height="520" rx="24" fill="#f0f7fb"/>
<g font-family="Meiryo, sans-serif">
<text x="44" y="60" font-size="28" font-weight="bold" fill="#173554">磐田市の粗大ごみ処分｜自己搬入 vs 戸別収集</text>
<rect x="44" y="90" width="410" height="380" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="74" y="135" font-size="22" font-weight="bold" fill="#2563eb">クリーンセンター自己搬入</text>
<text x="74" y="180" font-size="16" fill="#334155">【受付】月〜金 9:00〜16:00 / 祝日も開場</text>
<text x="74" y="215" font-size="16" fill="#334155">【予約】不要（直接車両で持ち込み）</text>
<text x="74" y="250" font-size="16" fill="#334155">【料金】重量制（10kgあたり150円など）</text>
<text x="74" y="285" font-size="16" fill="#334155">【積載】軽トラ・ミニバンなど自力運搬</text>
<text x="74" y="320" font-size="16" fill="#334155">【向く人】車がある・一気に大量処分したい</text>
<text x="74" y="365" font-size="15" fill="#16a34a" font-weight="bold">◎ 当日中に片付く・費用を最安に抑えられる</text>

<rect x="484" y="90" width="430" height="380" rx="16" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<text x="514" y="135" font-size="22" font-weight="bold" fill="#0891b2">電話予約による戸別収集</text>
<text x="514" y="180" font-size="16" fill="#334155">【受付】事前電話予約制（平日受付）</text>
<text x="514" y="215" font-size="16" fill="#334155">【収集】指定された収集日の朝8:30まで</text>
<text x="514" y="250" font-size="16" fill="#334155">【料金】点数制（粗大ごみ処理券を購入）</text>
<text x="514" y="285" font-size="16" fill="#334155">【排出】自宅の玄関先・道路際まで自力搬出</text>
<text x="514" y="320" font-size="16" fill="#334155">【向く人】車がない・単品を確実に捨てたい</text>
<text x="514" y="365" font-size="15" fill="#0284c7" font-weight="bold">◎ 運搬車両が不要・立ち会い不要で回収</text>
</g>
</svg>