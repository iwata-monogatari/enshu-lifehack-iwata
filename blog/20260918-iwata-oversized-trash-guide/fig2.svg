<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img">
<title>磐田市クリーンセンター持ち込み手順と注意点</title>
<rect width="960" height="560" rx="24" fill="#f8fafc"/>
<g font-family="Meiryo, sans-serif">
<text x="44" y="55" font-size="26" font-weight="bold" fill="#1e293b">クリーンセンター自己搬入の流れと特定品目の注意</text>

<rect x="44" y="85" width="260" height="180" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="64" y="125" font-size="18" font-weight="bold" fill="#1d4ed8">① 積み込みと分別</text>
<text x="64" y="160" font-size="14" fill="#334155">可燃物と不燃物を分ける</text>
<text x="64" y="190" font-size="14" fill="#334155">荷崩れ防止・ロープ固定</text>
<text x="64" y="220" font-size="14" fill="#334155">降ろしやすい順序で積載</text>

<rect x="344" y="85" width="260" height="180" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="364" y="125" font-size="18" font-weight="bold" fill="#1d4ed8">② 計量と場内荷下ろし</text>
<text x="364" y="160" font-size="14" fill="#334155">計量棟で車両総重量を計量</text>
<text x="364" y="190" font-size="14" fill="#334155">指示に従い指定場所へ投下</text>
<text x="364" y="220" font-size="14" fill="#334155">荷下ろしは自力対応が基本</text>

<rect x="644" y="85" width="260" height="180" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="664" y="125" font-size="18" font-weight="bold" fill="#1d4ed8">③ 再計量と現金精算</text>
<text x="664" y="160" font-size="14" fill="#334155">車両のみの重量を再計量</text>
<text x="664" y="190" font-size="14" fill="#334155">差引で正味重量を自動算出</text>
<text x="664" y="220" font-size="14" fill="#334155">計量棟で手数料を現金精算</text>

<rect x="44" y="300" width="860" height="210" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
<text x="74" y="340" font-size="20" font-weight="bold" fill="#b91c1c">⚠ センターに持ち込めない特定品目（持ち帰りになります）</text>
<text x="74" y="380" font-size="15" fill="#7f1d1d">• 家電4品目（テレビ・エアコン・冷蔵庫・洗濯機）：リサイクル券を購入し指定引取場所へ</text>
<text x="74" y="415" font-size="15" fill="#7f1d1d">• 家庭用パソコン：メーカー自主回収またはリネットジャパン等の宅配便回収を利用</text>
<text x="74" y="450" font-size="15" fill="#7f1d1d">• 処理困難物：タイヤ・バッテリー・消火器・農薬・塗料・石膏ボード・コンクリートガラ</text>
<text x="74" y="485" font-size="14" fill="#991b1b">※実家じまいで多発するトラブルです。事前に仕分けして別ルートで手配してください。</text>
</g>
</svg>