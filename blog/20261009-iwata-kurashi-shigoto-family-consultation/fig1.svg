<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">家族相談と支援決定の違い</title><desc id="desc">家族の相談から個別条件の確認へ進む図</desc><rect width="960" height="540" rx="24" fill="#f0f6fa"/><g font-family="Meiryo, sans-serif" fill="#173c52"><text x="48" y="65" font-size="30" font-weight="bold">家族から相談する入口はある</text><text x="48" y="105" font-size="20">相談の開始と、支援の決定は別の段階です</text><rect x="48" y="145" width="370" height="275" rx="18" fill="white" stroke="#0074ae" stroke-width="3"/><circle cx="95" cy="194" r="23" fill="#0074ae"/><text x="87" y="203" fill="white" font-size="25">1</text><text x="135" y="202" font-size="25" font-weight="bold">家族から話す</text><text x="75" y="260" font-size="22">生活費・仕事の困りごと</text><text x="75" y="306" font-size="22">本人が来所できない事情</text><text x="75" y="366" font-size="19">電話で相談範囲と予約を確認</text><path d="M445 278h62m-17-15 17 15-17 15" fill="none" stroke="#0074ae" stroke-width="5"/><rect x="535" y="145" width="377" height="275" rx="18" fill="white" stroke="#668b9c" stroke-width="3"/><circle cx="580" cy="194" r="23" fill="#486b7c"/><text x="572" y="203" fill="white" font-size="25">2</text><text x="620" y="202" font-size="25" font-weight="bold">個別に確かめる</text><text x="562" y="260" font-size="22">本人の意向・必要な同意</text><text x="562" y="306" font-size="22">支援の条件・必要な書類</text><text x="562" y="366" font-size="19">家族だけで完結とは限りません</text><text x="48" y="477" font-size="22" font-weight="bold">磐田市くらしと仕事相談センター　0538-32-8880</text><text x="48" y="510" font-size="16">市公式の相談案内をもとに編集／2026年10月9日確認</text></g></svg>