<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">家族相談の電話用メモ</title><desc id="desc">困りごと、来所困難な事情、窓口への質問を整理する図</desc><rect width="960" height="540" rx="24" fill="#f0f6fa"/><g font-family="Meiryo, sans-serif" fill="#173c52"><text x="48" y="65" font-size="30" font-weight="bold">電話の前に、三つの欄をつくる</text><text x="48" y="104" font-size="20">書ける範囲で十分。分からないことは「未確認」のまま</text><rect x="48" y="135" width="864" height="91" rx="14" fill="white"/><circle cx="88" cy="178" r="23" fill="#0074ae"/><text x="80" y="187" fill="white" font-size="25">1</text><text x="130" y="169" font-size="23" font-weight="bold">家族の困りごと</text><text x="130" y="204" font-size="20">生活費の負担／支払いの日付／連絡できる時間</text><rect x="48" y="240" width="864" height="91" rx="14" fill="white"/><circle cx="88" cy="283" r="23" fill="#0074ae"/><text x="80" y="292" fill="white" font-size="25">2</text><text x="130" y="274" font-size="23" font-weight="bold">本人が来所できない事情</text><text x="130" y="309" font-size="20">把握していることを伝える。理由は推測しない</text><rect x="48" y="345" width="864" height="91" rx="14" fill="white"/><circle cx="88" cy="388" r="23" fill="#0074ae"/><text x="80" y="397" fill="white" font-size="25">3</text><text x="130" y="379" font-size="23" font-weight="bold">窓口へ聞くこと</text><text x="130" y="414" font-size="20">家族だけの予約／本人への説明や同意／準備するもの</text><text x="48" y="481" font-size="20">これは電話用メモの例です。市指定の提出書類ではありません。</text><text x="48" y="514" font-size="17">今日の一歩：家族から相談したいと電話して、進め方を聞く</text></g></svg>