<svg xmlns="http://www.w3.org/2000/svg" width="440" height="720" viewBox="0 0 440 720" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">予定を決める確認</title><rect width="440" height="720" fill="#eff7fa"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="24" y="60" font-size="28" font-weight="bold">予定を決める確認</text><rect x="20" y="85" width="400" height="128" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="125" font-size="26" font-weight="bold">1 期限内かを確認</text><text x="36" y="173" font-size="26">期限経過後は別の行へ</text><rect x="20" y="245" width="400" height="128" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="285" font-size="26" font-weight="bold">2 使う機能を確認</text><text x="36" y="333" font-size="26">コンビニ？スマホ？</text><rect x="20" y="405" width="400" height="128" rx="16" fill="white" stroke="#0074ae"/><text x="36" y="445" font-size="26" font-weight="bold">3 提出期限を確認</text><text x="36" y="493" font-size="26">更新日と利用日を分ける</text><text x="24" y="590" font-size="24">スマホ側の再申請も確認</text><text x="24" y="638" font-size="24">出典：磐田市</text><text x="24" y="672" font-size="24">1016921・1013007</text><text x="24" y="704" font-size="24">2026年11月9日確認</text></g></svg>