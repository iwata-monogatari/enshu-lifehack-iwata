<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">家族の見学候補日を選ぶ</title><desc id="desc">会期内の開館日、10月18日の展示解説、10月25日の申込制親子企画を比較。</desc><style>text{font-family:Meiryo,"Noto Sans JP",sans-serif;fill:#173e50}.h{font-size:30px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.white{fill:#fff}</style><rect width="960" height="600" rx="24" fill="#f2f7f7"/><text x="48" y="58" class="small">見学する日を選ぶための比較</text><text x="48" y="104" class="h">家族の予定に合わせ、候補日を一つ</text>
<rect x="48" y="140" width="864" height="105" rx="15" fill="#fff"/><rect x="48" y="260" width="864" height="105" rx="15" fill="#fff"/><rect x="48" y="380" width="864" height="105" rx="15" fill="#fff"/>
<g fill="#dfedf1"><rect x="64" y="155" width="205" height="75" rx="9"/><rect x="64" y="275" width="205" height="75" rx="9"/><rect x="64" y="395" width="205" height="75" rx="9"/></g>
<text x="166" y="185" text-anchor="middle" class="label">会期内の開館日</text><text x="166" y="215" text-anchor="middle" class="small">10/10～12/6</text><text x="300" y="180" class="label">家族の時間に合わせて観覧</text><text x="300" y="215" class="body">休館日と、16:30の入場締切を確認</text>
<text x="166" y="305" text-anchor="middle" class="label">10月18日（日）</text><text x="166" y="335" text-anchor="middle" class="small">14:00～15:00</text><text x="300" y="300" class="label">定光寺住職らによる展示解説</text><text x="300" y="335" class="body">参加無料・要観覧料／1階受付前に集合</text>
<text x="166" y="425" text-anchor="middle" class="label">10月25日（日）</text><text x="166" y="455" text-anchor="middle" class="small">14:00～16:00</text><text x="300" y="420" class="label">親子鑑賞会＆ワークショップ</text><text x="300" y="455" class="body">事前申込・定員20人／無料・要観覧料</text>
<text x="48" y="530" class="small">親子企画：小中学生と保護者が対象。申込残枠は未確認。</text><text x="48" y="561" class="small">2026年10月9日確認。出発前に市公式案内で最新の条件を確認。</text></svg>