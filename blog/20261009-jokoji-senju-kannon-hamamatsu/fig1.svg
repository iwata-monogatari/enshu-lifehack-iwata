<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">定光寺の所蔵先と千手観音の公開会場</title><desc id="desc">所蔵先は磐田市前野の定光寺。2026年秋の公開会場は浜松市美術館。</desc><style>text{font-family:Meiryo,"Noto Sans JP",sans-serif;fill:#173e50}.h{font-size:30px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.white{fill:#fff}</style><rect width="960" height="540" rx="24" fill="#f2f7f7"/><text x="48" y="58" class="small">磐田の文化財を、浜松で見る</text><text x="48" y="104" class="h">所蔵先と、今回の公開会場は別です</text>
<rect x="48" y="142" width="365" height="250" rx="18" fill="#fff"/><rect x="548" y="142" width="365" height="250" rx="18" fill="#fff"/>
<path d="M180 206h100m-88 0v58m76-58v58m-98 0h120m-110-58 50-35 50 35" fill="none" stroke="#677d81" stroke-width="7" stroke-linejoin="round"/>
<path d="M655 204h147l-73-36zm15 12v47m38-47v47m39-47v47m39-47v47m-131 12h147" fill="none" stroke="#08749d" stroke-width="7" stroke-linejoin="round"/>
<text x="230" y="307" class="label" text-anchor="middle">所蔵先：定光寺</text><text x="230" y="348" class="body" text-anchor="middle">磐田市前野</text>
<path d="M437 265h81m-17-15 17 15-17 15" fill="none" stroke="#ba7946" stroke-width="6"/><text x="730" y="307" class="label" text-anchor="middle">公開会場：浜松市美術館</text><text x="730" y="348" class="body" text-anchor="middle">浜松市中央区松城町</text>
<rect x="48" y="421" width="865" height="72" rx="14" fill="#075676"/><text x="480" y="451" text-anchor="middle" class="label white">2026年10月10日（土）～12月6日（日）</text><text x="480" y="480" text-anchor="middle" class="small white">地図の目的地には「浜松市美術館」を入力</text><text x="48" y="523" class="small">概念図です。実際の建物・距離・経路を表すものではありません。</text></svg>