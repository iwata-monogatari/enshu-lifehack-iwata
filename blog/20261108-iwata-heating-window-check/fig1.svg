<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 650" width="240" height="650" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">窓の確認は、この順番で</title><desc id="desc">1　いつも使う一室、普段の場所から見る。、家全体へ広げない。。2　窓とカーテン、閉まり方・覆う範囲を、無理なく見える所だけ。。3　一文を家族と共有、購入や加工は別の判断。、借家は管理先にも確認。</desc><rect width="240" height="650" rx="12" fill="#f0f6fa"/><g font-family="Meiryo,sans-serif" fill="#183c51" font-size="14"><text x="16" y="32" font-size="16" font-weight="bold">窓の確認は、この順番で</text><rect x="12" y="58" width="216" height="133" rx="10" fill="white" stroke="#6c9aad"/><text x="24" y="87" font-weight="bold">1　いつも使う一室</text><text x="24" y="112">普段の場所から見る。</text><text x="24" y="137">家全体へ広げない。</text><rect x="12" y="213" width="216" height="133" rx="10" fill="white" stroke="#6c9aad"/><text x="24" y="242" font-weight="bold">2　窓とカーテン</text><text x="24" y="267">閉まり方・覆う範囲を</text><text x="24" y="292">無理なく見える所だけ。</text><rect x="12" y="368" width="216" height="133" rx="10" fill="white" stroke="#6c9aad"/><text x="24" y="397" font-weight="bold">3　一文を家族と共有</text><text x="24" y="422">購入や加工は別の判断。</text><text x="24" y="447">借家は管理先にも確認。</text><text x="16" y="553">観察手順は筆者の提案。</text><text x="16" y="576">節電効果は家庭ごとに異なる。</text><text x="16" y="599">出典：磐田市「節電」案内</text><text x="16" y="622">2026年11月8日確認</text></g></svg>