<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 650" width="240" height="650" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">買う前に残す短いメモ</title><desc id="desc">部屋、例：居間、対象は一室だけ。。気になる部分、例：カーテンの下側、金額の効果はまだ未確認。。だれに聞くか、例：家族／管理会社、記録の後で判断する。</desc><rect width="240" height="650" rx="12" fill="#f0f6fa"/><g font-family="Meiryo,sans-serif" fill="#183c51" font-size="14"><text x="16" y="32" font-size="16" font-weight="bold">買う前に残す短いメモ</text><rect x="12" y="58" width="216" height="133" rx="10" fill="white" stroke="#6c9aad"/><text x="24" y="87" font-weight="bold">部屋</text><text x="24" y="112">例：居間</text><text x="24" y="137">対象は一室だけ。</text><rect x="12" y="213" width="216" height="133" rx="10" fill="white" stroke="#6c9aad"/><text x="24" y="242" font-weight="bold">気になる部分</text><text x="24" y="267">例：カーテンの下側</text><text x="24" y="292">金額の効果はまだ未確認。</text><rect x="12" y="368" width="216" height="133" rx="10" fill="white" stroke="#6c9aad"/><text x="24" y="397" font-weight="bold">だれに聞くか</text><text x="24" y="422">例：家族／管理会社</text><text x="24" y="447">記録の後で判断する。</text><text x="16" y="553">記入例は架空の見本。</text><text x="16" y="576">市の点検基準ではありません。</text><text x="16" y="599">出典：磐田市「節電」案内</text><text x="16" y="622">構成：大石浩之</text></g></svg>