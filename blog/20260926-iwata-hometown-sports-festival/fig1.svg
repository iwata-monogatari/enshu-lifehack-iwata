<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial"><title id="title">4種目から3種目のスポーツ体験</title><desc id="desc">サッカー、ラグビー、バスケットボール、野球。各25分ずつ3種目を体験します。希望は保証されません。</desc><rect width="1000" height="560" rx="26" fill="#f8f4e9"/><g font-family="sans-serif" fill="#183e41"><text x="50" y="62" font-size="30" font-weight="700">どんな動きを、試してみたい？</text><text x="50" y="101" font-size="19">4つの競技から3つを選ぶ体験イベント</text><rect x="46" y="130" width="220" height="190" rx="20" fill="#e2eddd"/><g transform="translate(156,208)"><circle cx="0" cy="0" r="42" fill="#fff" stroke="#244747" stroke-width="3"/><path d="M0-20 19-6 12 17H-12L-19-6Z" fill="#244747"/><path d="M0-20V-41M19-6 40-13M12 17 24 35M-12 17-24 35M-19-6-40-13" stroke="#244747" stroke-width="3"/></g><text x="156" y="293" text-anchor="middle" font-size="23" font-weight="700">サッカー</text><rect x="285" y="130" width="220" height="190" rx="20" fill="#f3e0cf"/><g transform="translate(395,208)"><ellipse rx="50" ry="30" transform="rotate(-25)" fill="#b96447" stroke="#244747" stroke-width="3"/><path d="M-22 11 22-11M-16-2-10 11M-3-8 3 5M10-14 16-1" stroke="#fff6e7" stroke-width="3"/></g><text x="395" y="293" text-anchor="middle" font-size="23" font-weight="700">ラグビー</text><rect x="524" y="130" width="220" height="190" rx="20" fill="#f4e8bd"/><g transform="translate(634,208)"><circle r="42" fill="#e6a64c" stroke="#244747" stroke-width="3"/><path d="M-42 0H42M0-42V42M-30-30Q8 0-30 30M30-30Q-8 0 30 30" fill="none" stroke="#244747" stroke-width="3"/></g><text x="634" y="293" text-anchor="middle" font-size="23" font-weight="700">バスケットボール</text><rect x="763" y="130" width="220" height="190" rx="20" fill="#dbe9eb"/><g transform="translate(873,208)"><circle r="39" fill="#fff" stroke="#244747" stroke-width="3"/><path d="M-24-31Q5 0-24 31M24-31Q-5 0 24 31" fill="none" stroke="#bf674e" stroke-width="3"/><path d="M-21-20-11-23M-15-4-5-6M-18 16-8 18M21-20 11-23M15-4 5-6M18 16 8 18" stroke="#bf674e" stroke-width="3"/></g><text x="873" y="293" text-anchor="middle" font-size="23" font-weight="700">野球</text><path d="M110 349H890" stroke="#b7c6be" stroke-width="3"/><text x="500" y="385" text-anchor="middle" font-size="21">1種目25分 × 3種目</text><rect x="170" y="407" width="200" height="66" rx="16" fill="#2f6869"/><text x="270" y="449" text-anchor="middle" fill="#fff" font-size="23">体験 1・25分</text><rect x="400" y="407" width="200" height="66" rx="16" fill="#2f6869"/><text x="500" y="449" text-anchor="middle" fill="#fff" font-size="23">体験 2・25分</text><rect x="630" y="407" width="200" height="66" rx="16" fill="#2f6869"/><text x="730" y="449" text-anchor="middle" fill="#fff" font-size="23">体験 3・25分</text><text x="500" y="517" text-anchor="middle" font-size="19">希望に沿えず、選んでいない種目になる場合があります。</text></g></svg>