<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial"><title id="title">家庭のための四つの確認</title><desc id="desc">本人の希望、10月2日17時の申込期限、抽選結果と案内、当日の持ち物と送迎を確認します。</desc><rect width="1000" height="560" rx="26" fill="#f8f4e9"/><g font-family="sans-serif" fill="#183e41"><text x="50" y="60" font-size="29" font-weight="700">家族の準備は、申込前と結果確認後に分ける</text><text x="50" y="98" font-size="19">今日すべて決めず、次に確認することを見える形に。</text><rect x="45" y="135" width="445" height="172" rx="20" fill="#e2eddd"/><circle cx="88" cy="179" r="23" fill="#2f6869"/><text x="88" y="187" text-anchor="middle" fill="white" font-size="23">1</text><text x="125" y="188" font-size="25" font-weight="700">本人の希望</text><text x="74" y="237" font-size="21">試したい競技を聞く</text><text x="74" y="274" font-size="19">希望外の種目もあり</text><rect x="510" y="135" width="445" height="172" rx="20" fill="#f4e8bd"/><circle cx="553" cy="179" r="23" fill="#2f6869"/><text x="553" y="187" text-anchor="middle" fill="white" font-size="23">2</text><text x="590" y="188" font-size="25" font-weight="700">10月2日 17:00</text><text x="539" y="237" font-size="21">公式フォームで申込</text><text x="539" y="274" font-size="19">電話申込はできません</text><rect x="45" y="332" width="445" height="172" rx="20" fill="#dbe9eb"/><circle cx="88" cy="376" r="23" fill="#2f6869"/><text x="88" y="384" text-anchor="middle" fill="white" font-size="23">3</text><text x="125" y="385" font-size="25" font-weight="700">結果と案内</text><text x="74" y="434" font-size="21">申込と参加確定は別</text><text x="74" y="471" font-size="19">定員超過時は抽選</text><rect x="510" y="332" width="445" height="172" rx="20" fill="#f3e0cf"/><circle cx="553" cy="376" r="23" fill="#2f6869"/><text x="553" y="384" text-anchor="middle" fill="white" font-size="23">4</text><text x="590" y="385" font-size="25" font-weight="700">当日の準備</text><text x="539" y="434" font-size="21">室内シューズ・タオル・水筒</text><text x="539" y="471" font-size="19">送迎と受付の案内を確認</text><text x="500" y="539" text-anchor="middle" font-size="17">家庭用の準備図です。主催者の当日進行表ではありません。</text></g></svg>