<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc">
<title id="title">終活資料の受け取り方を比較</title><desc id="desc">磐田市公式を2026年11月3日確認</desc>
<rect width="760" height="680" rx="20" fill="#eef6fb"/>
<g font-family="Meiryo, sans-serif" fill="#123a52">
<text x="38" y="65" font-size="32" font-weight="bold">終活資料の受け取り方を比較</text>
<rect x="30" y="100" width="700" height="220" rx="18" fill="white" stroke="#bdd4e3"/>
<text x="52" y="146" font-size="30" font-weight="bold">ノート：冊子の配布は終了</text>
<text x="52" y="190" font-size="28">市公式のPDFを印刷して使う</text>
<text x="52" y="234" font-size="28">印刷できる環境があるか確認</text>
<rect x="30" y="345" width="700" height="240" rx="18" fill="white" stroke="#bdd4e3"/>
<text x="52" y="391" font-size="30" font-weight="bold">あんしんレター：窓口配布あり</text>
<text x="52" y="435" font-size="28">市民相談センター・各地域包括</text>
<text x="52" y="479" font-size="28">支援センターで配布。PDFも掲載</text>
<text x="52" y="523" font-size="28">来庁前に配布状況・開庁日を確認</text>
<text x="38" y="640" font-size="23">磐田市公式を2026年11月3日確認</text>
</g></svg>