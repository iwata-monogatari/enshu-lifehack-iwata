<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc">
<title id="title">今日は、入手方法を一つ確認</title><desc id="desc">大石の提案：資料を用意する負担から減らす</desc>
<rect width="760" height="680" rx="20" fill="#eef6fb"/>
<g font-family="Meiryo, sans-serif" fill="#123a52">
<text x="38" y="65" font-size="32" font-weight="bold">今日は、入手方法を一つ確認</text>
<rect x="30" y="100" width="700" height="140" rx="18" fill="white" stroke="#bdd4e3"/>
<text x="52" y="146" font-size="30" font-weight="bold">1　市公式で資料名を確かめる</text>
<text x="52" y="190" font-size="28">ノートとレターを分けて見る</text>
<rect x="30" y="260" width="700" height="140" rx="18" fill="white" stroke="#bdd4e3"/>
<text x="52" y="306" font-size="30" font-weight="bold">2　今使える入手経路を選ぶ</text>
<text x="52" y="350" font-size="28">PDFを開く／配布先を調べる</text>
<rect x="30" y="420" width="700" height="160" rx="18" fill="white" stroke="#bdd4e3"/>
<text x="52" y="466" font-size="30" font-weight="bold">3　記入や家族の判断は次へ</text>
<text x="52" y="510" font-size="28">全部を一日で決めなくてよい</text>
<text x="38" y="640" font-size="23">大石の提案：資料を用意する負担から減らす</text>
</g></svg>