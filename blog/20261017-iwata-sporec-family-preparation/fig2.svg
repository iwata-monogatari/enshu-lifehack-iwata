<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">終了時刻と、受付の締切は別</title><desc id="desc">10月18日（日）｜かぶと塚公園内の体育館・陸上競技場。雨天は一部種目が中止。荒天等の開催判断は市公式で確認。</desc><rect width="960" height="560" rx="24" fill="#edf5f8"/><g font-family="Meiryo, sans-serif" fill="#14394b"><text x="48" y="66" font-size="32" font-weight="bold">終了時刻と、受付の締切は別</text><text x="48" y="106" font-size="21">10月18日（日）｜かぶと塚公園内の体育館・陸上競技場</text><rect x="44" y="140" width="872" height="82" rx="14" fill="white"/><circle cx="83" cy="181" r="22" fill="#0074ae"/><text x="83" y="189" text-anchor="middle" font-size="23" fill="white">1</text><text x="128" y="190" font-size="27">イベント開始</text><text x="870" y="190" text-anchor="end" font-size="27" font-weight="bold" fill="#00688b">9時</text><rect x="44" y="238" width="872" height="82" rx="14" fill="white"/><circle cx="83" cy="279" r="22" fill="#0074ae"/><text x="83" y="287" text-anchor="middle" font-size="23" fill="white">2</text><text x="128" y="288" font-size="27">受付を済ませる</text><text x="870" y="288" text-anchor="end" font-size="27" font-weight="bold" fill="#00688b">13時まで</text><rect x="44" y="336" width="872" height="82" rx="14" fill="white"/><circle cx="83" cy="377" r="22" fill="#0074ae"/><text x="83" y="385" text-anchor="middle" font-size="23" fill="white">3</text><text x="128" y="386" font-size="27">イベント終了</text><text x="870" y="386" text-anchor="end" font-size="27" font-weight="bold" fill="#00688b">14時</text><text x="48" y="475" font-size="21">雨天は一部種目が中止。荒天等の開催判断は市公式で確認。</text><text x="48" y="518" font-size="17">磐田市公式案内をもとに作成｜2026年10月17日確認</text></g></svg>