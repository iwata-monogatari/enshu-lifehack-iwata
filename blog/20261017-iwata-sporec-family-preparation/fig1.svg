<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">親子で選ぶ前に、学年条件を確認</title><desc id="desc">磐田スポレク健康フェスティバル｜10月18日開催予定。注記のない種目も、参加できるかは当日の担当者へ確認。</desc><rect width="960" height="560" rx="24" fill="#edf5f8"/><g font-family="Meiryo, sans-serif" fill="#14394b"><text x="48" y="66" font-size="32" font-weight="bold">親子で選ぶ前に、学年条件を確認</text><text x="48" y="106" font-size="21">磐田スポレク健康フェスティバル｜10月18日開催予定</text><rect x="44" y="140" width="872" height="82" rx="14" fill="white"/><circle cx="83" cy="181" r="22" fill="#0074ae"/><text x="83" y="189" text-anchor="middle" font-size="23" fill="white">1</text><text x="128" y="190" font-size="27">ピックルボール</text><text x="870" y="190" text-anchor="end" font-size="27" font-weight="bold" fill="#00688b">小学4年生以上</text><rect x="44" y="238" width="872" height="82" rx="14" fill="white"/><circle cx="83" cy="279" r="22" fill="#0074ae"/><text x="83" y="287" text-anchor="middle" font-size="23" fill="white">2</text><text x="128" y="288" font-size="27">モルック</text><text x="870" y="288" text-anchor="end" font-size="27" font-weight="bold" fill="#00688b">小学1年生以上</text><rect x="44" y="336" width="872" height="82" rx="14" fill="white"/><circle cx="83" cy="377" r="22" fill="#0074ae"/><text x="83" y="385" text-anchor="middle" font-size="23" fill="white">3</text><text x="128" y="386" font-size="27">トランポリン大</text><text x="870" y="386" text-anchor="end" font-size="27" font-weight="bold" fill="#00688b">小学生以上</text><text x="48" y="475" font-size="21">注記のない種目も、参加できるかは当日の担当者へ確認。</text><text x="48" y="518" font-size="17">磐田市公式案内をもとに作成｜2026年10月17日確認</text></g></svg>