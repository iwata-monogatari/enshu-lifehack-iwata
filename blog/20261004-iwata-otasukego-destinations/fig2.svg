<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">親の通院先を一つ照合する順番</title><desc id="desc">親の自宅の地区、利用路線、医院の正式名と住所、指定施設一覧の順に照合し、確認日を残す。</desc><rect width="960" height="620" rx="28" fill="#f4f6ef"/><g font-family="Meiryo, Yu Gothic, sans-serif" fill="#193c36"><text x="44" y="55" font-size="32" font-weight="700" fill="#193c36">今日は「親の通院先 1件」を照合</text><text x="44" y="94" font-size="22" font-weight="400" fill="#193c36">2026年10月4日は日曜・運休。確認の準備をする日。</text><rect x="40" y="120" width="880" height="87" rx="18" fill="#ffffff"/><circle cx="84" cy="163" r="25" fill="#2f6754"/><text x="77" y="172" font-size="25" font-weight="700" fill="#ffffff">1</text><text x="130" y="154" font-size="25" font-weight="700" fill="#193c36">親の自宅の地区</text><text x="130" y="186" font-size="21" font-weight="400" fill="#193c36">家族の住所ではなく、親が利用する住所</text><path d="M84 209 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#2f6754" stroke-width="3"/><rect x="40" y="225" width="880" height="87" rx="18" fill="#ffffff"/><circle cx="84" cy="268" r="25" fill="#2f6754"/><text x="77" y="277" font-size="25" font-weight="700" fill="#ffffff">2</text><text x="130" y="259" font-size="25" font-weight="700" fill="#193c36">利用する路線</text><text x="130" y="291" font-size="21" font-weight="400" fill="#193c36">市公式ページから、該当路線の一覧を開く</text><path d="M84 314 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#2f6754" stroke-width="3"/><rect x="40" y="330" width="880" height="87" rx="18" fill="#ffffff"/><circle cx="84" cy="373" r="25" fill="#2f6754"/><text x="77" y="382" font-size="25" font-weight="700" fill="#ffffff">3</text><text x="130" y="364" font-size="25" font-weight="700" fill="#193c36">医院の正式名 ＋ 住所</text><text x="130" y="396" font-size="21" font-weight="400" fill="#193c36">同名の医院、旧名称、移転前の住所に注意</text><path d="M84 419 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#2f6754" stroke-width="3"/><rect x="40" y="435" width="880" height="87" rx="18" fill="#ffffff"/><circle cx="84" cy="478" r="25" fill="#2f6754"/><text x="77" y="487" font-size="25" font-weight="700" fill="#ffffff">4</text><text x="130" y="469" font-size="25" font-weight="700" fill="#193c36">指定施設一覧と照合・確認日を残す</text><text x="130" y="501" font-size="21" font-weight="400" fill="#193c36">掲載あり／削除を確認／見つからず要確認</text><text x="44" y="568" font-size="21" font-weight="400" fill="#193c36">掲載だけでは予約成立ではありません。条件と往復の便は別に確認。</text><text x="44" y="601" font-size="18" font-weight="400" fill="#566963">照合の手順を示す編集図。実際の走行経路ではありません。</text></g></svg>