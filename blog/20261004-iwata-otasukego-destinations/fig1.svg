<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">お助け号 7月改正の施設変更</title><desc id="desc">豊田線に1施設追加、福田線から3施設削除、磐田中央線は住所と名称が1件ずつ変更。</desc><rect width="960" height="660" rx="28" fill="#f4f6ef"/><g font-family="Meiryo, Yu Gothic, sans-serif" fill="#193c36"><text x="44" y="55" font-size="32" font-weight="700" fill="#193c36">お助け号｜2026年7月1日の変更</text><text x="44" y="94" font-size="22" font-weight="400" fill="#193c36">路線と変更の種類を、セットで確認</text><rect x="40" y="125" width="880" height="108" rx="18" fill="#dcebe0"/><text x="64" y="163" font-size="25" font-weight="700" fill="#193c36">豊田線</text><text x="270" y="163" font-size="22" font-weight="700" fill="#193c36">追加 1施設</text><text x="270" y="206" font-size="26" font-weight="400" fill="#193c36">みずのクリニック</text><rect x="40" y="247" width="880" height="145" rx="18" fill="#f5e6d8"/><text x="64" y="287" font-size="25" font-weight="700" fill="#193c36">福田線</text><text x="270" y="287" font-size="22" font-weight="700" fill="#193c36">削除 3施設</text><text x="270" y="326" font-size="25" font-weight="400" fill="#193c36">大橋医院・歯科クリニックあやな</text><text x="270" y="365" font-size="25" font-weight="400" fill="#193c36">寺田歯科医院</text><rect x="40" y="406" width="880" height="160" rx="18" fill="#e2eaf0"/><text x="64" y="446" font-size="25" font-weight="700" fill="#193c36">磐田中央線</text><text x="270" y="446" font-size="24" font-weight="700" fill="#193c36">住所変更：鈴木歯科医院（中泉）</text><text x="270" y="483" font-size="24" font-weight="400" fill="#193c36">中泉2982-1 → 中泉2502-2</text><text x="270" y="522" font-size="24" font-weight="400" fill="#193c36">名称変更：ハートセンター磐田</text><text x="270" y="555" font-size="24" font-weight="700" fill="#193c36">→ ハートクリニック磐田</text><text x="44" y="609" font-size="21" font-weight="400" fill="#193c36">削除は、その路線の指定施設から外れるという意味。</text><text x="44" y="638" font-size="17" font-weight="400" fill="#566963">出典：磐田市「運行改正内容」／2026年10月4日確認</text></g></svg>