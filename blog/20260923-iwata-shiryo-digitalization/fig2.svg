<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">家族と一つ確かめる記録メモ</title><desc id="desc">対象、場所、聞けたこと、未確認のことを分ける。全部を埋めなくてもよい。</desc><rect width="1000" height="620" rx="24" fill="#f6f2e9"/><g font-family="Meiryo,sans-serif" fill="#183f54"><text x="55" y="65" font-size="32" font-weight="bold">今日は、古い記録を一つ確かめる</text><text x="55" y="106" font-size="21">家族に聞く言葉：「これは誰の、何の記録だろう」</text><rect x="50" y="137" width="900" height="362" rx="16" fill="#fff" stroke="#c8c8bd" stroke-width="2"/><g stroke="#d7dfdf" stroke-width="2"><path d="M50 227h900 M50 317h900 M50 407h900 M330 137v362"/></g><g font-size="24" font-weight="bold"><text x="78" y="192">対象</text><text x="78" y="282">置いてあった場所</text><text x="78" y="372">家族に聞けたこと</text><text x="78" y="462">未確認のこと</text></g><g font-size="23" fill="#536874"><text x="365" y="192">写真・手紙・帳面など、一つだけ</text><text x="365" y="282">棚や箱、封筒との関係</text><text x="365" y="372">誰から聞いた話かも分ける</text><text x="365" y="462">「分からない」を、そのまま残す</text></g><text x="55" y="551" font-size="25" font-weight="bold">全部を埋めなくてよい。処分や公開は別に相談。</text><text x="55" y="587" font-size="19">記入例の項目を示した図です。実在する家庭の記録ではありません。</text></g></svg>