<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">原本・画像・説明をつなぐ</title><desc id="desc">原本を保管し、画像で内容を見て、説明メモで誰の何の記録かを伝える。原本の処分は別の判断。</desc><rect width="1000" height="540" rx="24" fill="#f1f6f7"/><g font-family="Meiryo,sans-serif" fill="#183f54"><text x="50" y="66" font-size="32" font-weight="bold">記録を遺す、三つの役割</text><text x="50" y="105" font-size="20">家庭で考えるための模式図</text><g fill="#fff" stroke="#adc6cf" stroke-width="2"><rect x="40" y="140" width="280" height="270" rx="18"/><rect x="360" y="140" width="280" height="270" rx="18"/><rect x="680" y="140" width="280" height="270" rx="18"/></g><g stroke="#287a98" stroke-width="5" fill="none"><path d="M139 173h72v82h-72z M155 195h40 M155 211h40 M155 227h24"/><rect x="443" y="179" width="114" height="71" rx="6"/><path d="M500 250v17 M470 268h60"/><path d="M774 175h88v83h-88z M790 194h55 M790 214h55 M790 234h35"/></g><g font-size="28" font-weight="bold" text-anchor="middle"><text x="180" y="306">紙の原本</text><text x="500" y="306">デジタル画像</text><text x="820" y="306">説明メモ</text></g><g font-size="20" text-anchor="middle"><text x="180" y="348">元の記録そのもの</text><text x="500" y="348">内容を見る手段</text><text x="820" y="348">誰の・何の記録か</text><text x="180" y="378">状態に応じて扱う</text><text x="500" y="378">原本と結び付ける</text><text x="820" y="378">不明な点も残す</text></g><path d="M322 275h35 M642 275h35" stroke="#287a98" stroke-width="5"/><rect x="40" y="443" width="920" height="60" rx="12" fill="#dcecf1"/><text x="500" y="482" font-size="25" text-anchor="middle" font-weight="bold">画像を作ることと、原本の処分は別の判断</text></g></svg>