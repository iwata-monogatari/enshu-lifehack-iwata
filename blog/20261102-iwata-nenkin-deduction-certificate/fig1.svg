<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1084" viewBox="0 0 480 1084" role="img" data-illustration="iwata-editorial"><title>国民年金控除証明書、2026年分の送付予定</title><rect width="480" height="1084" rx="20" fill="#f0f6f8"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="32" y="48" font-size="28" font-weight="bold">国民年金控除証明書</text><text x="32" y="88" font-size="28" font-weight="bold">2026年分の送付予定</text><text x="32" y="136" font-size="24">以下は到着日ではなく、</text><text x="32" y="176" font-size="24">日本年金機構の送付予定です。</text><rect x="16" y="216" width="448" height="232" rx="14" fill="#fff"/><rect x="16" y="216" width="6" height="232" rx="3" fill="#0074ae"/><text x="32" y="252" font-size="26" font-weight="bold">2026年1〜9月に納付</text><text x="32" y="300" font-size="26">電子：10月16日から</text><text x="32" y="340" font-size="26">　　　10月下旬まで順次</text><text x="32" y="380" font-size="26">郵送：10月23日から</text><text x="32" y="420" font-size="26">　　　11月上旬まで順次</text><rect x="16" y="468" width="448" height="232" rx="14" fill="#fff"/><rect x="16" y="468" width="6" height="232" rx="3" fill="#0074ae"/><text x="32" y="504" font-size="26" font-weight="bold">2026年10〜12月に初納付</text><text x="32" y="552" font-size="26">1〜9月の納付者を除きます。</text><text x="32" y="592" font-size="26">電子：2027年1月下旬から</text><text x="32" y="632" font-size="26">　　　順次送付</text><text x="32" y="672" font-size="26">郵送：2027年2月上旬</text><rect x="16" y="720" width="448" height="232" rx="14" fill="#fff"/><rect x="16" y="720" width="6" height="232" rx="3" fill="#0074ae"/><text x="32" y="756" font-size="26" font-weight="bold">電子受取の方に紙は届きません</text><text x="32" y="804" font-size="26">本人と受取方法を確認して、</text><text x="32" y="844" font-size="26">探す場所を決めます。</text><text x="32" y="884" font-size="26">納付時期が違う家族は、</text><text x="32" y="924" font-size="26">送付予定も分けて確認。</text><text x="32" y="992" font-size="24">出典：日本年金機構</text><text x="32" y="1032" font-size="24">2026年11月2日確認</text></g></svg>