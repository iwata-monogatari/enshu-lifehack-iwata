<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1164" viewBox="0 0 480 1164" role="img" data-illustration="iwata-editorial"><title>家族の準備メモ、名前と役割を分ける</title><rect width="480" height="1164" rx="20" fill="#f0f6f8"/><g font-family="Meiryo,sans-serif" fill="#123a52"><text x="32" y="48" font-size="28" font-weight="bold">家族の準備メモ</text><text x="32" y="88" font-size="28" font-weight="bold">名前と役割を分ける</text><text x="32" y="136" font-size="24">家庭での整理案です。</text><text x="32" y="176" font-size="24">申告書や控除の判定表では</text><text x="32" y="216" font-size="24">ありません。</text><rect x="16" y="256" width="448" height="232" rx="14" fill="#fff"/><rect x="16" y="256" width="6" height="232" rx="3" fill="#0074ae"/><text x="32" y="292" font-size="26" font-weight="bold">1　誰の年金？ 誰が払った？</text><text x="32" y="340" font-size="26">年金の対象者と払った人を、</text><text x="32" y="380" font-size="26">別々に書きます。</text><text x="32" y="420" font-size="26">途中で負担者が変わったら、</text><text x="32" y="460" font-size="26">その期間も確認。</text><rect x="16" y="508" width="448" height="232" rx="14" fill="#fff"/><rect x="16" y="508" width="6" height="232" rx="3" fill="#0074ae"/><text x="32" y="544" font-size="26" font-weight="bold">2　どこで受け取る？</text><text x="32" y="592" font-size="26">本人と、電子／郵送の</text><text x="32" y="632" font-size="26">受取設定を確認します。</text><text x="32" y="672" font-size="26">今日の一歩は、</text><text x="32" y="712" font-size="26">ここまででも大丈夫。</text><rect x="16" y="760" width="448" height="232" rx="14" fill="#fff"/><rect x="16" y="760" width="6" height="232" rx="3" fill="#0074ae"/><text x="32" y="796" font-size="26" font-weight="bold">3　会社に何を聞く？</text><text x="32" y="844" font-size="26">提出期限・提出形式と、</text><text x="32" y="884" font-size="26">そろわない場合の対応。</text><text x="32" y="924" font-size="26">控除の可否は、生計などの</text><text x="32" y="964" font-size="26">個別条件を伝えて確認。</text><text x="32" y="1032" font-size="24">大石浩之の整理案</text><text x="32" y="1072" font-size="24">個人番号・暗証番号は</text><text x="32" y="1112" font-size="24">メモに書かないでください。</text></g></svg>