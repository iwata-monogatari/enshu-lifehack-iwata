<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
<title id="title">磐田市の災害証明の分かれ方</title><desc id="desc">住家は罹災証明書、空き家など住家以外は被災証明書、火災は消防本部へ分かれる図</desc>
<rect width="1200" height="675" rx="32" fill="#f2f8fb"/><text x="600" y="74" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#123a52">地震・風水害等で建物が被害を受けた</text>
<path d="M600 105v70M600 175H235v55M600 175h365v55" stroke="#51778d" stroke-width="8" fill="none"/>
<rect x="70" y="230" width="430" height="265" rx="26" fill="#fff" stroke="#0074ae" stroke-width="5"/><text x="285" y="292" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#00679b">日常的に生活する住家</text><text x="285" y="350" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#263f4e">被害程度を市が判定</text><text x="285" y="423" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="700" fill="#123a52">罹災証明書</text>
<rect x="700" y="230" width="430" height="265" rx="26" fill="#fff" stroke="#dd7a00" stroke-width="5"/><text x="915" y="292" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#a95c00">空き家・物置・車など</text><text x="915" y="350" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#263f4e">被災した事実を証明</text><text x="915" y="423" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="700" fill="#123a52">被災証明書</text>
<rect x="700" y="520" width="430" height="92" rx="20" fill="#fff3df"/><text x="915" y="578" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#8c4a00">災害発生日から6か月以内</text><text x="75" y="585" font-family="sans-serif" font-size="27" fill="#3f5968">※火災は消防本部へ。個別条件は資産税課で確認</text>
</svg>
