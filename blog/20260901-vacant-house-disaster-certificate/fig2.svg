<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
<title id="title">離れて暮らす実家が被災したときの順番</title><desc id="desc">安全確認、写真、期限記録、確認、家の将来の判断という五段階を示す図</desc>
<rect width="1200" height="675" rx="32" fill="#f2f8fb"/><text x="600" y="76" text-anchor="middle" font-family="sans-serif" font-size="39" font-weight="700" fill="#123a52">決断より先に、失うと戻らない材料を守る</text>
<g font-family="sans-serif"><rect x="55" y="150" width="202" height="330" rx="24" fill="#fff" stroke="#0074ae" stroke-width="4"/><circle cx="156" cy="215" r="38" fill="#0074ae"/><text x="156" y="228" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">1</text><text x="156" y="300" text-anchor="middle" font-size="31" font-weight="700" fill="#123a52">安全確認</text><text x="156" y="350" text-anchor="middle" font-size="24" fill="#3f5968">人・道路・隣地</text><text x="156" y="390" text-anchor="middle" font-size="24" fill="#3f5968">危険なら入らない</text>
<rect x="277" y="150" width="202" height="330" rx="24" fill="#fff" stroke="#0074ae" stroke-width="4"/><circle cx="378" cy="215" r="38" fill="#0074ae"/><text x="378" y="228" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">2</text><text x="378" y="300" text-anchor="middle" font-size="31" font-weight="700" fill="#123a52">写真</text><text x="378" y="350" text-anchor="middle" font-size="24" fill="#3f5968">全景・四方向</text><text x="378" y="390" text-anchor="middle" font-size="24" fill="#3f5968">遠景と近景</text>
<rect x="499" y="150" width="202" height="330" rx="24" fill="#fff" stroke="#dd7a00" stroke-width="5"/><circle cx="600" cy="215" r="38" fill="#dd7a00"/><text x="600" y="228" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">3</text><text x="600" y="300" text-anchor="middle" font-size="31" font-weight="700" fill="#123a52">期限記録</text><text x="600" y="350" text-anchor="middle" font-size="24" fill="#3f5968">災害発生日</text><text x="600" y="390" text-anchor="middle" font-size="24" fill="#3f5968">6か月以内</text>
<rect x="721" y="150" width="202" height="330" rx="24" fill="#fff" stroke="#0074ae" stroke-width="4"/><circle cx="822" cy="215" r="38" fill="#0074ae"/><text x="822" y="228" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">4</text><text x="822" y="300" text-anchor="middle" font-size="31" font-weight="700" fill="#123a52">確認</text><text x="822" y="350" text-anchor="middle" font-size="24" fill="#3f5968">資産税課</text><text x="822" y="390" text-anchor="middle" font-size="24" fill="#3f5968">保険会社等</text>
<rect x="943" y="150" width="202" height="330" rx="24" fill="#fff" stroke="#0074ae" stroke-width="4"/><circle cx="1044" cy="215" r="38" fill="#0074ae"/><text x="1044" y="228" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">5</text><text x="1044" y="300" text-anchor="middle" font-size="31" font-weight="700" fill="#123a52">将来を判断</text><text x="1044" y="350" text-anchor="middle" font-size="24" fill="#3f5968">修理・管理</text><text x="1044" y="390" text-anchor="middle" font-size="24" fill="#3f5968">売却・解体</text></g>
<path d="M140 545h920" stroke="#8da9b8" stroke-width="8" stroke-linecap="round"/><path d="M1060 545l-30-20v40z" fill="#8da9b8"/><text x="600" y="612" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#123a52">家の結論は後でよい。写真と期限は今日押さえる</text>
</svg>
