<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
<title id="title">相続登記と相続人申告登記の比較</title><desc id="desc">相続登記は所有者と持分を登記簿へ反映し、相続人申告登記は申出人が相続人であることを示して期限内の基本義務へ対応する違いを表す図</desc>
<rect width="1200" height="675" rx="32" fill="#f2f8fb"/><text x="600" y="70" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="700" fill="#123a52">同じ「登記」でも、終わる仕事が違う</text>
<rect x="55" y="125" width="520" height="410" rx="28" fill="#fff" stroke="#0074ae" stroke-width="5"/><circle cx="120" cy="202" r="42" fill="#0074ae"/><path d="M98 204l15 15 30-36" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="195" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#00679b">相続登記</text><text x="315" y="270" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#123a52">所有者・持分を反映</text><text x="315" y="320" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263f4e">権利関係を公示する</text><rect x="110" y="365" width="410" height="74" rx="18" fill="#e6f3f9"/><text x="315" y="412" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#00679b">売却・担保設定へ進める</text><text x="315" y="493" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3f5968">遺産分割成立後の本来の手続</text>
<rect x="625" y="125" width="520" height="410" rx="28" fill="#fff" stroke="#dd7a00" stroke-width="5"/><circle cx="690" cy="202" r="42" fill="#dd7a00"/><path d="M670 180h40v48h-40zM678 194h24M678 207h24" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><text x="915" y="195" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#9b5800">相続人申告登記</text><text x="885" y="270" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#123a52">期限内の基本義務へ対応</text><text x="885" y="320" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#263f4e">申出人の氏名・住所を付記</text><rect x="680" y="365" width="410" height="74" rx="18" fill="#fff1dd"/><text x="885" y="412" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#8c4a00">名義変更・売却はできない</text><text x="885" y="493" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3f5968">遺産分割が未成立でも申出可</text>
<path d="M345 578h510" stroke="#6f8d9e" stroke-width="10" stroke-linecap="round"/><circle cx="600" cy="578" r="35" fill="#123a52"/><path d="M585 578l11 12 22-27" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="644" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#123a52">代替ではない。二段階で管理する</text>
</svg>
