<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="iwata-editorial">
<title id="title">遺産分割が未成立のときの登記の時系列</title><desc id="desc">対象不動産と期限を確認し、遺産分割が未成立なら相続人申告登記で基本義務へ対応し、成立後は3年以内に相続登記をする流れ</desc>
<rect width="1200" height="675" rx="32" fill="#f2f8fb"/><text x="600" y="70" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="700" fill="#123a52">申告で止めず、成立後の登記まで予定に置く</text>
<g font-family="sans-serif"><rect x="45" y="145" width="320" height="350" rx="26" fill="#fff" stroke="#0074ae" stroke-width="5"/><circle cx="205" cy="210" r="42" fill="#0074ae"/><text x="205" y="225" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">1</text><text x="205" y="298" text-anchor="middle" font-size="30" font-weight="700" fill="#123a52">対象と期限を確認</text><text x="205" y="352" text-anchor="middle" font-size="25" fill="#3f5968">土地・建物・名義人</text><text x="205" y="394" text-anchor="middle" font-size="25" fill="#3f5968">取得を知った日</text><rect x="90" y="430" width="230" height="48" rx="14" fill="#e6f3f9"/><text x="205" y="462" text-anchor="middle" font-size="22" font-weight="700" fill="#00679b">施行前から知る場合</text>
<rect x="440" y="145" width="320" height="350" rx="26" fill="#fff" stroke="#dd7a00" stroke-width="6"/><circle cx="600" cy="210" r="42" fill="#dd7a00"/><text x="600" y="225" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">2</text><text x="600" y="298" text-anchor="middle" font-size="30" font-weight="700" fill="#123a52">協議が未成立</text><text x="600" y="352" text-anchor="middle" font-size="25" fill="#3f5968">相続人申告登記</text><text x="600" y="394" text-anchor="middle" font-size="25" fill="#3f5968">申出人の基本義務へ対応</text><rect x="485" y="430" width="230" height="48" rx="14" fill="#fff1dd"/><text x="600" y="462" text-anchor="middle" font-size="22" font-weight="700" fill="#8c4a00">2027年3月31日まで</text>
<rect x="835" y="145" width="320" height="350" rx="26" fill="#fff" stroke="#0074ae" stroke-width="5"/><circle cx="995" cy="210" r="42" fill="#0074ae"/><text x="995" y="225" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">3</text><text x="995" y="298" text-anchor="middle" font-size="30" font-weight="700" fill="#123a52">協議が成立</text><text x="995" y="352" text-anchor="middle" font-size="25" fill="#3f5968">取得者が相続登記</text><text x="995" y="394" text-anchor="middle" font-size="25" fill="#3f5968">所有者・持分を反映</text><rect x="880" y="430" width="230" height="48" rx="14" fill="#e6f3f9"/><text x="995" y="462" text-anchor="middle" font-size="22" font-weight="700" fill="#00679b">成立日から3年以内</text></g>
<path d="M365 320h75M405 298l35 22-35 22" stroke="#8da9b8" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M760 320h75M800 298l35 22-35 22" stroke="#8da9b8" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="575" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#123a52">家の管理は、この時系列と別に続く</text><text x="600" y="625" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#3f5968">草木・雨漏り・保険・郵便物の担当と確認日も書く</text>
</svg>
