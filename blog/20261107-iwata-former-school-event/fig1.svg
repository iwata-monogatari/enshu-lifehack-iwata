<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-labelledby="t d" data-illustration="iwata-editorial"><title id="t">無料の範囲を確かめる</title><desc id="d">会場への入場、入場無料・申込不要、11月28日 10〜17時。個別の体験や販売、一部は有料、料金・対象・受付は別確認</desc><rect width="400" height="100%" rx="20" fill="#f0f6fa"/><g font-family="Meiryo, sans-serif" fill="#123a52"><text id="heading" x="24" y="47" font-size="26" font-weight="bold">無料の範囲を確かめる</text><rect x="20" y="76" width="360" height="131" rx="16" fill="white" stroke="#83afc7" stroke-width="2"/><text x="38" y="112" font-size="24" font-weight="bold">会場への入場</text><text x="38" y="152" font-size="22">入場無料・申込不要</text><text x="38" y="190" font-size="22">11月28日 10〜17時</text><rect x="20" y="225" width="360" height="131" rx="16" fill="white" stroke="#83afc7" stroke-width="2"/><text x="38" y="261" font-size="24" font-weight="bold">個別の体験や販売</text><text x="38" y="301" font-size="22">一部は有料</text><text x="38" y="339" font-size="22">料金・対象・受付は別確認</text><text x="24" y="399" font-size="20">出典：磐田市公式</text><text x="24" y="428" font-size="20">「旧岩田小学校の利活用」</text><text x="24" y="457" font-size="20">2026年11月7日確認</text></g></svg>