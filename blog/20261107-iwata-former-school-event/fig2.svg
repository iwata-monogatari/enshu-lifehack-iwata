<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 720" width="400" height="720" role="img" aria-labelledby="t d" data-illustration="iwata-editorial"><title id="t">家族の来場準備</title><desc id="d">1　時間を一つ選ぶ、家族が訪ねられそうな、候補時間を公式案内で確認。2　体験の条件を見る、料金や年齢条件は、入場条件と分けて確認。3　荷物を揃える、校舎に入る方は上履き、ごみを持ち帰る準備も</desc><rect width="400" height="100%" rx="20" fill="#f0f6fa"/><g font-family="Meiryo, sans-serif" fill="#123a52"><text id="heading" x="24" y="47" font-size="26" font-weight="bold">家族の来場準備</text><rect x="20" y="76" width="360" height="131" rx="16" fill="white" stroke="#83afc7" stroke-width="2"/><text x="38" y="112" font-size="24" font-weight="bold">1　時間を一つ選ぶ</text><text x="38" y="152" font-size="22">家族が訪ねられそうな</text><text x="38" y="190" font-size="22">候補時間を公式案内で確認</text><rect x="20" y="225" width="360" height="131" rx="16" fill="white" stroke="#83afc7" stroke-width="2"/><text x="38" y="261" font-size="24" font-weight="bold">2　体験の条件を見る</text><text x="38" y="301" font-size="22">料金や年齢条件は</text><text x="38" y="339" font-size="22">入場条件と分けて確認</text><rect x="20" y="374" width="360" height="131" rx="16" fill="white" stroke="#83afc7" stroke-width="2"/><text x="38" y="410" font-size="24" font-weight="bold">3　荷物を揃える</text><text x="38" y="450" font-size="22">校舎に入る方は上履き</text><text x="38" y="488" font-size="22">ごみを持ち帰る準備も</text><text x="24" y="548" font-size="20">出典：磐田市公式・大石の提案</text><text x="24" y="577" font-size="20">2026年11月7日確認</text></g></svg>