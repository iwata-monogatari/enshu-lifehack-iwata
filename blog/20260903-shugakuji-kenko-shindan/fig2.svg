<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-label="磐田市の就学時健康診断を受けるまでの五つの段取りを示した図。9月中の通知、会場確認、持ち物準備、前日再確認、当日受診の順で、迷わず進める流れが分かる" data-illustration="iwata-editorial" data-variant="2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#edf7ef"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="660" rx="32" fill="url(#bg)"/>
  <rect x="32" y="32" width="936" height="596" rx="26" fill="#ffffff" stroke="#d5e4ea" stroke-width="3"/>
  <text x="60" y="90" font-size="34" font-weight="700" fill="#174b63">当日までの5歩</text>
  <text x="60" y="126" font-size="20" fill="#4f6774">封筒を見つける前に、家族の予定を先に決めると迷いにくい。</text>
  <g transform="translate(60 170)">
    <rect width="160" height="300" rx="24" fill="url(#step)" stroke="#c9dbe4" stroke-width="2"/>
    <text x="24" y="42" font-size="24" font-weight="700" fill="#1f5b7a">1</text>
    <text x="24" y="78" font-size="22" font-weight="700" fill="#174b63">通知を受け取る</text>
    <text x="24" y="114" font-size="18" fill="#48606c">9月中に</text>
    <text x="24" y="140" font-size="18" fill="#48606c">水色封筒が届く</text>
  </g>
  <g transform="translate(246 170)">
    <rect width="160" height="300" rx="24" fill="url(#step)" stroke="#c9dbe4" stroke-width="2"/>
    <text x="24" y="42" font-size="24" font-weight="700" fill="#1f5b7a">2</text>
    <text x="24" y="78" font-size="22" font-weight="700" fill="#174b63">会場を確認</text>
    <text x="24" y="114" font-size="18" fill="#48606c">住民票登録地</text>
    <text x="24" y="140" font-size="18" fill="#48606c">をもとに見る</text>
  </g>
  <g transform="translate(432 170)">
    <rect width="160" height="300" rx="24" fill="url(#step)" stroke="#c9dbe4" stroke-width="2"/>
    <text x="24" y="42" font-size="24" font-weight="700" fill="#1f5b7a">3</text>
    <text x="24" y="78" font-size="22" font-weight="700" fill="#174b63">持ち物を集める</text>
    <text x="24" y="114" font-size="18" fill="#48606c">通知書、</text>
    <text x="24" y="140" font-size="18" fill="#48606c">健診票、母子手帳</text>
  </g>
  <g transform="translate(618 170)">
    <rect width="160" height="300" rx="24" fill="url(#step)" stroke="#c9dbe4" stroke-width="2"/>
    <text x="24" y="42" font-size="24" font-weight="700" fill="#1f5b7a">4</text>
    <text x="24" y="78" font-size="22" font-weight="700" fill="#174b63">前日に再確認</text>
    <text x="24" y="114" font-size="18" fill="#48606c">変更案内を</text>
    <text x="24" y="140" font-size="18" fill="#48606c">もう一度見る</text>
  </g>
  <g transform="translate(804 170)">
    <rect width="136" height="300" rx="24" fill="url(#step)" stroke="#c9dbe4" stroke-width="2"/>
    <text x="24" y="42" font-size="24" font-weight="700" fill="#1f5b7a">5</text>
    <text x="24" y="78" font-size="22" font-weight="700" fill="#174b63">当日受診</text>
    <text x="24" y="114" font-size="18" fill="#48606c">時間に余裕を</text>
    <text x="24" y="140" font-size="18" fill="#48606c">持って動く</text>
  </g>
  <g fill="none" stroke="#9ab8c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 320h18"/>
    <path d="M406 320h18"/>
    <path d="M592 320h18"/>
    <path d="M778 320h18"/>
    <path d="M236 320l-8-8"/>
    <path d="M236 320l-8 8"/>
    <path d="M422 320l-8-8"/>
    <path d="M422 320l-8 8"/>
    <path d="M608 320l-8-8"/>
    <path d="M608 320l-8 8"/>
    <path d="M794 320l-8-8"/>
    <path d="M794 320l-8 8"/>
  </g>
  <rect x="60" y="516" width="880" height="66" rx="18" fill="#f3fbf7" stroke="#cde4d4" stroke-width="2"/>
  <text x="84" y="556" font-size="20" fill="#2f5d3e">迷ったら、児童生徒支援課へ電話する前に、学校名と日付を紙に書き出しておく。</text>
</svg>
