<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-label="磐田市の就学時健康診断で先に確認する六つの点を示した図。対象、実施時期、通知の封筒、会場、持ち物、変更連絡の順に並び、2026年は全20校で10月1日から11月20日まで実施されることが分かる" data-illustration="iwata-editorial" data-variant="1">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff8f3"/>
      <stop offset="100%" stop-color="#d9ecf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6fbfd"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="660" rx="32" fill="url(#g1)"/>
  <rect x="32" y="32" width="936" height="596" rx="26" fill="url(#g2)" stroke="#c5dce7" stroke-width="3"/>
  <text x="60" y="92" font-size="34" font-weight="700" fill="#174b63">就学時健康診断の前に見る6点</text>
  <text x="60" y="128" font-size="20" fill="#4f6774">2026年は全20校で10月1日から11月20日まで。最初は竜洋東小学校、最後は向陽小学校。</text>
  <g transform="translate(60 168)">
    <rect width="170" height="150" rx="22" fill="#e9f5ee" stroke="#9dcbb1" stroke-width="2"/>
    <text x="24" y="44" font-size="26" font-weight="700" fill="#1d5a3a">対象</text>
    <text x="24" y="82" font-size="18" fill="#365b46">令和9年度</text>
    <text x="24" y="108" font-size="18" fill="#365b46">入学予定児</text>
  </g>
  <g transform="translate(252 168)">
    <rect width="170" height="150" rx="22" fill="#eef7ff" stroke="#9fc5df" stroke-width="2"/>
    <text x="24" y="44" font-size="26" font-weight="700" fill="#1f5b7a">時期</text>
    <text x="24" y="82" font-size="18" fill="#385d74">10月1日</text>
    <text x="24" y="108" font-size="18" fill="#385d74">〜11月20日</text>
  </g>
  <g transform="translate(444 168)">
    <rect width="170" height="150" rx="22" fill="#fff7eb" stroke="#e0c08b" stroke-width="2"/>
    <text x="24" y="44" font-size="26" font-weight="700" fill="#8a5a17">通知</text>
    <text x="24" y="82" font-size="18" fill="#6c5431">9月中に</text>
    <text x="24" y="108" font-size="18" fill="#6c5431">水色封筒で郵送</text>
  </g>
  <g transform="translate(636 168)">
    <rect width="170" height="150" rx="22" fill="#f2f0ff" stroke="#b5abd9" stroke-width="2"/>
    <text x="24" y="44" font-size="26" font-weight="700" fill="#5b4f9b">会場</text>
    <text x="24" y="82" font-size="18" fill="#5b4f9b">住民票登録地</text>
    <text x="24" y="108" font-size="18" fill="#5b4f9b">をもとに記載</text>
  </g>
  <g transform="translate(828 168)">
    <rect width="110" height="150" rx="22" fill="#ffeef0" stroke="#e1afb4" stroke-width="2"/>
    <text x="20" y="44" font-size="26" font-weight="700" fill="#8f4250">持物</text>
    <text x="20" y="84" font-size="18" fill="#7e4c55">6点</text>
    <text x="20" y="110" font-size="16" fill="#7e4c55">手帳ほか</text>
  </g>
  <g transform="translate(60 352)">
    <rect width="878" height="170" rx="24" fill="#ffffff" stroke="#d7e6ee" stroke-width="2"/>
    <text x="24" y="42" font-size="28" font-weight="700" fill="#174b63">変更が出たら前日までに確認</text>
    <text x="24" y="80" font-size="19" fill="#48606c">会場が変わる、案内が届かない、時間がずれる。こういうときは、その日の朝ではなく前日までに見直します。</text>
    <text x="24" y="116" font-size="19" fill="#48606c">児童生徒支援課の電話番号を先に控えておくと、探し物が1つ減ります。</text>
  </g>
  <g fill="none" stroke="#a2bbc8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 243h20"/>
    <path d="M422 243h20"/>
    <path d="M614 243h20"/>
    <path d="M806 243h12"/>
  </g>
  <g fill="#174b63">
    <circle cx="243" cy="243" r="7"/>
    <circle cx="435" cy="243" r="7"/>
    <circle cx="627" cy="243" r="7"/>
    <circle cx="819" cy="243" r="7"/>
  </g>
</svg>
