<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">申込みと体験会の時間軸</title><desc id="desc">2026年9月25日正午までに申込み、9月27日9時30分から正午まで小体育場で体験。</desc><rect width="960" height="520" rx="24" fill="#f0f6f8"/><g font-family="Meiryo,sans-serif" fill="#153e50"><text x="48" y="64" font-size="32" font-weight="bold">9月の体験会｜2つの日を分けて記録</text><path d="M130 172 H825" stroke="#177b98" stroke-width="8"/><path d="m810 157 20 15-20 15" fill="none" stroke="#177b98" stroke-width="8"/><circle cx="180" cy="172" r="14" fill="#bf542e"/><circle cx="680" cy="172" r="14" fill="#177b98"/><rect x="48" y="213" width="398" height="210" rx="20" fill="white"/><rect x="480" y="213" width="432" height="210" rx="20" fill="white"/><text x="76" y="256" font-size="23" fill="#a84021">申込締切</text><text x="76" y="307" font-size="34" font-weight="bold">9月25日（金）正午</text><text x="76" y="354" font-size="24">市公式 → ジュビロ×磐田市</text><text x="76" y="389" font-size="23">フォームで申込みを完了</text><text x="508" y="256" font-size="23" fill="#14758e">体験会当日</text><text x="508" y="307" font-size="34" font-weight="bold">9月27日（日）</text><text x="508" y="354" font-size="28">9:30 ～ 12:00</text><text x="508" y="389" font-size="23">磐田市総合体育館 小体育場</text><text x="48" y="475" font-size="22">2026年開催／無料・先着20名・要申込／残枠は未確認</text></g></svg>