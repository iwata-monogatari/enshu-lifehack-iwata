<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">体験会の持ち物と行き先</title><desc id="desc">飲み物、運動できる服装、体育館シューズを用意。会場は総合体育館の小体育場。</desc><rect width="960" height="560" rx="24" fill="#f0f6f8"/><g font-family="Meiryo,sans-serif" fill="#153e50"><text x="48" y="62" font-size="32" font-weight="bold">出発前に確認する3つの持ち物</text><g fill="white"><rect x="40" y="96" width="275" height="280" rx="20"/><rect x="342" y="96" width="275" height="280" rx="20"/><rect x="644" y="96" width="276" height="280" rx="20"/></g><g fill="#c5e4ee" stroke="#177b98" stroke-width="5"><rect x="143" y="151" width="70" height="128" rx="16"/><rect x="158" y="129" width="40" height="26" rx="5"/><path d="M443 143 399 171 419 209 445 193 V279 H517 V193 L543 209 563 171 519 143 Q480 174 443 143Z"/><path d="M695 233 716 177 746 188 757 224 817 241 Q858 241 867 268 H690Z"/><path d="M690 268 H869 V285 H690Z" fill="#fff"/></g><path d="M145 211 H211 M739 221 l28 -10 M752 236 l27 -10" stroke="#177b98" stroke-width="5"/><text x="177" y="332" font-size="27" text-anchor="middle">飲み物</text><text x="480" y="332" font-size="27" text-anchor="middle">運動できる服装</text><text x="782" y="332" font-size="27" text-anchor="middle">体育館シューズ</text><rect x="40" y="404" width="880" height="110" rx="20" fill="#153e50"/><text x="68" y="448" font-size="27" fill="white">行き先：磐田市総合体育館「小体育場」</text><text x="68" y="485" font-size="22" fill="white">9月27日の体験会は、通常の施設予約とは別に申込み</text></g></svg>