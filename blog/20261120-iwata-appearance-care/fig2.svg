<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">磐田市がん患者医療用補整具購入費助成の申請の流れ</title><rect width="440" height="600" fill="#eef5f6"/><g font-family="Meiryo,sans-serif" fill="#173f4c"><text x="24" y="58" font-size="27" font-weight="bold">申請の流れと期限</text><rect x="20" y="86" width="400" height="104" rx="16" fill="white" stroke="#2e5f6e"/><text x="36" y="122" font-size="25" font-weight="bold">1. 補整具を購入する</text><text x="36" y="162" font-size="23">領収書は原則原本を保管</text><rect x="20" y="210" width="400" height="104" rx="16" fill="white" stroke="#2e5f6e"/><text x="36" y="246" font-size="25" font-weight="bold">2. 書類を3点そろえる</text><text x="36" y="286" font-size="23">申請書・証明書類・領収書</text><rect x="20" y="334" width="400" height="104" rx="16" fill="white" stroke="#2e5f6e"/><text x="36" y="370" font-size="25" font-weight="bold">3. 健康増進課へ申請</text><text x="36" y="410" font-size="23">窓口・郵送・電子申請</text><text x="24" y="486" font-size="21">期限：購入した年度の3月31日まで</text><text x="24" y="520" font-size="21">1〜3月の購入は購入日から90日以内</text><text x="24" y="562" font-size="21">窓口はiプラザ3階（市の案内チラシより）</text></g></svg>
