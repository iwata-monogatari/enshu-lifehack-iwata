<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">磐田市がん患者医療用補整具購入費助成の対象と上限額</title><rect width="440" height="600" fill="#eef5f6"/><g font-family="Meiryo,sans-serif" fill="#173f4c"><text x="24" y="58" font-size="27" font-weight="bold">助成の対象と上限額</text><rect x="20" y="86" width="400" height="118" rx="16" fill="white" stroke="#2e5f6e"/><text x="36" y="124" font-size="25" font-weight="bold">医療用ウィッグ（全頭用）</text><text x="36" y="168" font-size="23">上限<tspan font-weight="bold" fill="#c2501e">2万円</tspan>・毛付き帽子とネットを含む</text><rect x="20" y="224" width="400" height="118" rx="16" fill="white" stroke="#2e5f6e"/><text x="36" y="262" font-size="25" font-weight="bold">乳房補整具① 補整下着</text><text x="36" y="306" font-size="23">上限<tspan font-weight="bold" fill="#c2501e">2万円</tspan>・パッドを含む</text><rect x="20" y="362" width="400" height="118" rx="16" fill="white" stroke="#2e5f6e"/><text x="36" y="400" font-size="25" font-weight="bold">乳房補整具② 人工乳房</text><text x="36" y="444" font-size="23">上限<tspan font-weight="bold" fill="#c2501e">10万円</tspan>・①②はどちらか一方</text><text x="24" y="530" font-size="21">購入額が上限未満なら実費分を助成</text><text x="24" y="562" font-size="21">それぞれ1人1回限り（市の案内チラシより）</text></g></svg>
