<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title"><title id="title">磐田市のがん患者アピアランスケア助成｜医療用ウィッグ上限2万円・人工乳房は上限10万円、申請は購入した年度末までの記事表紙</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e5f6e"/><stop offset="1" stop-color="#173f4c"/></linearGradient></defs><rect width="760" height="760" fill="url(#bg)"/><g fill="none" stroke="#9fd3dd" stroke-width="3" opacity="0.5"><path d="M0 622 Q 120 600 260 620 T 520 618 T 760 614"/><path d="M0 668 Q 140 646 300 666 T 600 664 T 760 660"/><path d="M0 712 Q 120 692 280 710 T 560 708 T 760 704"/></g><rect x="96" y="96" width="568" height="470" rx="26" fill="#ffffff"/><g font-family="Meiryo,sans-serif"><rect x="128" y="128" width="176" height="48" rx="24" fill="#dff1f4"/><text x="216" y="161" font-size="25" font-weight="bold" fill="#173f4c" text-anchor="middle">手続き・制度</text><text x="128" y="240" font-size="43" font-weight="bold" fill="#173f4c">がん治療の補整具に</text><text x="128" y="298" font-size="43" font-weight="bold" fill="#173f4c">市の助成があります</text><text x="128" y="356" font-size="43" font-weight="bold" fill="#173f4c">ウィッグ上限2万円</text><text x="128" y="416" font-size="30" fill="#173f4c">人工乳房は<tspan font-weight="bold" fill="#c2501e">上限10万円</tspan></text><text x="128" y="462" font-size="24" fill="#3d6070">申請は購入した年度末まで・それぞれ1回限り</text><text x="128" y="520" font-size="21" fill="#7b9aab">磐田ライフハック iwata.enshu-lifehack.com</text></g></svg>
