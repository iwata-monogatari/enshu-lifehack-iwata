<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title2 desc2" data-illustration="iwata-editorial">
<title id="title2">行政手続きの性質に応じた窓口の使い分けフロー</title>
<desc id="desc2">コンビニ交付、身近な4支所、本庁舎の使い分けを三段階で判断するフローチャート。</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<rect x="50" y="40" width="1100" height="595" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
<text x="90" y="100" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">行政手続きの性質に応じた三段階の使い分け</text>
<text x="90" y="136" font-family="sans-serif" font-size="19" fill="#64748b">目的の書類や用件に合わせて、最短ルートを選ぶ</text>

<!-- ステップ1: コンビニ -->
<rect x="90" y="170" width="310" height="380" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
<rect x="110" y="190" width="270" height="42" rx="8" fill="#3b82f6"/>
<text x="245" y="218" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#ffffff">第1段階：コンビニ交付</text>
<text x="245" y="260" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e40af">マイナンバーカード所持</text>
<text x="115" y="300" font-family="sans-serif" font-size="15" fill="#334155">• 住民票の写し（現年度）</text>
<text x="115" y="335" font-family="sans-serif" font-size="15" fill="#334155">• 印鑑登録証明書</text>
<text x="115" y="370" font-family="sans-serif" font-size="15" fill="#334155">• 所得課税証明書（最新）</text>
<rect x="110" y="420" width="270" height="100" rx="8" fill="#dbeafe"/>
<text x="245" y="455" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e40af">メリット</text>
<text x="245" y="485" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e3a8a">土日祝・夜間も即時交付</text>
<text x="245" y="505" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e3a8a">手数料が窓口より割安</text>

<!-- ステップ2: 4支所 -->
<rect x="445" y="170" width="310" height="380" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
<rect x="465" y="190" width="270" height="42" rx="8" fill="#22c55e"/>
<text x="600" y="218" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#ffffff">第2段階：市内4支所</text>
<text x="600" y="260" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#166534">窓口での対面交付・諸届</text>
<text x="470" y="300" font-family="sans-serif" font-size="15" fill="#334155">• 戸籍謄本・抄本・除票</text>
<text x="470" y="335" font-family="sans-serif" font-size="15" fill="#334155">• 固定資産評価証明・名寄帳</text>
<text x="470" y="370" font-family="sans-serif" font-size="15" fill="#334155">• 国保・国民年金の諸届</text>
<rect x="465" y="420" width="270" height="100" rx="8" fill="#dcfce7"/>
<text x="600" y="455" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#166534">メリット</text>
<text x="600" y="485" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14532d">本庁より近く待ち時間極小</text>
<text x="600" y="505" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14532d">駐車場から窓口まで近い</text>

<!-- ステップ3: 本庁舎 -->
<rect x="800" y="170" width="310" height="380" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
<rect x="820" y="190" width="270" height="42" rx="8" fill="#ef4444"/>
<text x="955" y="218" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#ffffff">第3段階：市役所本庁</text>
<text x="955" y="260" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#991b1b">専門部署の判断・許認可</text>
<text x="825" y="300" font-family="sans-serif" font-size="15" fill="#334155">• 建築確認・都市計画制限</text>
<text x="825" y="335" font-family="sans-serif" font-size="15" fill="#334155">• 開発許可・境界明示協議</text>
<text x="825" y="370" font-family="sans-serif" font-size="15" fill="#334155">• 農地転用・パスポート</text>
<rect x="820" y="420" width="270" height="100" rx="8" fill="#fee2e2"/>
<text x="955" y="455" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#991b1b">ポイント</text>
<text x="955" y="485" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7f1d1d">事前に担当課へ電話確認</text>
<text x="955" y="505" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7f1d1d">図面や必要書類を持参</text>

<text x="600" y="590" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">自分の用件がどの段階に該当するかを見極めてから出発する</text>
</svg>
