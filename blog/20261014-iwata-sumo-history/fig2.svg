<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">展示と関連イベントは、条件が違う</title><desc id="desc">無料・申込み不要は「展示観覧」の条件</desc><rect width="960" height="540" rx="24" fill="#f5f1e7"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#263f3d"><text x="48" y="64" font-size="32" font-weight="bold">展示と関連イベントは、条件が違う</text><text x="48" y="101" font-size="18">無料・申込み不要は「展示観覧」の条件</text><rect x="48" y="135" width="424" height="140" rx="16" fill="white" stroke="#d6dacb"/><circle cx="82" cy="172" r="19" fill="#dceae4"/><text x="75" y="179" font-size="20">1</text><text x="113" y="179" font-size="24" font-weight="bold">展示観覧</text><text x="72" y="215" font-size="19">11月4日〜12月25日／無料</text><text x="72" y="242" font-size="19">申込み不要・入館は16時まで</text><rect x="488" y="135" width="424" height="140" rx="16" fill="white" stroke="#d6dacb"/><circle cx="522" cy="172" r="19" fill="#dceae4"/><text x="515" y="179" font-size="20">2</text><text x="553" y="179" font-size="24" font-weight="bold">展示解説</text><text x="512" y="215" font-size="19">11月29日 10時</text><text x="512" y="242" font-size="19">12月13日 10時・14時／直接会場へ</text><rect x="48" y="292" width="424" height="140" rx="16" fill="white" stroke="#d6dacb"/><circle cx="82" cy="329" r="19" fill="#dceae4"/><text x="75" y="336" font-size="20">3</text><text x="113" y="336" font-size="24" font-weight="bold">歴史学習会</text><text x="72" y="372" font-size="19">11月29日 13時30分〜15時30分</text><text x="72" y="399" font-size="19">無料・先着50人／11月1日申込み開始</text><rect x="488" y="292" width="424" height="140" rx="16" fill="white" stroke="#d6dacb"/><circle cx="522" cy="329" r="19" fill="#dceae4"/><text x="515" y="336" font-size="20">4</text><text x="553" y="336" font-size="24" font-weight="bold">施設見学バスツアー</text><text x="512" y="372" font-size="19">12月4日 9時〜15時30分／昼食900円</text><text x="512" y="399" font-size="19">先着30人／11月1日申込み開始</text><text x="48" y="492" font-size="17">通常休館と特別開館、各催しの参加条件は、訪問前に市公式で確認。</text><text x="48" y="519" font-size="15" fill="#5a716b">磐田ライフハック｜公式案内をもとにした整理図・2026年10月14日確認</text></g></svg>