<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">磐田の相撲を読む、四つの入口</title><desc id="desc">文書・写真を手がかりに、題材と時代を分けて見る</desc><rect width="960" height="540" rx="24" fill="#f5f1e7"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#263f3d"><text x="48" y="64" font-size="32" font-weight="bold">磐田の相撲を読む、四つの入口</text><text x="48" y="101" font-size="18">文書・写真を手がかりに、題材と時代を分けて見る</text><rect x="48" y="135" width="424" height="140" rx="16" fill="white" stroke="#d6dacb"/><circle cx="82" cy="172" r="19" fill="#dceae4"/><text x="75" y="179" font-size="20">1</text><text x="113" y="179" font-size="24" font-weight="bold">江戸相撲の力士</text><text x="72" y="215" font-size="19">名前だけでなく地域との関係へ</text><text x="72" y="242" font-size="19">具体的な人物は展示の解説で確認</text><rect x="488" y="135" width="424" height="140" rx="16" fill="white" stroke="#d6dacb"/><circle cx="522" cy="172" r="19" fill="#dceae4"/><text x="515" y="179" font-size="20">2</text><text x="553" y="179" font-size="24" font-weight="bold">神社の奉納相撲</text><text x="512" y="215" font-size="19">行われた場所と機会に目を向ける</text><text x="512" y="242" font-size="19">神社ごとの事情を一括りにしない</text><rect x="48" y="292" width="424" height="140" rx="16" fill="white" stroke="#d6dacb"/><circle cx="82" cy="329" r="19" fill="#dceae4"/><text x="75" y="336" font-size="20">3</text><text x="113" y="336" font-size="24" font-weight="bold">相撲興行</text><text x="72" y="372" font-size="19">見せる人と、見に来る人の関係へ</text><text x="72" y="399" font-size="19">展示品の種類は現地の説明で確認</text><rect x="488" y="292" width="424" height="140" rx="16" fill="white" stroke="#d6dacb"/><circle cx="522" cy="329" r="19" fill="#dceae4"/><text x="515" y="336" font-size="20">4</text><text x="553" y="336" font-size="24" font-weight="bold">昭和・平成・令和</text><text x="512" y="372" font-size="19">江戸時代だけで終わらない展示</text><text x="512" y="399" font-size="19">続いたこと・変わったことを読む</text><text x="48" y="492" font-size="17">展示対象の整理図です。歴史の復元図や、特定の資料の複製ではありません。</text><text x="48" y="519" font-size="15" fill="#5a716b">磐田ライフハック｜公式案内をもとにした整理図・2026年10月14日確認</text></g></svg>