<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">紙を待たずに読むための順番</title><desc id="desc">今日の一歩は、PDFだけでなく公式の入口を保存</desc><rect width="960" height="640" rx="24" fill="#f0f7fb"/><g font-family="Meiryo, sans-serif" fill="#123a52"><text x="48" y="70" font-size="32" font-weight="bold">紙を待たずに読むための順番</text><text x="48" y="112" font-size="21">今日の一歩は、PDFだけでなく公式の入口を保存</text><rect x="48" y="150" width="864" height="112" rx="16" fill="white" stroke="#9bbbd0"/><circle cx="90" cy="190" r="23" fill="#0074ae"/><text x="90" y="198" text-anchor="middle" font-size="24" fill="white">1</text><text x="132" y="188" font-size="25" font-weight="bold">公式ページをお気に入りに保存</text><text x="132" y="222" font-size="21">磐田市「電子回覧板」ページ番号1011756</text><rect x="48" y="280" width="864" height="112" rx="16" fill="white" stroke="#9bbbd0"/><circle cx="90" cy="320" r="23" fill="#0074ae"/><text x="90" y="328" text-anchor="middle" font-size="24" fill="white">2</text><text x="132" y="318" font-size="25" font-weight="bold">年月・回数を選び、PDFの内容を読む</text><text x="132" y="352" font-size="21">対象者／行事日／申込期限／問い合わせ先を確認</text><rect x="48" y="410" width="864" height="112" rx="16" fill="white" stroke="#9bbbd0"/><circle cx="90" cy="450" r="23" fill="#0074ae"/><text x="90" y="458" text-anchor="middle" font-size="24" fill="white">3</text><text x="132" y="448" font-size="25" font-weight="bold">地区情報は関連リンクから探す</text><text x="132" y="482" font-size="21">紙の回覧は地域の手順で回す。別の連絡も見落とさない</text><text x="48" y="586" font-size="21">保存したPDFは、その時点の資料。判断前に公式ページへ戻る。</text><text x="48" y="618" font-size="16" fill="#526c7c">磐田ライフハック｜2026年10月2日確認・掲載範囲の整理図</text></g></svg>