<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">電子回覧板で読める範囲</title><desc id="desc">市全域の文書と、地区・自治会の連絡を分けて確認</desc><rect width="960" height="640" rx="24" fill="#f0f7fb"/><g font-family="Meiryo, sans-serif" fill="#123a52"><text x="48" y="70" font-size="32" font-weight="bold">電子回覧板で読める範囲</text><text x="48" y="112" font-size="21">市全域の文書と、地区・自治会の連絡を分けて確認</text><rect x="48" y="150" width="864" height="112" rx="16" fill="white" stroke="#9bbbd0"/><circle cx="90" cy="190" r="23" fill="#0074ae"/><text x="90" y="198" text-anchor="middle" font-size="24" fill="white">1</text><text x="132" y="188" font-size="25" font-weight="bold">市内全域に配付・回覧する文書</text><text x="132" y="222" font-size="21">電子回覧板に掲載されたPDFへ</text><rect x="48" y="280" width="864" height="112" rx="16" fill="white" stroke="#9bbbd0"/><circle cx="90" cy="320" r="23" fill="#0074ae"/><text x="90" y="328" text-anchor="middle" font-size="24" fill="white">2</text><text x="132" y="318" font-size="25" font-weight="bold">交流センター・地域づくり協議会の活動</text><text x="132" y="352" font-size="21">関連リンクから、地区名の付いた「だより」へ</text><rect x="48" y="410" width="864" height="112" rx="16" fill="white" stroke="#9bbbd0"/><circle cx="90" cy="450" r="23" fill="#0074ae"/><text x="90" y="458" text-anchor="middle" font-size="24" fill="white">3</text><text x="132" y="448" font-size="25" font-weight="bold">自治会独自のお知らせ</text><text x="132" y="482" font-size="21">すべての掲載は未確認。地域の案内・紙も確認</text><text x="48" y="586" font-size="21">「電子回覧板を見た」だけで、地域の連絡を全部読んだとは限らない。</text><text x="48" y="618" font-size="16" fill="#526c7c">磐田ライフハック｜2026年10月2日確認・掲載範囲の整理図</text></g></svg>