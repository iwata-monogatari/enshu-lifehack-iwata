<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">磐田市の産後ケア事業の3タイプ</title><rect width="440" height="600" fill="#f7eef2"/><g font-family="Meiryo,sans-serif" fill="#4e2a3e"><text x="24" y="58" font-size="27" font-weight="bold">産後ケアの3タイプ</text><rect x="20" y="86" width="400" height="118" rx="16" fill="white" stroke="#7c4a63"/><text x="36" y="124" font-size="25" font-weight="bold">宿泊型</text><text x="36" y="168" font-size="23">1泊2日以上が基本・食事つき</text><rect x="20" y="224" width="400" height="118" rx="16" fill="white" stroke="#7c4a63"/><text x="36" y="262" font-size="25" font-weight="bold">通所型</text><text x="36" y="306" font-size="23">1日6時間程度／半日3時間以内</text><rect x="20" y="362" width="400" height="100" rx="16" fill="white" stroke="#7c4a63"/><text x="36" y="400" font-size="25" font-weight="bold">訪問型</text><text x="36" y="440" font-size="23">自宅へ訪問・3時間以内</text><rect x="20" y="482" width="400" height="88" rx="16" fill="#fdf0e7" stroke="#c2501e"/><text x="36" y="520" font-size="23" font-weight="bold" fill="#8a3a14">対象は産後1年未満の母子</text><text x="36" y="552" font-size="21" fill="#8a3a14">2026年11月19日 市公式で確認</text></g></svg>