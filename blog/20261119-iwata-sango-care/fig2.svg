<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">産後ケア事業の申し込みから利用までの流れ</title><rect width="440" height="600" fill="#f7eef2"/><g font-family="Meiryo,sans-serif" fill="#4e2a3e"><text x="24" y="58" font-size="27" font-weight="bold">申し込みから利用まで</text><rect x="20" y="86" width="400" height="100" rx="16" fill="white" stroke="#7c4a63"/><text x="36" y="124" font-size="25" font-weight="bold">1 申請</text><text x="36" y="148" font-size="18">利用希望日（出産予定日）の</text><text x="36" y="176" font-size="18">2か月前から1週間前までに電子申請</text><rect x="20" y="206" width="400" height="100" rx="16" fill="white" stroke="#7c4a63"/><text x="36" y="244" font-size="25" font-weight="bold">2 承認決定通知書</text><text x="36" y="282" font-size="23">審査の後に市から届きます</text><rect x="20" y="326" width="400" height="100" rx="16" fill="white" stroke="#7c4a63"/><text x="36" y="364" font-size="25" font-weight="bold">3 施設を予約して利用</text><text x="36" y="402" font-size="23">当日は通知書と母子手帳を</text><rect x="20" y="446" width="400" height="124" rx="16" fill="#fdf0e7" stroke="#c2501e"/><text x="36" y="484" font-size="23" font-weight="bold" fill="#8a3a14">里帰り先は払い戻し</text><text x="36" y="522" font-size="21" fill="#8a3a14">契約外施設でも事前申請と承認で</text><text x="36" y="552" font-size="21" fill="#8a3a14">8割助成・申請は利用日から1年以内</text></g></svg>