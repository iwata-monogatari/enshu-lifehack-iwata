<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">費用と時間を家族の予定へ</title><rect width="960" height="540" fill="#edf6fa"/><g font-family="Meiryo, sans-serif" fill="#123a52"><text x="48" y="65" font-size="32" font-weight="bold">費用と時間を家族の予定へ</text><rect x="40" y="95" width="880" height="112" rx="16" fill="white"/><rect x="58" y="117" width="90" height="66" rx="12" fill="#0074ae"/><text x="103" y="159" fill="white" text-anchor="middle" font-size="25">費用</text><text x="172" y="139" font-size="27" font-weight="bold">1名500円・当日受付で徴収</text><text x="172" y="176" font-size="22">親子2人が参加者なら500円×2＝1,000円</text><rect x="40" y="223" width="880" height="112" rx="16" fill="white"/><rect x="58" y="245" width="90" height="66" rx="12" fill="#0074ae"/><text x="103" y="287" fill="white" text-anchor="middle" font-size="25">時間</text><text x="172" y="267" font-size="27" font-weight="bold">10月24日 9:30〜15:30</text><text x="172" y="304" font-size="22">開催枠は6時間・往復の移動は別</text><rect x="40" y="351" width="880" height="112" rx="16" fill="white"/><rect x="58" y="373" width="90" height="66" rx="12" fill="#0074ae"/><text x="103" y="415" fill="white" text-anchor="middle" font-size="25">確認</text><text x="172" y="395" font-size="27" font-weight="bold">同伴者の数え方・昼食・移動</text><text x="172" y="432" font-size="22">未確認事項は申込み前に市へ確認</text><text x="48" y="515" font-size="18">磐田市公式案内をもとに整理｜2026年10月15日確認</text></g></svg>