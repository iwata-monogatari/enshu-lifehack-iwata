<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-illustration="iwata-editorial" role="img" aria-labelledby="title"><title id="title">親子の参加資格を先に確認</title><rect width="960" height="540" fill="#edf6fa"/><g font-family="Meiryo, sans-serif" fill="#123a52"><text x="48" y="65" font-size="32" font-weight="bold">親子の参加資格を先に確認</text><rect x="40" y="95" width="880" height="112" rx="16" fill="white"/><rect x="58" y="117" width="90" height="66" rx="12" fill="#0074ae"/><text x="103" y="159" fill="white" text-anchor="middle" font-size="25">01</text><text x="172" y="139" font-size="27" font-weight="bold">親子それぞれの住所・勤務先</text><text x="172" y="176" font-size="22">市内在住・在勤が参加資格</text><rect x="40" y="223" width="880" height="112" rx="16" fill="white"/><rect x="58" y="245" width="90" height="66" rx="12" fill="#0074ae"/><text x="103" y="287" fill="white" text-anchor="middle" font-size="25">02</text><text x="172" y="267" font-size="27" font-weight="bold">小学生以下は保護者同伴</text><text x="172" y="304" font-size="22">子どもだけの送迎と分けて考える</text><rect x="40" y="351" width="880" height="112" rx="16" fill="white"/><rect x="58" y="373" width="90" height="66" rx="12" fill="#0074ae"/><text x="103" y="415" fill="white" text-anchor="middle" font-size="25">03</text><text x="172" y="395" font-size="27" font-weight="bold">市公式ページで受付状況を確認</text><text x="172" y="432" font-size="22">先着30名・残席は未確認</text><text x="48" y="515" font-size="18">磐田市公式案内をもとに整理｜2026年10月15日確認</text></g></svg>