<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial" role="img"><style>text{font-family:Meiryo,sans-serif;fill:#153c50}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.small{font-size:21px}.amount{font-size:42px;font-weight:700;fill:#0074ae}</style><rect width="960" height="560" rx="24" fill="#f0f7fa"/><title>交通費と移転費を分ける</title><text x="44" y="62" font-family="Meiryo,sans-serif" font-size="32" font-weight="700" fill="#153c50">地方就職学生支援金：二つの費用</text><rect x="38" y="98" width="426" height="310" rx="18" fill="white"/><rect x="496" y="98" width="426" height="310" rx="18" fill="white"/>
<g stroke="#0074ae" stroke-width="4" fill="none"><rect x="70" y="127" width="62" height="65" rx="9"/><path d="M80 150h42M80 168h42M82 192l-8 14m46-14 8 14"/><path d="M534 143l36-20 36 20v48l-36 20-36-20zM534 143l36 20 36-20m-36 20v48"/></g>
<text x="156" y="164" font-family="Meiryo,sans-serif" font-size="26" font-weight="700" fill="#153c50">交通費</text><text x="632" y="164" font-family="Meiryo,sans-serif" font-size="26" font-weight="700" fill="#153c50">移転費</text><text x="68" y="240" font-family="Meiryo,sans-serif" font-size="21" font-weight="400" fill="#153c50">就職活動の往復費用 × 1/2以内</text><text x="528" y="240" font-family="Meiryo,sans-serif" font-size="21" font-weight="400" fill="#153c50">移住の対象運搬費の実費</text><text x="68" y="308" font-family="Meiryo,sans-serif" font-size="42" font-weight="700" fill="#0074ae">上限 5,940円</text><text x="528" y="308" font-family="Meiryo,sans-serif" font-size="42" font-weight="700" fill="#0074ae">上限 66,000円</text><text x="68" y="369" font-family="Meiryo,sans-serif" font-size="21" font-weight="400" fill="#153c50">在学中の申請にも条件あり</text><text x="528" y="369" font-family="Meiryo,sans-serif" font-size="21" font-weight="400" fill="#153c50">敷金・家具購入費などは対象外</text><text x="48" y="462" font-family="Meiryo,sans-serif" font-size="26" font-weight="700" fill="#153c50">各1回申請可能。上限額＝受給額ではありません。</text><text x="48" y="511" font-family="Meiryo,sans-serif" font-size="21" font-weight="400" fill="#153c50">2026年10月11日 市公式確認／大学・住所・雇用等の要件は別に確認</text></svg>