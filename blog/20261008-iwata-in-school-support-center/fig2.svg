<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial"><rect width="960" height="560" rx="24" fill="#f0f6fa"/><g font-family="Meiryo, sans-serif" fill="#163e55"><text x="48" y="65" font-size="30" font-weight="bold">校内と校外、確認する話を分ける</text><rect x="48" y="111" width="410" height="303" rx="18" fill="#fff"/><rect x="502" y="111" width="410" height="303" rx="18" fill="#fff"/><text x="80" y="160" font-size="26" font-weight="bold">学校内の居場所</text><text x="80" y="213" font-size="22">在籍校で相談先を聞く</text><path d="M250 237v43m-10-10 10 10 10-10" fill="none" stroke="#0074ae" stroke-width="4"/><text x="80" y="319" font-size="21">本人・学校の状況に応じて</text><text x="80" y="355" font-size="21">利用方法を相談する</text><text x="534" y="160" font-size="26" font-weight="bold">校外の教育支援センター</text><text x="534" y="213" font-size="22">市公式の入級案内を読む</text><path d="M705 237v43m-10-10 10 10 10-10" fill="none" stroke="#0074ae" stroke-width="4"/><text x="534" y="319" font-size="21">校外の手順を、そのまま</text><text x="534" y="355" font-size="21">校内に当てはめない</text><text x="48" y="471" font-size="26" font-weight="bold">今日の一歩：在籍校の相談先を一つ確認</text><text x="48" y="512" font-size="21">相談先を知ることと、利用を決めることは別です。</text></g></svg>