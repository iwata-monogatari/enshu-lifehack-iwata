<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" data-illustration="iwata-editorial"><rect width="960" height="560" rx="24" fill="#f0f6fa"/><g font-family="Meiryo, sans-serif" fill="#163e55"><text x="48" y="65" font-size="30" font-weight="bold">全学府への設置 ≠ 全校への設置</text><text x="48" y="109" font-size="20">「学府」は中学校区。まず在籍校の状況を確認。</text><rect x="48" y="145" width="864" height="276" rx="18" fill="#fff" stroke="#1680ae" stroke-width="3"/><text x="78" y="184" font-size="24" font-weight="bold">一つの学府（説明用の模式図）</text><rect x="85" y="224" width="230" height="155" rx="12" fill="#dbedf8"/><rect x="365" y="224" width="230" height="155" rx="12" fill="#e8efee"/><rect x="645" y="224" width="230" height="155" rx="12" fill="#e8efee"/><text x="135" y="269" font-size="26">学校 A</text><text x="415" y="269" font-size="26">学校 B</text><text x="695" y="269" font-size="26">学校 C</text><rect x="107" y="296" width="186" height="55" rx="10" fill="#0074ae"/><text x="126" y="332" font-size="22" fill="white">校内の居場所</text><text x="397" y="327" font-size="20">設置・利用方法</text><text x="417" y="355" font-size="20">は要確認</text><text x="677" y="327" font-size="20">設置・利用方法</text><text x="697" y="355" font-size="20">は要確認</text><text x="48" y="468" font-size="23" font-weight="bold">同じ学府の他校を利用できる、とは限りません。</text><text x="48" y="509" font-size="19">実際の学校配置・利用条件を示す図ではありません。</text></g></svg>