<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">いつもの交差点を一つ、家族で確認</title><desc id="desc">架空の交差点と、場所・見えにくい方向・安全に待てる位置・未確認を記録するカード。現地の安全を判断する図ではない。</desc><rect width="960" height="600" rx="24" fill="#f1f6f8"/><g font-family="Meiryo, sans-serif" fill="#173b50"><text x="40" y="57" font-size="30" font-weight="bold">今日は、いつもの交差点を一つ</text><rect x="40" y="90" width="420" height="390" rx="18" fill="#fff"/><path d="M205 110h90v350h-90z M60 242h380v92H60z" fill="#cedae0"/><path d="M250 110v108m0 142v100M60 288h120m140 0h120" stroke="#fff" stroke-width="4" stroke-dasharray="12 10"/><rect x="84" y="135" width="86" height="67" rx="6" fill="#aac6ae"/><rect x="334" y="375" width="90" height="64" rx="6" fill="#bacbd7"/><circle cx="339" cy="182" r="32" fill="#fff0c7"/><text x="339" y="194" text-anchor="middle" font-size="36">?</text><text x="69" y="392" font-size="21">見え方は</text><text x="69" y="426" font-size="21">人・時間で変わる</text><rect x="490" y="90" width="430" height="390" rx="18" fill="#fff"/><text x="520" y="135" font-size="24" font-weight="bold">家族の確認カード</text><text x="520" y="189" font-size="23">場所：いつも通る一か所</text><path d="M520 208h365" stroke="#c5d5dd"/><text x="520" y="254" font-size="23">見えにくい方向は？</text><text x="520" y="315" font-size="23">安全に待てる位置は？</text><rect x="513" y="348" width="384" height="93" rx="12" fill="#e9f3f7"/><text x="530" y="384" font-size="22">分からない点は「未確認」</text><text x="530" y="418" font-size="20">地図だけで安全を決めない</text><text x="40" y="527" font-size="22">会話のための架空の模式図 ／ 執筆者の提案</text><text x="40" y="566" font-size="19" fill="#526c7c">実在の交差点や、通行・待機してよい位置を示すものではありません</text></g></svg>