<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" data-illustration="iwata-editorial" role="img" aria-labelledby="title desc"><title id="title">秋の交通安全運動と事前街頭日程</title><desc id="desc">2026年9月18日の街頭日程と9月21日から30日までの運動期間を区別する図。</desc><rect width="960" height="480" rx="24" fill="#f1f6f8"/><g font-family="Meiryo, sans-serif" fill="#173b50"><text x="48" y="58" font-size="30" font-weight="bold">2026年秋　日程を分けて読む</text><rect x="48" y="98" width="300" height="260" rx="18" fill="#fff"/><rect x="380" y="98" width="532" height="260" rx="18" fill="#fff"/><text x="72" y="144" font-size="22">市内一斉街頭キャンペーン</text><text x="72" y="205" font-size="43" font-weight="bold">9/18（金）</text><text x="72" y="251" font-size="24">事前広報・街頭指導</text><text x="72" y="319" font-size="19" fill="#526c7c">公表された実施日程</text><text x="410" y="144" font-size="24">秋の全国交通安全運動</text><text x="410" y="205" font-size="38" font-weight="bold">9/21（月）〜30（水）</text><rect x="410" y="240" width="468" height="42" rx="10" fill="#167695"/><text x="644" y="270" text-anchor="middle" font-size="23" fill="white">運動本体は10日間</text><text x="410" y="319" font-size="19" fill="#526c7c">街頭日程だけで終了と判断しない</text><text x="48" y="408" font-size="22">出典：磐田市「交通安全活動」・秋の実施要綱</text><text x="48" y="447" font-size="18" fill="#526c7c">2026年9月20日確認 ／ 実施結果の報告ではありません</text></g></svg>