<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" data-illustration="iwata-editorial" aria-labelledby="title desc"><title id="title">開催予定と受付案内の分け方</title><desc id="desc">9月30日の詳細案内を11月20日の講座に転用しない。11月20日は予定であり受付開始は未確認。</desc><rect width="900" height="570" rx="24" fill="#eef5f7"/><g font-family="Meiryo,sans-serif" fill="#173d50"><text x="45" y="65" font-size="30" font-weight="bold">日付が違えば、案内を分ける</text>
<path d="M90 150h720" stroke="#85acb9" stroke-width="8"/><circle cx="240" cy="150" r="15" fill="#788e98"/><circle cx="660" cy="150" r="15" fill="#237e9c"/>
<rect x="45" y="195" width="390" height="235" rx="20" fill="white"/><rect x="465" y="195" width="390" height="235" rx="20" fill="white"/>
<text x="75" y="248" font-size="32" font-weight="bold">9月30日</text><text x="75" y="293" font-size="24">第2回・iプラザ</text><text x="75" y="348" font-size="23">掲載中の詳しい募集案内</text><text x="75" y="391" font-size="23">10月24日時点では過去の日付</text>
<text x="495" y="248" font-size="32" font-weight="bold">11月20日 午後</text><text x="495" y="293" font-size="24">第3回・福田中央交流センター</text><text x="495" y="348" font-size="23">年間予定は「予定」の表示</text><text x="495" y="391" font-size="23">受付開始は確認できていない</text>
<text x="45" y="485" font-size="25" font-weight="bold">過去の対象条件・申込先を、そのまま使わない</text><text x="45" y="535" font-size="20">市公式ページを2026年10月24日に確認。最新の回別案内を確認してください。</text></g></svg>